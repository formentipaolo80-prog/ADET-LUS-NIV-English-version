e, leaks, and estimated tidal volume. A more detailed description of ventilatory modes and waveforms is provided in the next chapter.<\/p><p>The operating principle remains the same: every change in settings must have an explicit pathophysiological target and a documented reassessment.<\/p><h4>Ventilator terminology: why confusion arises<\/h4><p>Ventilator terminology is not completely standardized: the same ventilatory behavior may be described differently depending on the manufacturer, ventilator, and clinical setting. This chapter recalls only the terms required to interpret the parameters that can be set during NIV. Continuous Positive Airway Pressure (CPAP) applies a continuous pressure level throughout the respiratory cycle, without differential inspiratory assistance. BiLevel Positive Airway Pressure (BiLevel or BiPAP) uses an expiratory level, termed Expiratory Positive Airway Pressure (EPAP), and an inspiratory level, termed Inspiratory Positive Airway Pressure (IPAP). The difference between IPAP and EPAP represents pressure support, that is, the effective inspiratory assistance.<\/p><p>Pressure Support Ventilation (PSV), when delivered through a non-invasive interface, is referred to in this manual as NIV-PS. In this mode, the patient initiates inspiration and the ventilator delivers pressure support above the expiratory level. Spontaneous/Timed (S/T) mode adds a minimum backup rate to assisted spontaneous breaths. More complex modes—Pressure-Controlled Ventilation (PCV), Volume-Controlled Ventilation (VCV), Pressure-Regulated Volume Control (PRVC), Volume-Assured Pressure Support/Average Volume-Assured Pressure Support (VAPS/AVAPS), and Synchronized Intermittent Mandatory Ventilation (SIMV)—are discussed in Chapter 3. At this stage, it is sufficient to distinguish the meaning of the main parameters: expiratory pressure, inspiratory pressure, inspiratory support, inspired oxygen fraction, trigger, cycling, rise time, and backup rate.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_04.png\" alt=\"English teaching figure 4\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_04.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 2.1. NIV parameters: what they actually control. The main NIV parameters are not equivalent: EPAP/PEEP, IPAP, pressure support, FiO2, trigger, cycling, rise time, and backup rate have different targets.<\/p><h4>Parameters I can set<\/h4><p>EPAP/PEEP<\/p><p>EPAP and PEEP are closely related concepts, but they are not always identical in ventilator terminology. EPAP is the expiratory positive pressure used in BiLevel/NIV modes: it is the pressure level against which the patient exhales. PEEP is positive end-expiratory pressure, the traditional term used in invasive ventilation and in many CPAP/NIV modes. In clinical practice they are often used as functional equivalents, but the context should be kept in mind: EPAP when considering the two pressure levels of NIV-PS; PEEP when considering end-expiratory pressure and recruitment during CPAP.<\/p><p>Its main targets are:<\/p><p>improve oxygenation;<\/p><p>keep unstable alveolar units open;<\/p><p>counteract expiratory collapse;<\/p><p>reduce triggering effort in the presence of auto-PEEP;<\/p><p>modify heart–lung interaction.<\/p><p>In practice, EPAP is useful when there is a problem of aeration or intrinsic end-expiratory pressure. It is typically used in cardiogenic pulmonary edema, recruitable atelectasis, postoperative patients, obesity, and some COPD exacerbations with auto-PEEP.<\/p><p>Caution: increasing EPAP is not always beneficial. If the lung is not recruitable, higher pressure may overdistend already open regions. In COPD, it may worsen hyperinflation if it exceeds the level needed to counterbalance auto-PEEP. In patients with a vulnerable right ventricle, it may reduce venous return and worsen hemodynamic tolerance. EPAP/PEEP should not be increased simply “because the patient is doing poorly.” It should be increased when the problem is aeration, recruitment, oxygenation, or auto-PEEP.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Practical message\nAm I trying to open the lung and keep it open, or am I trying to unload the respiratory muscles?\nIn the first case I focus on EPAP/PEEP. In the second I focus on pressure support.<\/p><\/th><\/tr><\/table><\/div><p>IPAP and pressure support<\/p><p>IPAP is the pressure reached during assisted inspiration and is the sum of EPAP/PEEP and pressure support. Pressure support is therefore the difference between IPAP and EPAP.<\/p><p>Pressure support = IPAP − EPAP<\/p><p>Pressure support, rather than IPAP alone, determines the amount of inspiratory assistance. If EPAP is 6 cmH2O and IPAP is 16 cmH2O, pressure support is 10 cmH2O. If EPAP is increased to 8 cmH2O while IPAP remains at 16 cmH2O, pressure support falls to 8 cmH2O. This point is often underestimated.<\/p><p>Pressure support is mainly used to:<\/p><p>reduce inspiratory work;<\/p><p>increase tidal volume;<\/p><p>improve alveolar ventilation;<\/p><p>reduce PaCO2;<\/p><p>reduce the load on the diaphragm and accessory muscles.<\/p><p>It is the main parameter to adjust in hypercapnic and fatigued patients, such as those with acute COPD exacerbation, obesity hypoventilation, neuromuscular disease, and respiratory muscle fatigue.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_05.png\" alt=\"English teaching figure 5\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_05.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 2.2. PSV or NIV-PS. The patient activates the inspiratory trigger; the ventilator delivers pressure support above the EPAP/PEEP level and ends assistance when inspiratory flow falls below the cycling threshold.<\/p><p>Caution: pressure support that is too low leaves the patient tachypneic and fatigued. Excessive pressure support may generate excessive tidal volumes, asynchronies, discomfort, high leaks, and over-assistance. In de novo hypoxemic respiratory failure, high tidal volumes during NIV-PS are associated with an increased risk of failure and possible lung injury. Pressure support should not be increased simply “because oxygen saturation is low.” It should be increased when the problem is alveolar ventilation, hypercapnia, or work of breathing [4].<\/p><p>FiO2<\/p><p>FiO2 is used to achieve the oxygenation target, but it does not correct the mechanism of respiratory failure. Increasing FiO2 may be necessary, but it should not become a shortcut that avoids reassessment of the lung and work of breathing.<\/p><p>Persistently high FiO2 indicates that the system is not stable or that the selected respiratory support is not correcting the underlying problem. The treatment is missing its target. In these situations, reassess:<\/p><p>LUS and loss of aeration;<\/p><p>recruitability;<\/p><p>respiratory rate;<\/p><p>comfort and synchrony;<\/p><p>ABG;<\/p><p>whether CPAP, NIV-PS, or escalation is indicated.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Practical message: FiO2 corrects oxygen saturation, not the disease.<\/p><\/th><\/tr><\/table><\/div><p>Inspiratory trigger<\/p><p>The trigger is the mechanism by which the ventilator recognizes the onset of the patient’s inspiratory effort. It may be pressure- or flow-triggered. With pressure triggering, the ventilator delivers support when it detects a small pressure drop generated by the patient’s inspiratory effort. With flow triggering, support is delivered when the ventilator detects a change in circuit flow [5-7].<\/p><p>Typical problems that may occur during NIV-PS include:<\/p><p>ineffective triggering: the patient inspires but the ventilator does not deliver support;<\/p><p>delayed triggering: the ventilator delivers support late relative to the patient’s inspiration, increasing the overall respiratory effort;<\/p><p>auto-triggering: the ventilator delivers support in the absence of a patient inspiratory effort.<\/p><p>In COPD, auto-PEEP can make ventilator triggering difficult. Appropriate EPAP may reduce the inspiratory effort required to trigger the ventilator, provided that it does not further increase hyperinflation. Large leaks, especially with single-limb circuits, may instead promote auto-triggering or missed triggering depending on the ventilator’s leak-compensation algorithms.<\/p><p>Rise time<\/p><p>Rise time indicates how quickly the ventilator reaches the set inspiratory pressure from the EPAP level. A rise time that is too slow may fail to meet inspiratory flow demand and produce air hunger; a rise time that is too fast may make pressurization abrupt, increase leaks, and worsen tolerance.<\/p><p>In clinical practice, consider the following:<\/p><p>a dyspneic patient with high respiratory drive and high inspiratory demand may benefit from faster pressurization;<\/p><p>a frail patient with high leaks, discomfort, or asynchronies may benefit from gentler pressurization.<\/p><p>Rise time should not be adjusted by looking at the ventilator alone. It should be adjusted by looking at the patient and the ventilator together: comfort, synchrony, respiratory rate, and use of accessory muscles.<\/p><p>Expiratory cycling<\/p><p>Cycling is the transition from inspiration to expiration. In NIV-PS, on most ventilators, it occurs when inspiratory flow falls below a set percentage of peak inspiratory flow. A higher cycling threshold tends to shorten inspiratory time; a lower threshold tends to prolong it.<\/p><p>With delayed cycling, the ventilator continues to deliver flow when the patient already wants to exhale. This may cause discomfort, asynchrony, large leaks, and hyperinflation. With premature cycling, assistance ends too early and the patient may remain dyspneic or immediately generate another inspiratory effort.<\/p><p>This is particularly important in COPD: excessively long inspiratory times reduce expiratory time and promote dynamic hyperinflation. In many obstructive patients, earlier cycling may be useful, while always checking comfort, respiratory rate, abdominal muscle activity, leak magnitude, and ventilator waveforms.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_06.png\" alt=\"English teaching figure 6\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_06.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 2.3. Assisted cycle during NIV-PS: trigger, rise time, and cycling. The trigger initiates assistance, rise time determines the speed of pressure delivery, and cycling defines the transition to expiration. Many asynchronies depend more on these three elements than on the absolute pressure values.<\/p><p>Backup rate<\/p><p>The backup rate is the minimum respiratory rate guaranteed by the ventilator in modes that include timed breaths, such as S/T. It is activated when the patient does not spontaneously trigger the ventilator within the interval defined by the set rate, or when the ventilator algorithm detects a condition equivalent to apnea.<\/p><p>In an acutely tachypneic patient, the backup rate is almost never the first parameter to adjust. If the patient is breathing at 30 breaths/min, setting a backup rate of 14/min does not reduce fatigue: it simply means that the ventilator will intervene if the patient stops breathing. It becomes more relevant in central hypoventilation, sleep, neuromuscular disease, sedation, encephalopathy, or risk of apnea.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_07.png\" alt=\"English teaching figure 7\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_07.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 2.4. S/T mode. Assisted spontaneous breaths remain predominant; if the patient does not trigger, the backup rate generates a timed breath.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Practical message\nThe backup rate is a safety net, not a treatment for dyspnea.<\/p><\/th><\/tr><\/table><\/div><h4>Parameters I can read on the ventilator<\/h4><p>Leaks<\/p><p>Leaks are unavoidable during NIV, but when excessive they compromise the effectiveness of respiratory support. They are among the most common practical causes of NIV failure. They may reduce the volume actually delivered, interfere with triggering and cycling, and increase discomfort, dryness, noise, skin injury, and asynchronies [8].<\/p><p>Leaks should be suspected when:<\/p><p>the patient is poorly synchronized or agitated;<\/p><p>the ventilator shows auto-triggering;<\/p><p>the target pressure (IPAP and/or EPAP) is not reached;<\/p><p>the estimated tidal volume is inconsistent;<\/p><p>the mask is noisy;<\/p><p>the patient is agitated or reports discomfort;<\/p><p>the eyes are irritated by upward air leakage, particularly with oronasal masks;<\/p><p>the interface straps have to be tightened excessively.<\/p><p>Correcting leaks does not always mean simply tightening the mask straps. Sometimes the size or interface must be changed, patient position adjusted, pressures temporarily reduced, humidification improved, or trigger settings corrected.<\/p><p>Estimated tidal volume<\/p><p>Many ventilators display an estimated tidal volume, generally derived from the integral of the flow waveform. It is useful but should be interpreted cautiously because leaks may make it inaccurate. Despite this limitation, a very low volume may indicate insufficient support or excessive leak; a very high volume may suggest over-assistance or high respiratory drive.<\/p><p>In de novo hypoxemic respiratory failure, high tidal volumes during NIV should increase concern: the patient may continue to generate large transpulmonary pressure swings, worsen lung injury, and be at increased risk of trial failure [4].<\/p><h4>Rapid ventilator assessment<\/h4><p>When reassessing a patient on NIV-PS, it is not enough to ask whether “the saturation looks good.” Four levels must be assessed together:<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Level<\/p><\/th><th><p>What to assess<\/p><\/th><th><p>Why it matters<\/p><\/th><\/tr><tr><td><p>Pressures<\/p><\/td><td><p>EPAP, IPAP, effective PS<\/p><\/td><td><p>to understand which parameter is being adjusted<\/p><\/td><\/tr><tr><td><p>Gas exchange<\/p><\/td><td><p>FiO2, SpO2, ABG<\/p><\/td><td><p>to understand whether the patient is oxygenating and ventilating<\/p><\/td><\/tr><tr><td><p>Interaction<\/p><\/td><td><p>leaks, trigger, cycling, asynchronies<\/p><\/td><td><p>to understand whether support is actually being delivered<\/p><\/td><\/tr><tr><td><p>Clinical response<\/p><\/td><td><p>respiratory rate, comfort, accessory muscles, mental status<\/p><\/td><td><p>to understand whether the patient is working less<\/p><\/td><\/tr><\/table><\/div><p>Table 2.1. Rapid ventilator assessment during NIV.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_08.png\" alt=\"English teaching figure 8\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_08.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 2.5. Rapid ventilator assessment during NIV. Ventilator data must be interpreted together with clinical findings and ultrasound. The number on the display matters only if it is consistent with the patient.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Key messages\nEPAP/PEEP and pressure support correct different problems: the former acts mainly on aeration and oxygenation, the latter on ventilation and work of breathing.\nTrue inspiratory support is not IPAP alone, but the difference between IPAP and EPAP.\nFiO2 improves oxygen saturation but does not by itself correct the respiratory problem.\nTrigger, rise time, and cycling regulate patient–ventilator synchrony.\nLeaks can make NIV ineffective even when settings appear correct.\nTidal volume displayed by the ventilator should be interpreted cautiously, especially in the presence of leaks.\nEvery change in an adjustable parameter should have a specific objective and should be reassessed in the patient.<\/p><\/th><\/tr><\/table><\/div><h4>References for Chapter 2<\/h4><p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p><p>2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p><p>3. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319.<\/p><p>4. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p><p>5. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, et al. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p><p>6. Calderini E, Confalonieri M, Puccio PG, Francavilla N, Stella L, Gregoretti C. Patient-ventilator asynchrony during noninvasive ventilation: the role of expiratory trigger. Intensive Care Med. 1999;25(7):662-667. doi:10.1007/s001340050927.<\/p><p>7. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, et al. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.<\/p><p>8. Oto J, Chenelle CT, Marchese AD, Kacmarek RM. A comparison of leak compensation in acute care ventilators during noninvasive and invasive ventilation: a lung model study. Respir Care. 2013;58(12):2027-2037. doi:10.4187/respcare.02319.<\/p>", "plain": " Practical objective  Once non-invasive support has been selected, treatment effectiveness depends on consistency between ventilator settings, the pathophysiological phenotype, and the clinical response. Non-invasive ventilation may be ineffective not only because the indication is wrong, but also because of inappropriate settings, uncorrected leaks, unrecognized asynchronies, or an assessment focused too heavily on peripheral oxygen saturation alone [1-3].  This chapter defines the essential parameters that clinicians must set or interpret during an NIV trial: expiratory pressure, inspiratory support, FiO2, trigger, rise time, cycling, backup rate, leaks, and estimated tidal volume. A more detailed description of ventilatory modes and waveforms is provided in the next chapter.  The operating principle remains the same: every change in settings must have an explicit pathophysiological target and a documented reassessment.  Ventilator terminology: why confusion arises  Ventilator terminology is not completely standardized: the same ventilatory behavior may be described differently depending on the manufacturer, ventilator, and clinical setting. This chapter recalls only the terms required to interpret the parameters that can be set during NIV. Continuous Positive Airway Pressure (CPAP) applies a continuous pressure level throughout the respiratory cycle, without differential inspiratory assistance. BiLevel Positive Airway Pressure (BiLevel or BiPAP) uses an expiratory level, termed Expiratory Positive Airway Pressure (EPAP), and an inspiratory level, termed Inspiratory Positive Airway Pressure (IPAP). The difference between IPAP and EPAP represents pressure support, that is, the effective inspiratory assistance.  Pressure Support Ventilation (PSV), when delivered through a non-invasive interface, is referred to in this manual as NIV-PS. In this mode, the patient initiates inspiration and the ventilator delivers pressure support above the expiratory level. Spontaneous/Timed (S/T) mode adds a minimum backup rate to assisted spontaneous breaths. More complex modes—Pressure-Controlled Ventilation (PCV), Volume-Controlled Ventilation (VCV), Pressure-Regulated Volume Control (PRVC), Volume-Assured Pressure Support/Average Volume-Assured Pressure Support (VAPS/AVAPS), and Synchronized Intermittent Mandatory Ventilation (SIMV)—are discussed in Chapter 3. At this stage, it is sufficient to distinguish the meaning of the main parameters: expiratory pressure, inspiratory pressure, inspiratory support, inspired oxygen fraction, trigger, cycling, rise time, and backup rate.      Download image     Figure 2.1. NIV parameters: what they actually control. The main NIV parameters are not equivalent: EPAP/PEEP, IPAP, pressure support, FiO2, trigger, cycling, rise time, and backup rate have different targets.  Parameters I can set  EPAP/PEEP  EPAP and PEEP are closely related concepts, but they are not always identical in ventilator terminology. EPAP is the expiratory positive pressure used in BiLevel/NIV modes: it is the pressure level against which the patient exhales. PEEP is positive end-expiratory pressure, the traditional term used in invasive ventilation and in many CPAP/NIV modes. In clinical practice they are often used as functional equivalents, but the context should be kept in mind: EPAP when considering the two pressure levels of NIV-PS; PEEP when considering end-expiratory pressure and recruitment during CPAP.  Its main targets are:  improve oxygenation;  keep unstable alveolar units open;  counteract expiratory collapse;  reduce triggering effort in the presence of auto-PEEP;  modify heart–lung interaction.  In practice, EPAP is useful when there is a problem of aeration or intrinsic end-expiratory pressure. It is typically used in cardiogenic pulmonary edema, recruitable atelectasis, postoperative patients, obesity, and some COPD exacerbations with auto-PEEP.  Caution: increasing EPAP is not always beneficial. If the lung is not recruitable, higher pressure may overdistend already open regions. In COPD, it may worsen hyperinflation if it exceeds the level needed to counterbalance auto-PEEP. In patients with a vulnerable right ventricle, it may reduce venous return and worsen hemodynamic tolerance. EPAP/PEEP should not be increased simply “because the patient is doing poorly.” It should be increased when the problem is aeration, recruitment, oxygenation, or auto-PEEP.      Practical message\nAm I trying to open the lung and keep it open, or am I trying to unload the respiratory muscles?\nIn the first case I focus on EPAP/PEEP. In the second I focus on pressure support.      IPAP and pressure support  IPAP is the pressure reached during assisted inspiration and is the sum of EPAP/PEEP and pressure support. Pressure support is therefore the difference between IPAP and EPAP.  Pressure support = IPAP − EPAP  Pressure support, rather than IPAP alone, determines the amount of inspiratory assistance. If EPAP is 6 cmH2O and IPAP is 16 cmH2O, pressure support is 10 cmH2O. If EPAP is increased to 8 cmH2O while IPAP remains at 16 cmH2O, pressure support falls to 8 cmH2O. This point is often underestimated.  Pressure support is mainly used to:  reduce inspiratory work;  increase tidal volume;  improve alveolar ventilation;  reduce PaCO2;  reduce the load on the diaphragm and accessory muscles.  It is the main parameter to adjust in hypercapnic and fatigued patients, such as those with acute COPD exacerbation, obesity hypoventilation, neuromuscular disease, and respiratory muscle fatigue.      Download image     Figure 2.2. PSV or NIV-PS. The patient activates the inspiratory trigger; the ventilator delivers pressure support above the EPAP/PEEP level and ends assistance when inspiratory flow falls below the cycling threshold.  Caution: pressure support that is too low leaves the patient tachypneic and fatigued. Excessive pressure support may generate excessive tidal volumes, asynchronies, discomfort, high leaks, and over-assistance. In de novo hypoxemic respiratory failure, high tidal volumes during NIV-PS are associated with an increased risk of failure and possible lung injury. Pressure support should not be increased simply “because oxygen saturation is low.” It should be increased when the problem is alveolar ventilation, hypercapnia, or work of breathing [4].  FiO2  FiO2 is used to achieve the oxygenation target, but it does not correct the mechanism of respiratory failure. Increasing FiO2 may be necessary, but it should not become a shortcut that avoids reassessment of the lung and work of breathing.  Persistently high FiO2 indicates that the system is not stable or that the selected respiratory support is not correcting the underlying problem. The treatment is missing its target. In these situations, reassess:  LUS and loss of aeration;  recruitability;  respiratory rate;  comfort and synchrony;  ABG;  whether CPAP, NIV-PS, or escalation is indicated.      Practical message: FiO2 corrects oxygen saturation, not the disease.      Inspiratory trigger  The trigger is the mechanism by which the ventilator recognizes the onset of the patient’s inspiratory effort. It may be pressure- or flow-triggered. With pressure triggering, the ventilator delivers support when it detects a small pressure drop generated by the patient’s inspiratory effort. With flow triggering, support is delivered when the ventilator detects a change in circuit flow [5-7].  Typical problems that may occur during NIV-PS include:  ineffective triggering: the patient inspires but the ventilator does not deliver support;  delayed triggering: the ventilator delivers support late relative to the patient’s inspiration, increasing the overall respiratory effort;  auto-triggering: the ventilator delivers support in the absence of a patient inspiratory effort.  In COPD, auto-PEEP can make ventilator triggering difficult. Appropriate EPAP may reduce the inspiratory effort required to trigger the ventilator, provided that it does not further increase hyperinflation. Large leaks, especially with single-limb circuits, may instead promote auto-triggering or missed triggering depending on the ventilator’s leak-compensation algorithms.  Rise time  Rise time indicates how quickly the ventilator reaches the set inspiratory pressure from the EPAP level. A rise time that is too slow may fail to meet inspiratory flow demand and produce air hunger; a rise time that is too fast may make pressurization abrupt, increase leaks, and worsen tolerance.  In clinical practice, consider the following:  a dyspneic patient with high respiratory drive and high inspiratory demand may benefit from faster pressurization;  a frail patient with high leaks, discomfort, or asynchronies may benefit from gentler pressurization.  Rise time should not be adjusted by looking at the ventilator alone. It should be adjusted by looking at the patient and the ventilator together: comfort, synchrony, respiratory rate, and use of accessory muscles.  Expiratory cycling  Cycling is the transition from inspiration to expiration. In NIV-PS, on most ventilators, it occurs when inspiratory flow falls below a set percentage of peak inspiratory flow. A higher cycling threshold tends to shorten inspiratory time; a lower threshold tends to prolong it.  With delayed cycling, the ventilator continues to deliver flow when the patient already wants to exhale. This may cause discomfort, asynchrony, large leaks, and hyperinflation. With premature cycling, assistance ends too early and the patient may remain dyspneic or immediately generate another inspiratory effort.  This is particularly important in COPD: excessively long inspiratory times reduce expiratory time and promote dynamic hyperinflation. In many obstructive patients, earlier cycling may be useful, while always checking comfort, respiratory rate, abdominal muscle activity, leak magnitude, and ventilator waveforms.      Download image     Figure 2.3. Assisted cycle during NIV-PS: trigger, rise time, and cycling. The trigger initiates assistance, rise time determines the speed of pressure delivery, and cycling defines the transition to expiration. Many asynchronies depend more on these three elements than on the absolute pressure values.  Backup rate  The backup rate is the minimum respiratory rate guaranteed by the ventilator in modes that include timed breaths, such as S/T. It is activated when the patient does not spontaneously trigger the ventilator within the interval defined by the set rate, or when the ventilator algorithm detects a condition equivalent to apnea.  In an acutely tachypneic patient, the backup rate is almost never the first parameter to adjust. If the patient is breathing at 30 breaths/min, setting a backup rate of 14/min does not reduce fatigue: it simply means that the ventilator will intervene if the patient stops breathing. It becomes more relevant in central hypoventilation, sleep, neuromuscular disease, sedation, encephalopathy, or risk of apnea.      Download image     Figure 2.4. S/T mode. Assisted spontaneous breaths remain predominant; if the patient does not trigger, the backup rate generates a timed breath.      Practical message\nThe backup rate is a safety net, not a treatment for dyspnea.      Parameters I can read on the ventilator  Leaks  Leaks are unavoidable during NIV, but when excessive they compromise the effectiveness of respiratory support. They are among the most common practical causes of NIV failure. They may reduce the volume actually delivered, interfere with triggering and cycling, and increase discomfort, dryness, noise, skin injury, and asynchronies [8].  Leaks should be suspected when:  the patient is poorly synchronized or agitated;  the ventilator shows auto-triggering;  the target pressure (IPAP and/or EPAP) is not reached;  the estimated tidal volume is inconsistent;  the mask is noisy;  the patient is agitated or reports discomfort;  the eyes are irritated by upward air leakage, particularly with oronasal masks;  the interface straps have to be tightened excessively.  Correcting leaks does not always mean simply tightening the mask straps. Sometimes the size or interface must be changed, patient position adjusted, pressures temporarily reduced, humidification improved, or trigger settings corrected.  Estimated tidal volume  Many ventilators display an estimated tidal volume, generally derived from the integral of the flow waveform. It is useful but should be interpreted cautiously because leaks may make it inaccurate. Despite this limitation, a very low volume may indicate insufficient support or excessive leak; a very high volume may suggest over-assistance or high respiratory drive.  In de novo hypoxemic respiratory failure, high tidal volumes during NIV should increase concern: the patient may continue to generate large transpulmonary pressure swings, worsen lung injury, and be at increased risk of trial failure [4].  Rapid ventilator assessment  When reassessing a patient on NIV-PS, it is not enough to ask whether “the saturation looks good.” Four levels must be assessed together:      Level    What to assess    Why it matters      Pressures    EPAP, IPAP, effective PS    to understand which parameter is being adjusted      Gas exchange    FiO2, SpO2, ABG    to understand whether the patient is oxygenating and ventilating      Interaction    leaks, trigger, cycling, asynchronies    to understand whether support is actually being delivered      Clinical response    respiratory rate, comfort, accessory muscles, mental status    to understand whether the patient is working less      Table 2.1. Rapid ventilator assessment during NIV.      Download image     Figure 2.5. Rapid ventilator assessment during NIV. Ventilator data must be interpreted together with clinical findings and ultrasound. The number on the display matters only if it is consistent with the patient.      Key messages\nEPAP/PEEP and pressure support correct different problems: the former acts mainly on aeration and oxygenation, the latter on ventilation and work of breathing.\nTrue inspiratory support is not IPAP alone, but the difference between IPAP and EPAP.\nFiO2 improves oxygen saturation but does not by itself correct the respiratory problem.\nTrigger, rise time, and cycling regulate patient–ventilator synchrony.\nLeaks can make NIV ineffective even when settings appear correct.\nTidal volume displayed by the ventilator should be interpreted cautiously, especially in the presence of leaks.\nEvery change in an adjustable parameter should have a specific objective and should be reassessed in the patient.      References for Chapter 2  1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.  3. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319.  4. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.  5. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, et al. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.  6. Calderini E, Confalonieri M, Puccio PG, Francavilla N, Stella L, Gregoretti C. Patient-ventilator asynchrony during noninvasive ventilation: the role of expiratory trigger. Intensive Care Med. 1999;25(7):662-667. doi:10.1007/s001340050927.  7. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, et al. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.  8. Oto J, Chenelle CT, Marchese AD, Kacmarek RM. A comparison of leak compensation in acute care ventilators during noninvasive and invasive ventilation: a lung model study. Respir Care. 2013;58(12):2027-2037. doi:10.4187/respcare.02319. "}, {"part": "Part I — Practical Foundations of Non-Invasive Ventilation", "title": "Chapter 3. Ventilatory Modes, Circuits, and Waveforms: Translating the Name into Physiology", "tag": "Ch. 3", "html": "<h4>Practical objective<\/h4><p>Chapter 2 defined the adjustable parameters; this chapter explains ventilatory modes, circuits, and waveforms. The distinction is deliberate: knowing EPAP, IPAP, pressure support, trigger, and cycling is not enough unless one understands which variable the ventilator controls, which variable remains dependent on the patient’s respiratory mechanics, and how the circuit affects leaks, rebreathing, and synchrony [1-3].<\/p><h4>Extended terminology and flow-waveform logic<\/h4><p>In Chapter 2, terminology was limited to the parameters required to set up NIV. Here the focus is different: understanding how modes behave during the respiratory cycle and which are truly relevant to non-invasive treatment. In acute care, the most important modes are CPAP, BiLevel/NIV-PS, S/T, and, in selected patients, volume-targeted modes such as VAPS or AVAPS. PCV, VCV, PRVC, and SIMV are included because they are available on ICU ventilators and may also be used during non-invasive ventilation, but they do not represent the most common approach to an acute NIV trial.<\/p><p>Continuous Positive Airway Pressure (CPAP) maintains a continuous pressure level and does not add inspiratory pressure support. BiLevel Positive Airway Pressure (BiLevel or BiPAP) uses two pressure levels, EPAP and IPAP, and the difference between them is pressure support. NIV-PS corresponds to Pressure Support Ventilation delivered through a non-invasive interface: the patient activates the inspiratory trigger, the ventilator delivers pressure support, and assistance ends according to the cycling criterion. This is the reference mode when the dominant problem is alveolar ventilation, reduction of inspiratory work, or hypercapnic respiratory acidosis.<\/p><p>Spontaneous/Timed (S/T) mode retains the logic of NIV-PS but adds a minimum backup rate. This should not be interpreted as a treatment for tachypnea: in an awake, tachypneic patient with high respiratory drive, the key issues remain adequacy of support, synchrony, and comfort. Timed breaths become relevant when inspiratory effort is intermittent or absent, as in central hypoventilation, sleep, sedation, neuromuscular disease, or some obesity-hypoventilation phenotypes.<\/p><p>VAPS and AVAPS belong to the group of pressure-support modes with a volume target. The ventilator does not deliver a controlled volume breath by breath as in VCV; instead, it maintains a pressure-based strategy and progressively adjusts support within preset limits to achieve an average tidal volume. They are therefore more useful when ventilation varies over time, for example during sleep, with changes in position, in chronic hypoventilation, or in patients with variable respiratory mechanics. In acute patients they still require close monitoring: leaks, comfort, asynchronies, estimated tidal volume, and ABG remain decisive.<\/p><p>PCV and VCV should primarily be understood as pressure- and volume-control modes. In PCV, the ventilator controls inspiratory pressure and tidal volume depends on compliance, resistance, patient effort, and leaks. In VCV, the ventilator controls volume or flow, while pressure becomes the variable determined by respiratory mechanics. In acute NIV these modes are used more selectively than NIV-PS, but understanding them helps interpret the waveforms shown in Figures 3.3 and 3.4.<\/p><p>PRVC is a hybrid mode: each breath behaves as a pressure-controlled breath, but the ventilator progressively adjusts pressure to approach a target volume. SIMV combines synchronized mandatory breaths with assisted spontaneous breaths. Figures 3.1 and 3.2 show SIMV-VC with PSV and SIMV-PC with PSV, respectively. These are not proposed as standard modes for acute NIV, but illustrate how mandatory and assisted spontaneous breaths can coexist when an ICU ventilator is used.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_09.png\" alt=\"English teaching figure 9\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_09.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.1. SIMV-VC + PSV. Synchronized mandatory volume-controlled breaths alternate with spontaneous breaths assisted by pressure support.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_10.png\" alt=\"English teaching figure 10\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_10.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.2. SIMV-PC + PSV. Synchronized mandatory pressure-controlled breaths alternate with spontaneous breaths assisted by pressure support.<\/p><p>Comparing pressure-controlled and volume-controlled modes is particularly useful for understanding the shape of the inspiratory flow waveform. In pressure-controlled ventilation, the ventilator reaches a preset inspiratory pressure and maintains it for the set inspiratory time; flow is high at the beginning of inspiration and then decreases according to respiratory mechanics. In conventional volume-controlled ventilation, the ventilator delivers a preset tidal volume or flow, while airway pressure becomes dependent on resistance, elastance, and patient interaction. In the non-invasive setting, these concepts are mainly interpretive: they help clinicians read waveforms and avoid confusing the name of a mode with the ventilator’s actual behavior [1-4].<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_11.png\" alt=\"English teaching figure 11\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_11.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.3. PCV. Inspiratory pressure is controlled; flow is typically decelerating, and tidal volume depends on compliance, resistance, leaks, and patient effort.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_12.png\" alt=\"English teaching figure 12\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_12.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.4. VCV. Tidal volume and inspiratory flow are preset; the pressure required to deliver them becomes a consequence of respiratory mechanics.<\/p><p>When confronted with an acronym, the clinically relevant question is not simply what the mode is called, but which variable is controlled, which remains dependent on the patient’s mechanics, and whether the mode is appropriate for acute non-invasive ventilation.<\/p><p>If the ventilator controls pressure, volume depends on the patient and the circuit. If it controls volume or flow, pressure becomes the result of respiratory mechanics. If it uses a volume target with pressure control, each breath remains pressure-based, but pressure is adjusted over time to approach the desired mean volume.<\/p><p>Table 3.1. Practical terminology of ventilatory modes.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_13.png\" alt=\"English teaching figure 13\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_13.png\" download>Download image<\/a><\/div><\/figure><\/p><p>The practical point is to determine first whether the problem is aeration, alveolar ventilation, synchrony, apnea safety, or tidal-volume variability; only then should the most appropriate mode be selected.<\/p><h4>From CPAP to NIV-PS/S/T: clinical meaning of non-invasive modes<\/h4><p>CPAP is appropriate when the target is predominantly pulmonary: aeration, stabilization of recruitable alveolar units, reduction of collapse-related shunt, and, in cardiogenic conditions, reduction of the work of breathing associated with congestion. It does not directly correct alveolar hypoventilation because it provides no differential inspiratory assistance. Therefore, in the presence of acidotic hypercapnia and inspiratory fatigue, CPAP alone may be insufficient even if it temporarily improves SpO2.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_14.png\" alt=\"English teaching figure 14\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_14.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.5. CPAP. CPAP maintains an almost constant positive pressure throughout the respiratory cycle; the patient breathes spontaneously above the CPAP/PEEP level without differential inspiratory assistance.<\/p><p>NIV-PS/BiLevel is more appropriate when the goal is to reduce inspiratory muscle load and improve alveolar ventilation. In this setting, the clinically relevant value is not IPAP alone but effective pressure support, that is, IPAP minus EPAP. Any increase in EPAP, if IPAP remains unchanged, reduces inspiratory support; this is one reason why simply reading the two pressure levels can be misleading.<\/p><p>S/T mode adds timed backup protection to NIV-PS. It is useful when the patient may have respiratory pauses, central hypoventilation, sleep-related hypoventilation, sedation, neuromuscular disease, or when a minimum respiratory rate must be guaranteed. It does not replace correction of leaks, ineffective triggering, inappropriate cycling, or insufficient inspiratory support. If the patient is tachypneic and still has a high work of breathing, setting a backup rate does not solve the problem.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_15.png\" alt=\"English teaching figure 15\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_15.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.6. NIV modes: translating the name into physiology. Non-invasive modes should be interpreted according to the controlled variable, the presence or absence of inspiratory support, the backup rate, and circuit behavior.<\/p><h4>Volume-targeted modes: rationale and limitations<\/h4><p>Volume-targeted modes such as VAPS and AVAPS are mainly useful in patients whose tidal volume tends to vary over time. Their logic is not that of conventional VCV: the ventilator maintains pressure-support ventilation and gradually adjusts pressure, within predefined limits, to achieve an average target volume. In other words, the volume target guides adjustment of support, while each individual breath remains essentially pressure-based.<\/p><p>This distinction is crucial in NIV. With large leaks, an unstable interface, or major asynchronies, estimated tidal volume may not correspond to effective tidal volume. VAPS/AVAPS should therefore not be considered “automatic” modes that can replace clinical, ventilatory, and blood-gas monitoring. They may help maintain more stable average ventilation, but still require appropriate pressure limits, leak control, comfort assessment, and ABG verification.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_16.png\" alt=\"English teaching figure 16\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_16.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.7. PRVC. The mode uses breath-by-breath adaptive pressure control to approach a target volume while maintaining a decelerating flow profile.<\/p><p>Figure 3.7 is included mainly to clarify the concept of a hybrid pressure-controlled mode with a volume objective. PRVC is typical of mechanical ventilation on ICU ventilators; it is described here to avoid confusion with non-invasive volume-assured modes.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_17.png\" alt=\"English teaching figure 17\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_17.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.8. VAPS/AVAPS. Pressure support changes progressively to bring tidal volume toward the set target; monitoring remains essential in the presence of leaks or variable respiratory mechanics.<\/p><p>Figure 3.8 represents the concept most relevant to NIV: pressure support can be modulated over time to approach a volume target. Clinical usefulness depends on patient selection and setup quality, not on the acronym itself.<\/p><p>This approach may be useful when tidal volume varies with position, sleep, respiratory drive, compliance, resistance, or leaks. This is why the literature has mainly evaluated these modes in obesity hypoventilation syndrome (OHS), chronic hypoventilation, and patients with variable respiratory mechanics. In OHS, one crossover study showed a greater reduction in PtcCO2 with volume-assured pressure support than with conventional S/T, without a clear additional benefit in sleep quality or quality of life [5]. Another study found better control of nocturnal hypoventilation, but at the cost of a greater perception of leaks, “too much air,” and worse subjective comfort [6].<\/p><p>In larger randomized studies or studies using protocolized titration, the advantage over fixed pressure support is less clear. In patients with super-obesity and chronic respiratory failure, volume-targeted support did not produce clinically relevant differences compared with fixed pressure support when both were set using a rigorous protocol [7]. In stable OHS, adding auto-EPAP and a volume target produced results similar to S/T for gas exchange and objective sleep quality, while reducing setup time [8].<\/p><p>Evidence is more limited in acute COPD exacerbations. A small pilot trial did not show a statistically significant improvement in comfort compared with conventional S/T, although both groups improved clinically [9]. In the acute setting, a volume target should therefore not replace early clinical assessment: respiratory rate, comfort, ABG, leaks, tidal volumes, asynchronies, and respiratory muscle work remain decisive.<\/p><h4>Auto-EPAP and hybrid modes<\/h4><p>Clinical experience in pediatric patients with nocturnal hypoventilation likewise supports interpreting volume-targeted modes as tools for adapting support, not as substitutes for monitoring leaks, comfort, and ventilatory response [10].<\/p><p>Some hybrid modes adjust not only inspiratory support but also expiratory pressure to maintain upper-airway patency and reduce residual obstructive events. The physiological concept is to distinguish two targets: EPAP acts on expiratory collapse, upper-airway obstruction, and aeration; pressure support acts on alveolar ventilation and PaCO2.<\/p><p>This distinction is particularly useful in OHS associated with obstructive sleep apnea, where hypoventilation and upper-airway collapse coexist. A hybrid mode may attempt to adapt EPAP to obstructive events and pressure support to the volume target. This does not mean that the mode is automatically superior: in clinical trials, outcomes depend on the patient phenotype, setup quality, interface, leaks, and tolerance.<\/p><h4>Single-limb and dual-limb circuits<\/h4><p>The circuit is part of the ventilatory system. It does not by itself determine NIV success, but it affects volume measurement, leak management, the risk of rebreathing, and trigger/cycling behavior.<\/p><p>In a single-limb circuit, inspiration and expiration occur through the same tubing. CO2 elimination requires a calibrated intentional leak or an expiratory valve. This configuration is simple and widely used in NIV, but makes volume and leak estimates more dependent on ventilator algorithms. If the intentional leak is inadequate, or if the circuit and interface are incompatible, rebreathing may occur.<\/p><p>In a dual-limb circuit, inspiratory and expiratory limbs are separate. This allows more controlled measurement of expiratory flow and exhaled volume in many conditions, but requires compatibility between ventilator, circuit, and interface. It is not inherently “better”; it is different. In acute patients, what matters most is that the selected system provides stable pressure, manageable leaks, and acceptable synchrony.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_18.png\" alt=\"English teaching figure 18\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_18.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 3.9. NIV circuits: single-limb and dual-limb. In a single-limb circuit, inspiration and expiration share the same tubing and CO2 elimination depends on an intentional leak or valve. In a dual-limb circuit, inspiratory and expiratory limbs are separate, with different handling of expiratory-flow measurement.<\/p><h4>Leak compensation and automatic trigger/cycling<\/h4><p>NIV is inevitably ventilation with leaks. The ventilator must distinguish flow delivered to the patient from flow escaping through the interface or circuit. Dedicated NIV ventilators therefore use leak-compensation and tidal-volume estimation algorithms. These data are useful but should not be treated as perfect measurements: they become less reliable when leaks are large, variable, or poorly compensated.<\/p><p>Modern algorithms can automatically adapt trigger and cycling thresholds, estimate patient flow, and correct the baseline in the presence of leaks. The practical advantage is a reduced need for continuous manual adjustment. The limitation is that automation does not understand the clinical context: auto-triggering, ineffective efforts, delayed cycling, and other asynchronies may still occur, especially with an unstable mask, auto-PEEP, severe obstruction, high respiratory drive, or sedation [11-14].<\/p><p>The ventilator display must therefore be interpreted together with the patient. If estimated tidal volume appears adequate but the patient remains tachypneic, recruits the abdominal muscles, has a high TFdi, or worsens on ABG, the mode is not truly working. If LUS improves but comfort worsens and leaks increase, the pressure may have reached a pulmonary target while compromising tolerance of the trial.<\/p><h4>Practical interpretation of pressure, flow, and volume waveforms<\/h4><p>Ventilator waveforms often reveal the logic of a mode better than its commercial name. At a minimum, waveform interpretation should ask which variable is controlled, which variable is a consequence of the patient’s mechanics, and what shape the inspiratory flow waveform takes.<\/p><p>Waveforms are distributed throughout the relevant sections; titles and numbers remain in the captions so that numbering can still be modified if figures are added or removed in the future.<\/p><p>These waveforms are not intended to turn the manual into a course on invasive mechanical ventilation. Their purpose is to make the logic clearer: in pressure modes, flow adapts to the patient’s mechanics; in conventional VCV, flow is set; in hybrid modes, the ventilator adjusts pressure to approach a volume target; in SIMV, synchronized mandatory breaths coexist with assisted spontaneous breaths [1-4].<\/p><p>The operating question remains the same: is the waveform I see consistent with the problem I want to correct, or am I merely changing the mode label without truly changing the pathophysiological target?<\/p><h4>How to choose the mode in practice<\/h4><div style=\"overflow-x:auto\"><table><tr><th><p>Predominant situation<\/p><\/th><th><p>Appropriate mode<\/p><\/th><th><p>Priority monitoring<\/p><\/th><\/tr><tr><td><p>Hypoxemia with collapse/recruitability and preserved respiratory pump<\/p><\/td><td><p>CPAP or BiLevel with low PS if needed for comfort<\/p><\/td><td><p>LUS, SpO2/FiO2, arterial pressure, comfort<\/p><\/td><\/tr><tr><td><p>Hypercapnia with respiratory muscle fatigue<\/p><\/td><td><p>NIV-PS / BiLevel S or S/T<\/p><\/td><td><p>pH, PaCO2, respiratory rate, diaphragm, leaks, asynchronies<\/p><\/td><\/tr><tr><td><p>Chronic hypoventilation, OHS, variable mechanics during sleep<\/p><\/td><td><p>BiLevel S/T; consider volume-targeted PS if Vt is unstable<\/p><\/td><td><p>TcCO2/PaCO2, estimated Vt, adherence, comfort, leak<\/p><\/td><\/tr><tr><td><p>OHS with residual obstructive events<\/p><\/td><td><p>BiLevel with adequate EPAP; consider auto-EPAP if available<\/p><\/td><td><p>residual AHI, required EPAP, comfort, PaCO2<\/p><\/td><\/tr><tr><td><p>High respiratory drive, heterogeneous lung, high tidal volumes in de novo hypoxemia<\/p><\/td><td><p>Short trial or escalation: do not chase volume alone<\/p><\/td><td><p>respiratory rate, estimated Vt, LUS, ABG, signs of failure<\/p><\/td><\/tr><\/table><\/div><p>Table 3.2. Practical choice of NIV mode according to the dominant problem. Volume-targeted modes and auto-EPAP should be regarded as adaptive tools, not shortcuts that replace early monitoring.<\/p><h4>Role of ultrasound<\/h4><p>Ultrasound helps determine whether the selected mode has a real target. If the dominant problem is lung aeration, it can identify loss of aeration, collapse, edema, or potentially reversible atelectasis. If the dominant problem involves the respiratory muscles, assessment of the diaphragm, intercostal muscles, and abdominal muscles becomes more relevant than the lung pattern alone.<\/p><p>In volume-targeted modes, ultrasound is particularly useful for avoiding false reassurance: an apparently adequate mean volume may coexist with high respiratory drive, an overloaded diaphragm, active abdominal muscles, and a heterogeneous lung. In these situations, the problem is not to “adjust the target,” but to determine whether the non-invasive trial is still appropriate [15-17].<\/p><h4>Pitfall to avoid<\/h4><p>The most common mistake is to select or change a mode because it appears “more advanced,” without knowing which target needs correction. Increasing pressures, changing modes, or chasing a target volume does not automatically provide more effective support. Technology helps only when the problem to be treated is clear: aeration, alveolar ventilation, synchrony, apnea safety, or tidal-volume variability.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Key messages\nThe name of the mode is not enough: understand what the ventilator controls and which problem is being treated.\nCPAP, BiLevel, NIV-PS, S/T, PCV, VCV, PRVC, AVAPS, and SIMV are not synonyms.\nCPAP maintains continuous pressure and is most useful when the problem is aeration or oxygenation.\nNIV-PS/BiLevel adds inspiratory support and is more appropriate when the problem is hypercapnia or respiratory fatigue.\nIn pressure modes, volume depends on the patient and respiratory mechanics; in volume modes, pressure becomes the consequence.\nVolume-targeted modes can help but do not replace clinical, ventilator, and ultrasound monitoring.\nSingle-limb and dual-limb circuits influence leaks, rebreathing, volume measurement, and synchrony.\nPressure, flow, and volume waveforms help clarify how the selected mode is actually behaving.<\/p><\/th><\/tr><\/table><\/div><h4>References for Chapter 3<\/h4><p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice g 6/swrccc.v7i30.560.<\/p><p>10. Saddi V, Thambipillay G, Pithers S, Moody M, Martin B, Blecher G, Teng A. Average volume-assured pressure support vs conventional bilevel pressure support in pediatric nocturnal hypoventilation: a case series. J Clin Sleep Med. 2021;17(5):925-930. doi:10.5664/jcsm.9084.<\/p><p>11. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, et al. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p><p>12. Calderini E, Confalonieri M, Puccio PG, Francavilla N, Stella L, Gregoretti C. Patient-ventilator asynchrony during noninvasive ventilation: the role of expiratory trigger. Intensive Care Med. 1999;25(7):662-667. doi:10.1007/s001340050927.<\/p><p>13. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, et al. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.<\/p><p>14. Oto J, Chenelle CT, Marchese AD, Kacmarek RM. A comparison of leak compensation in acute care ventilators during noninvasive and invasive ventilation: a lung model study. Respir Care. 2013;58(12):2027-2037. doi:10.4187/respcare.02319.<\/p><p>15. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p><p>16. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>17. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412.<\/p>", "plain": " Practical objective  Chapter 2 defined the adjustable parameters; this chapter explains ventilatory modes, circuits, and waveforms. The distinction is deliberate: knowing EPAP, IPAP, pressure support, trigger, and cycling is not enough unless one understands which variable the ventilator controls, which variable remains dependent on the patient’s respiratory mechanics, and how the circuit affects leaks, rebreathing, and synchrony [1-3].  Extended terminology and flow-waveform logic  In Chapter 2, terminology was limited to the parameters required to set up NIV. Here the focus is different: understanding how modes behave during the respiratory cycle and which are truly relevant to non-invasive treatment. In acute care, the most important modes are CPAP, BiLevel/NIV-PS, S/T, and, in selected patients, volume-targeted modes such as VAPS or AVAPS. PCV, VCV, PRVC, and SIMV are included because they are available on ICU ventilators and may also be used during non-invasive ventilation, but they do not represent the most common approach to an acute NIV trial.  Continuous Positive Airway Pressure (CPAP) maintains a continuous pressure level and does not add inspiratory pressure support. BiLevel Positive Airway Pressure (BiLevel or BiPAP) uses two pressure levels, EPAP and IPAP, and the difference between them is pressure support. NIV-PS corresponds to Pressure Support Ventilation delivered through a non-invasive interface: the patient activates the inspiratory trigger, the ventilator delivers pressure support, and assistance ends according to the cycling criterion. This is the reference mode when the dominant problem is alveolar ventilation, reduction of inspiratory work, or hypercapnic respiratory acidosis.  Spontaneous/Timed (S/T) mode retains the logic of NIV-PS but adds a minimum backup rate. This should not be interpreted as a treatment for tachypnea: in an awake, tachypneic patient with high respiratory drive, the key issues remain adequacy of support, synchrony, and comfort. Timed breaths become relevant when inspiratory effort is intermittent or absent, as in central hypoventilation, sleep, sedation, neuromuscular disease, or some obesity-hypoventilation phenotypes.  VAPS and AVAPS belong to the group of pressure-support modes with a volume target. The ventilator does not deliver a controlled volume breath by breath as in VCV; instead, it maintains a pressure-based strategy and progressively adjusts support within preset limits to achieve an average tidal volume. They are therefore more useful when ventilation varies over time, for example during sleep, with changes in position, in chronic hypoventilation, or in patients with variable respiratory mechanics. In acute patients they still require close monitoring: leaks, comfort, asynchronies, estimated tidal volume, and ABG remain decisive.  PCV and VCV should primarily be understood as pressure- and volume-control modes. In PCV, the ventilator controls inspiratory pressure and tidal volume depends on compliance, resistance, patient effort, and leaks. In VCV, the ventilator controls volume or flow, while pressure becomes the variable determined by respiratory mechanics. In acute NIV these modes are used more selectively than NIV-PS, but understanding them helps interpret the waveforms shown in Figures 3.3 and 3.4.  PRVC is a hybrid mode: each breath behaves as a pressure-controlled breath, but the ventilator progressively adjusts pressure to approach a target volume. SIMV combines synchronized mandatory breaths with assisted spontaneous breaths. Figures 3.1 and 3.2 show SIMV-VC with PSV and SIMV-PC with PSV, respectively. These are not proposed as standard modes for acute NIV, but illustrate how mandatory and assisted spontaneous breaths can coexist when an ICU ventilator is used.      Download image     Figure 3.1. SIMV-VC + PSV. Synchronized mandatory volume-controlled breaths alternate with spontaneous breaths assisted by pressure support.      Download image     Figure 3.2. SIMV-PC + PSV. Synchronized mandatory pressure-controlled breaths alternate with spontaneous breaths assisted by pressure support.  Comparing pressure-controlled and volume-controlled modes is particularly useful for understanding the shape of the inspiratory flow waveform. In pressure-controlled ventilation, the ventilator reaches a preset inspiratory pressure and maintains it for the set inspiratory time; flow is high at the beginning of inspiration and then decreases according to respiratory mechanics. In conventional volume-controlled ventilation, the ventilator delivers a preset tidal volume or flow, while airway pressure becomes dependent on resistance, elastance, and patient interaction. In the non-invasive setting, these concepts are mainly interpretive: they help clinicians read waveforms and avoid confusing the name of a mode with the ventilator’s actual behavior [1-4].      Download image     Figure 3.3. PCV. Inspiratory pressure is controlled; flow is typically decelerating, and tidal volume depends on compliance, resistance, leaks, and patient effort.      Download image     Figure 3.4. VCV. Tidal volume and inspiratory flow are preset; the pressure required to deliver them becomes a consequence of respiratory mechanics.  When confronted with an acronym, the clinically relevant question is not simply what the mode is called, but which variable is controlled, which remains dependent on the patient’s mechanics, and whether the mode is appropriate for acute non-invasive ventilation.  If the ventilator controls pressure, volume depends on the patient and the circuit. If it controls volume or flow, pressure becomes the result of respiratory mechanics. If it uses a volume target with pressure control, each breath remains pressure-based, but pressure is adjusted over time to approach the desired mean volume.  Table 3.1. Practical terminology of ventilatory modes.      Download image     The practical point is to determine first whether the problem is aeration, alveolar ventilation, synchrony, apnea safety, or rt, the backup rate, and circuit behavior.  Volume-targeted modes: rationale and limitations  Volume-targeted modes such as VAPS and AVAPS are mainly useful in patients whose tidal volume tends to vary over time. Their logic is not that of conventional VCV: the ventilator maintains pressure-support ventilation and gradually adjusts pressure, within predefined limits, to achieve an average target volume. In other words, the volume target guides adjustment of support, while each individual breath remains essentially pressure-based.  This distinction is crucial in NIV. With large leaks, an unstable interface, or major asynchronies, estimated tidal volume may not correspond to effective tidal volume. VAPS/AVAPS should therefore not be considered “automatic” modes that can replace clinical, ventilatory, and blood-gas monitoring. They may help maintain more stable average ventilation, but still require appropriate pressure limits, leak control, comfort assessment, and ABG verification.      Download image     Figure 3.7. PRVC. The mode uses breath-by-breath adaptive pressure control to approach a target volume while maintaining a decelerating flow profile.  Figure 3.7 is included mainly to clarify the concept of a hybrid pressure-controlled mode with a volume objective. PRVC is typical of mechanical ventilation on ICU ventilators; it is described here to avoid confusion with non-invasive volume-assured modes.      Download image     Figure 3.8. VAPS/AVAPS. Pressure support changes progressively to bring tidal volume toward the set target; monitoring remains essential in the presence of leaks or variable respiratory mechanics.  Figure 3.8 represents the concept most relevant to NIV: pressure support can be modulated over time to approach a volume target. Clinical usefulness depends on patient selection and setup quality, not on the acronym itself.  This approach may be useful when tidal volume varies with position, sleep, respiratory drive, compliance, resistance, or leaks. This is why the literature has mainly evaluated these modes in obesity hypoventilation syndrome (OHS), chronic hypoventilation, and patients with variable respiratory mechanics. In OHS, one crossover study showed a greater reduction in PtcCO2 with volume-assured pressure support than with conventional S/T, without a clear additional benefit in sleep quality or quality of life [5]. Another study found better control of nocturnal hypoventilation, but at the cost of a greater perception of leaks, “too much air,” and worse subjective comfort [6].  In larger randomized studies or studies using protocolized titration, the advantage over fixed pressure support is less clear. In patients with super-obesity and chronic respiratory failure, volume-targeted support did not produce clinically relevant differences compared with fixed pressure support when both were set using a rigorous protocol [7]. In stable OHS, adding auto-EPAP and a volume target produced results similar to S/T for gas exchange and objective sleep quality, while reducing setup time [8].  Evidence is more limited in acute COPD exacerbations. A small pilot trial did not show a statistically significant improvement in comfort compared with conventional S/T, although both groups improved clinically [9]. In the acute setting, a volume target should therefore not replace early clinical assessment: respiratory rate, comfort, ABG, leaks, tidal volumes, asynchronies, and respiratory muscle work remain decisive.  Auto-EPAP and hybrid modes  Clinical experience in pediatric patients with nocturnal hypoventilation likewise supports interpreting volume-targeted modes as tools for adapting support, not as substitutes for monitoring leaks, comfort, and ventilatory response [10].  Some hybrid modes adjust not only inspiratory support but also expiratory pressure to maintain upper-airway patency and reduce residual obstructive events. The physiological concept is to distinguish two targets: EPAP acts on expiratory collapse, upper-airway obstruction, and aeration; pressure support acts on alveolar ventilation and PaCO2.  This distinction is particularly useful in OHS associated with obstructive sleep apnea, where hypoventilation and upper-airway collapse coexist. A hybrid mode may attempt to adapt EPAP to obstructive events and pressure support to the volume target. This does not mean that the mode is automatically superior: in clinical trials, outcomes depend on the patient phenotype, setup quality, interface, leaks, and tolerance.  Single-limb and dual-limb circuits  The circuit is part of the ventilatory system. It does not by itself determine NIV success, but it affects volume measurement, leak management, the risk of rebreathing, and trigger/cycling behavior.  In a single-limb circuit, inspiration and expiration occur through the same tubing. CO2 elimination requires a calibrated intentional leak or an expiratory valve. This configuration is simple and widely used in NIV, but makes volume and leak estimates more dependent on ventilator algorithms. If the intentional leak is inadequate, or if the circuit and interface are incompatible, rebreathing may occur.  In a dual-limb circuit, inspiratory and expiratory limbs are separate. This allows more controlled measurement of expiratory flow and exhaled volume in many conditions, but requires compatibility between ventilator, circuit, and interface. It is not inherently “better”; it is different. In acute patients, what matters most is that the selected system provides stable pressure, manageable leaks, and acceptable synchrony.      Download image     Figure 3.9. NIV circuits: single-limb and dual-limb. In a single-limb circuit, inspiration and expiration share the same tubing and CO2 elimination depends on an intentional leak or valve. In a dual-limb circuit, inspiratory and expiratory limbs are separate, with different handling of expiratory-flow measurement.  Leak compensation and automatic trigger/cycling  NIV is inevitably ventilation with leaks. The ventilator must distinguish flow delivered to the patient from flow escaping through the interface or circuit. Dedicated NIV ventilators therefore use leak-compensation and tidal-volume estimation algorithms. These data are useful but should not be treated as perfect measurements: they become less reliable when leaks are large, variable, or poorly compensated.  Modern algorithms can automatically adapt trigger and cycling thresholds, estimate patient flow, and correct the baseline in the presence of leaks. The practical advantage is a reduced need for continuous manual adjustment. The limitation is that automation does not understand the clinical context: auto-triggering, ineffective efforts, delayed cycling, and other asynchronies may still occur, especially with an unstable mask, auto-PEEP, severe obstruction, high respiratory drive, or sedation [11-14].  The ventilator display must therefore be interpreted together with the patient. If estimated tidal volume appears adequate but the patient remains tachypneic, recruits the abdominal muscles, has a high TFdi, or worsens on ABG, the mode is not truly working. If LUS improves but comfort worsens and leaks increase, the pressure may have reached a pulmonary target while compromising tolerance of the trial.  Practical interpretation of pressure, flow, and volume waveforms  Ventilator waveforms often reveal the logic of a mode better than its commercial name. At a minimum, waveform interpretation should ask which variable is controlled, which variable is a consequence of the patient’s mechanics, and what shape the inspiratory flow waveform takes.  Waveforms are distributed throughout the relevant sections; titles and numbers remain in the captions so that numbering can still be modified if figures are added or removed in the future.  These waveforms are not intended to turn the manual into a course on invasive mechanical ventilation. Their purpose is to make the logic clearer: in pressure modes, flow adapts to the patient’s mechanics; in conventional VCV, flow is set; in hybrid modes, the ventilator adjusts pressure to approach a volume target; in SIMV, synchronized mandatory breaths coexist with assisted spontaneous breaths [1-4].  The operating question remains the same: is the waveform I see consistent with the problem I want to correct, or am I merely changing the mode label without truly changing the pathophysiological target?  How to choose the mode in practice      Predominant situation    Appropriate mode    Priority monitoring      Hypoxemia with collapse/recruitability and preserved respiratory pump    CPAP or BiLevel with low PS if needed for comfort    LUS, SpO2/FiO2, arterial pressure, comfort      Hypercapnia with respiratory muscle fatigue    NIV-PS / BiLevel S or S/T    pH, PaCO2, respiratory rate, diaphragm, leaks, asynchronies      Chronic hypoventilation, OHS, variable mechanics during sleep    BiLevel S/T; consider volume-targeted PS if Vt is unstable    TcCO2/PaCO2, estimated Vt, adherence, comfort, leak      OHS with residual obstructive events    BiLevel with adequate EPAP; consider auto-EPAP if available    residual AHI, required EPAP, comfort, PaCO2      High respiratory drive, heterogeneous lung, high tidal volumes in de novo hypoxemia    Short trial or escalation: do not chase volume alone    respiratory rate, estimated Vt, LUS, ABG, signs of failure      Table 3.2. Practical choice of NIV mode according to the dominant problem. Volume-targeted modes and auto-EPAP should be regarded as adaptive tools, not shortcuts that replace early monitoring.  Role of ultrasound  Ultrasound helps determine whether the selected mode has a real target. If the dominant problem is lung aeration, it can identify loss of aeration, collapse, edema, or potentially reversible atelectasis. If the dominant problem involves the respiratory muscles, assessment of the diaphragm, intercostal muscles, and abdominal muscles becomes more relevant than the lung pattern alone.  In volume-targeted modes, ultrasound is particularly useful for avoiding false reassurance: an apparently adequate mean volume may coexist with high respiratory drive, an overloaded diaphragm, active abdominal muscles, and a heterogeneous lung. In these situations, the problem is not to “adjust the target,” but to determine whether the non-invasive trial is still appropriate [15-17].  Pitfall to avoid  The most common mistake is to select or change a mode because it appears “more advanced,” without knowing which target needs correction. Increasing pressures, changing modes, or chasing a target volume does not automatically provide more effective support. Technology helps only when the problem to be treated is clear: aeration, alveolar ventilation, synchrony, apnea safety, or tidal-volume variability.      Key messages\nThe name of the mode is not enough: understand what the ventilator controls and which problem is being treated.\nCPAP, BiLevel, NIV-PS, S/T, PCV, VCV, PRVC, AVAPS, and SIMV are not synonyms.\nCPAP maintains continuous pressure and is most useful when the problem is aeration or oxygenation.\nNIV-PS/BiLevel adds inspiratory support and is more appropriate when the problem is hypercapnia or respiratory fatigue.\nIn pressure modes, volume depends on the patient and respiratory mechanics; in volume modes, pressure becomes the consequence.\nVolume-targeted modes can help but do not replace clinical, ventilator, and ultrasound monitoring.\nSingle-limb and dual-limb circuits influence leaks, rebreathing, volume measurement, and synchrony.\nPressure, flow, and volume waveforms help clarify how the selected mode is actually behaving.      References for Chapter 3  1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  2. Nava S, Hill N. Non-invasive ventilation in may fail if the mask leaks, the helmet is poorly managed, the patient is claustrophobic, the trigger fails to detect effort, cycling is delayed, skin injury develops, or gastric distension makes support intolerable.<\/p><p>This chapter has a very practical objective: to select the most appropriate interface, rapidly recognize tolerance problems, and determine when a non-invasive trial is no longer safe.<\/p><p>The central message is simple: NIV works only if support is actually delivered to the patient and is tolerated long enough to produce a clinical effect.<\/p><h4>When not to start or when to stop NIV: practical contraindications<\/h4><p>Interface selection must be preceded by a safety assessment. NIV requires a patient who can be closely observed, reassessed promptly, and is sufficiently cooperative to tolerate the device without compromising airway protection, secretion management, or timely escalation. If these conditions are not met, the clinical problem is not simply NIV failure, but the risk of delaying a more appropriate treatment [1-3].<\/p><p>Conditions incompatible with a prolonged non-invasive trial include respiratory arrest or gasping, unstabilized shock, uncontrolled hemodynamic instability, inability to protect the airway, active vomiting or high aspiration risk, copious unmanageable secretions, clinically significant hemoptysis, facial trauma or recent surgery preventing a secure interface seal, clinically relevant undrained pneumothorax, and persistent patient refusal.<\/p><p>Agitation, claustrophobia, limited cooperation, fluctuating mental status, severe dyssynchrony, major skin lesions, recent esophagogastric surgery, marked pain, or gastric distension are not always absolute contraindications, but they require a short, closely monitored trial with a predefined objective and explicit stopping criteria.<\/p><p>Operationally, NIV must not become an indefinite trial when airway protection, secretion management, rapid correction of interface prob
