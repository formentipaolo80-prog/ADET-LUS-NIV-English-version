g LUS. If LUS does not change, FiO2 remains high, the pattern is heterogeneous, or hemodynamic instability develops, the phenotype should be reassessed.  Pitfall to avoid  Not all B-lines indicate cardiogenic pulmonary edema. Disorganized B-lines, an irregular pleura, subpleural consolidations, and a patchy distribution should suggest pneumonia, an ARDS-like process, fibrosis, or primary lung injury.  Scenario 3. Pneumonia and de novo hypoxemic respiratory failure  This is the scenario in which LUS is most useful for avoiding false reassurance. SpO2 may improve with high FiO2 and positive pressure while the patient continues to have high respiratory drive, high work of breathing, and progressive regional loss of aeration [3,5,7-9].  LUS may show:  an irregular pleura;  a disorganized pattern;  spared areas alternating with abnormal regions;  subpleural or more extensive consolidations;  air bronchograms;  a focal or asymmetric distribution.  Initial support may be HFNC or, in a highly selected, cooperative, closely monitorable patient without immediate intubation criteria, a trial of NIV-PS. NIV must not become a means of delaying escalation.  HFNC in de novo hypoxemic respiratory failure  If HFNC is chosen, the trial should follow the same time discipline as NIV: use an adequate, tolerated flow; set FiO2 to the oxygen saturation target; and reassess respiratory rate, respiratory muscle work, LUS, and ROX index early. Acceptable SpO2 with high FiO2, a ROX index that is not improving, and persistently hyperactive diaphragm/intercostal muscles should not be interpreted as stabilization.  Early reassessment is mandatory. If respiratory rate remains high, FiO2 remains elevated, TFdi/TR stay high, LUS is unchanged or worsening, ABG is unfavorable, or comfort is poor, the trial is at risk of failure.  Scenario 4. Postoperative state, obesity, and dependent atelectasis  In postoperative, obese, bedridden, or painful patients, the main problem may be dependent loss of aeration. LUS may show posterior or basal consolidations, reduced regional aeration, air bronchograms, associated pleural effusion, or signs of compression.  In this setting, positive pressure may be useful but should be combined with other interventions. CPAP/EPAP may promote reaeration if the region is recruitable. Positioning, analgesia, mobilization, respiratory physiotherapy, secretion management, and an effective cough are often equally important.      Download image     Figure 11.4. Heterogeneous lung: pneumonia, de novo hypoxemia, and atelectasis. In heterogeneous patterns, LUS helps distinguish recruitable loss of aeration, non-recruitable consolidation, and progressive deterioration during a non-invasive trial.  Monitoring should focus on dependent and posterior regions. If support is effective, one should expect a lower FiO2 requirement, better comfort, possible partial reaeration, and reduced work of breathing. If consolidation remains unchanged or worsens, consider secretions, bronchial obstruction, a static air bronchogram, pleural effusion, or non-recruitable disease.  Pitfall to avoid  The most common error is to assume that every consolidation is recruitable. LUS should help determine whether increasing EPAP/PEEP is rational or whether a different causal treatment is required.  Another common error is to turn LUS into an isolated diagnosis. LUS alone does not determine which ventilatory support to use; it identifies a plausible target. The decision arises from integration of the ultrasound pattern, work of breathing, ABG, comfort, and hemodynamic tolerance.  LUS does not choose the mode; it makes visible the problem that the mode is intended to correct.  References for Chapter 11  1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.  3. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.  4. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.  5. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.  6. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124.  7. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.  8. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.  9. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800. "}, {"part": "Part IV — Final Operational Synthesis", "title": "Chapter 12. ABG Interpretation in Ultrasound-Guided NIV", "tag": "Ch. 12", "html": "<h4>Practical objective<\/h4><p>Arterial blood gas analysis (ABG) should not be interpreted as a list of separate values, but as a concise representation of the patient’s ventilatory, metabolic, perfusion, and oxygenation status. In patients considered for HFNC, CPAP, or pressure-support NIV, ABG helps distinguish ventilatory failure, metabolic disturbance, hypoperfusion, and hypoxemia, and helps separate a true pathophysiological response from merely apparent stabilization [1-4].<\/p><p>Within an ultrasound-guided NIV pathway, ABG does not replace clinical assessment, ventilator data, or ultrasound; it connects them. PaCO2 reflects alveolar ventilation, pH indicates whether compensation is still adequate, bicarbonate and base excess describe the metabolic component, lactate and chloride clarify perfusion and iatrogenic factors, and PaO2 together with FiO2 defines oxygenation. Practical value comes not from a single number but from the trend after support is started or modified.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Practical message. The question is not simply “what is the patient’s pH?” The correct question is: which variable is driving the pH, and what should I change in NIV or causal treatment?<\/p><\/th><\/tr><\/table><\/div><h4>Why ABG is essential during NIV<\/h4><p>NIV may rapidly improve oxygen saturation without truly correcting the pathophysiological problem. Higher FiO2 may produce acceptable SpO2 while the patient remains tachypneic, hypercapnic, acidotic, or has high respiratory drive. Similarly, a reassuring initial ultrasound image does not guarantee that support is adequately ventilating the patient or reducing respiratory muscle work.<\/p><p>ABG is therefore useful in three main situations: before starting support, to define severity and mechanism; during the trial, to verify whether pH, PaCO2, and oxygenation are moving in the expected direction; and at the decision point, to avoid prolonging ineffective NIV. In hypercapnic patients in particular, respiratory rate and SpO2 are not enough: improvement should also be reflected in pH and PaCO2, while taking the chronicity of the disturbance into account.<\/p><h4>Before interpretation: sample, context, and ventilator setting<\/h4><p>Before discussing formulas and compensation, first ask whether the sample is reliable and whether the context is known. An ABG without the sampling time, actual FiO2, support modality, EPAP/PEEP, pressure support, respiratory rate, and treatment delivered in the preceding hours is incomplete information. Even the best interpretive method may lead to the wrong conclusion if the sample is venous, diluted, analyzed late, or inconsistent with the clinical picture.<\/p><p>In this manual, every ABG used for NIV decision-making should be linked to three minimum pieces of information: current support and major settings, timing relative to starting or modifying NIV, and the patient’s clinical trend. Without this context, ABG risks becoming an isolated number rather than a guide to treatment.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_51.png\" alt=\"English teaching figure 51\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_51.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 12.1. Integrated ABG interpretation algorithm. Interpretation starts with pH, identifies the variable driving it, and links the finding to a change in NIV or causal treatment.<\/p><h4>Practical interpretation sequence<\/h4><p>A fixed sequence reduces errors. The first step is pH, which indicates acidemia, alkalemia, or an apparently normal pH. The second is PaCO2, which identifies the immediate ventilatory component: an increase tends to acidify, while a decrease tends to alkalinize. The third step is the metabolic component, assessed through bicarbonate, base excess, anion gap, lactate, chloride, and albumin.<\/p><p>Interpretation becomes reliable only after checking whether the expected compensation is present. If compensation does not fit, the disorder is not simple. This is common in critically ill patients: lactic acidosis may coexist with respiratory alkalosis, chronic hypercapnia with hypochloremic metabolic alkalosis, and fluid-related hyperchloremic acidosis may coexist with sepsis or renal failure.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Question<\/p><\/th><th><p>Main variable<\/p><\/th><th><p>Practical meaning during NIV<\/p><\/th><\/tr><tr><td><p>Is pH low, high, or normal?<\/p><\/td><td><p>pH<\/p><\/td><td><p>Defines the apparent direction of the disorder but is not enough to judge severity.<\/p><\/td><\/tr><tr><td><p>Is alveolar ventilation adequate?<\/p><\/td><td><p>PaCO2<\/p><\/td><td><p>High PaCO2 indicates effective hypoventilation or fatigue; very low PaCO2 may indicate high respiratory drive.<\/p><\/td><\/tr><tr><td><p>Is the metabolic component relevant?<\/p><\/td><td><p>HCO3 / BE<\/p><\/td><td><p>Quantifies the overall metabolic burden without identifying its cause by itself.<\/p><\/td><\/tr><tr><td><p>Is compensation as expected?<\/p><\/td><td><p>Compensation formulas<\/p><\/td><td><p>If it does not fit, look for a mixed disorder.<\/p><\/td><\/tr><tr><td><p>Are unmeasured anions present?<\/p><\/td><td><p>Albumin-corrected AG<\/p><\/td><td><p>Useful for lactate, ketones, uremia, toxins, and masked acidity.<\/p><\/td><\/tr><tr><td><p>Are chloride or fluids contributing?<\/p><\/td><td><p>Na–Cl / simplified SID<\/p><\/td><td><p>Helps recognize hyperchloremic acidosis or hypochloremic alkalosis.<\/p><\/td><\/tr><tr><td><p>Is oxygenation coherent?<\/p><\/td><td><p>PaO2/FiO2, SaO2, Hb<\/p><\/td><td><p>PaO2 alone is insufficient without FiO2, PEEP/CPAP, and Hb.<\/p><\/td><\/tr><\/table><\/div><p>Table 12.1. Practical sequence for interpreting ABG in patients receiving non-invasive support.<\/p><h4>Normal pH: the most common trap<\/h4><p>A pH within the normal range does not exclude a severe disorder. It may result from opposing forces: lactic metabolic acidosis with respiratory alkalosis, hyperchloremic acidosis with hypoalbuminemia, or chronic hypercapnia with diuretic-related metabolic alkalosis. In septic patients, for example, high lactate and low bicarbonate may be masked by very low PaCO2 and hypoalbuminemia.<\/p><p>Whenever pH is normal but PaCO2, bicarbonate, base excess, or lactate is abnormal, a mixed disorder should be suspected. A normal pH should not be reassuring when the underlying variables are moving in opposite directions.<\/p><h4>Compensation should be calculated, not guessed<\/h4><p>Physiological compensation has predictable limits and does not overcompensate. If metabolic acidosis is associated with a PaCO2 that is lower or higher than expected, an additional respiratory component is present. If a hypercapnic patient has a bicarbonate concentration higher than expected for the chronicity of the disorder, an additional metabolic alkalosis may be present, often related to diuretics, vomiting, hypochloremia, or bicarbonate administration.<\/p><p>In a patient receiving NIV, this distinction is crucial. High PaCO2 with only mild pH alteration may indicate chronicity and renal compensation. High PaCO2 with rapidly worsening pH indicates acute or acute-on-chronic hypoventilation and requires reassessment of support, leaks, synchrony, and the threshold for escalation.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Primary disorder<\/p><\/th><th><p>Expected compensation<\/p><\/th><th><p>When to suspect a mixed disorder<\/p><\/th><\/tr><tr><td><p>Metabolic acidosis<\/p><\/td><td><p>PaCO2 = 1.5 × HCO3 + 8 ± 2<\/p><\/td><td><p>Higher PaCO2: associated respiratory acidosis; lower PaCO2: associated respiratory alkalosis.<\/p><\/td><\/tr><tr><td><p>Metabolic alkalosis<\/p><\/td><td><p>PaCO2 ≈ 0.7 × HCO3 + 20 ± 5<\/p><\/td><td><p>PaCO2 not appropriate for bicarbonate level or an inconsistent clinical picture.<\/p><\/td><\/tr><tr><td><p>Acute respiratory acidosis<\/p><\/td><td><p>HCO3 increases by ≈1 mEq/L for each +10 mmHg PaCO2<\/p><\/td><td><p>Bicarbonate too high or too low for the time course.<\/p><\/td><\/tr><tr><td><p>Chronic respiratory acidosis<\/p><\/td><td><p>HCO3 increases by ≈3.5–4 mEq/L for each +10 mmHg PaCO2<\/p><\/td><td><p>pH lower than expected or superimposed metabolic alkalosis.<\/p><\/td><\/tr><tr><td><p>Acute respiratory alkalosis<\/p><\/td><td><p>HCO3 decreases by ≈2 mEq/L for each −10 mmHg PaCO2<\/p><\/td><td><p>Very low HCO3 suggests an associated metabolic component.<\/p><\/td><\/tr><tr><td><p>Chronic respiratory alkalosis<\/p><\/td><td><p>HCO3 decreases by ≈4–5 mEq/L for each −10 mmHg PaCO2<\/p><\/td><td><p>Values inconsistent with clinical history and trend.<\/p><\/td><\/tr><\/table><\/div><p>Table 12.2. Expected compensation: compare the measured value with the predicted value before defining a simple acid–base disorder.<\/p><h4>Acute, chronic, and acute-on-chronic hypercapnia<\/h4><p>In hypercapnic patients, clinical history matters as much as the number itself. A PaCO2 of 70 mmHg in a stable patient with COPD and high bicarbonate does not have the same meaning as a PaCO2 of 70 mmHg with pH 7.20 and only mildly increased bicarbonate. In the first case, renal compensation suggests chronicity; in the second, the problem is acute or acute-on-chronic.<\/p><p>NIV-PS is particularly rational when hypercapnia is associated with acidemia, high work of breathing, and signs of fatigue. The initial goal is not to normalize PaCO2, but to improve pH, comfort, respiratory rate, and respiratory pump workload. In chronic COPD, pursuing a normal PaCO2 may be unrealistic and potentially harmful; trend and consistency with the clinical picture are what matter.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Application to NIV. In patients with COPD or OHS, hypochloremic metabolic alkalosis may maintain high bicarbonate levels and make ventilation more difficult. Check chloride, potassium, and diuretic therapy before attributing everything to respiratory muscle dysfunction.<\/p><\/th><\/tr><\/table><\/div><h4>Base excess, anion gap, and albumin<\/h4><p>Base excess quantifies the overall metabolic component but does not identify the mechanism responsible for it. A BE of −8 may be due to lactate, hyperchloremia, renal failure, or several causes acting together. It should therefore be interpreted together with the anion gap, albumin, lactate, and chloride.<\/p><p>The anion gap is useful for detecting unmeasured anions, but in critically ill patients it should be corrected for albumin. Hypoalbuminemia reduces plasma weak anions and lowers the apparent gap, potentially masking a high-gap acidosis. A practical formula is: corrected AG = AG + 2.5 × (4 − albumin in g/dL) [5].<\/p><p>A hypoalbuminemic septic patient may have only a moderately elevated anion gap despite high lactate. Without correction, the severity of the metabolic disturbance may be underestimated.<\/p><h4>Lactate: perfusion, stress, and trend<\/h4><p>Lactate is not automatically synonymous with tissue hypoxia, but it remains an important marker of metabolic and perfusion stress. During an NIV trial, elevated lactate changes the interpretation: respiratory failure with rising lactate should not be treated as a purely ventilatory problem. Shock, sepsis, ischemia, adrenergic drive, hepatic dysfunction, or impaired clearance should be considered.<\/p><p>Trend is more informative than an isolated value. If SpO2 and PaCO2 improve after NIV is started but lactate rises, the response is not fully favorable. The patient may still have a perfusion deficit or hemodynamic instability, and non-invasive support should not distract from causal treatment.<\/p><h4>Oxygenation: PaO2 without FiO2 is an incomplete number<\/h4><p>PaO2 in isolation is difficult to interpret if FiO2, EPAP/PEEP or CPAP, hemoglobin, oxygen saturation, and the clinical context are unknown. In ultrasound-guided NIV, oxygenation should be interpreted as the relationship between gas exchange, the support delivered, and oxygen requirements. An acceptable PaO2 achieved with very high FiO2 does not necessarily indicate success.<\/p><p>The PaO2/FiO2 ratio can help describe the severity of hypoxemia, but it must be contextualized: CPAP/EPAP, position, recruitment, LUS pattern, and patient comfort may all modify its meaning. Arterial oxygen content also matters: an anemic patient may have acceptable PaO2 and SaO2 but inadequate oxygen transport.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Remember. SpO2 and PaO2 describe oxygenation. By themselves, they do not demonstrate that alveolar ventilation, work of breathing, or perfusion has improved.<\/p><\/th><\/tr><\/table><\/div><h4>Simplified Stewart approach: chloride, SID, albumin, and fluids<\/h4><p>The traditional approach provides rapid orientation. The Stewart approach helps explain some complex ABGs, especially in critically ill patients treated with fluids, diuretics, or catecholamines, or in the presence of hypoalbuminemia. It does not need to become a mathematical exercise: at the bedside, remember the three main independent variables—PaCO2, strong ion difference (SID), and total weak acids (ATOT), represented mainly by albumin and phosphate [6-8].<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_52.png\" alt=\"English teaching figure 52\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_52.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 12.2. The three independent variables in the Stewart approach. PaCO2, SID, and ATOT help identify the mechanism driving pH.<\/p><p>The most useful shortcut is to compare chloride with sodium. When sodium and chloride are too close, SID decreases and plasma tends toward acidosis. When chloride is low relative to sodium, SID increases and an alkalinizing tendency develops. Lactate behaves as a strong anion: when it rises, SID falls and the system shifts toward acidosis. Low albumin reduces weak acids and therefore has an alkalinizing effect, potentially masking lactic or hyperchloremic acidosis.<\/p><p>This is particularly useful after large volumes of 0.9% NaCl. Normal saline has a SID of zero: when given in substantial amounts, it increases chloride relative to sodium and may produce hyperchloremic metabolic acidosis. In that situation, the patient may be acidotic because of fluid composition rather than hypoperfusion.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_53.png\" alt=\"English teaching figure 53\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_53.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 12.3. Stewart at the bedside. Correcting pH means acting on the variable that is driving it: alveolar ventilation/NIV, fluid and strong-ion composition, albumin, and phosphate.<\/p><h4>ABG at the four decision points of ultrasound-guided NIV<\/h4><p>ABG should be integrated into the timing of the non-invasive trial. Before NIV, it defines indication, severity, and target. During the first 5–10 minutes, the main issues are technical performance and adaptation; ABG does not always need to be repeated, but if the patient worsens, the actual ventilator setting and FiO2 must be known. At 30–60 minutes, ABG should begin to show a trend consistent with the pathophysiological response. At two hours, it contributes to the decision to continue, modify, or stop the trial.<\/p><p>In hypercapnic patients, the expected direction is improved pH and reduced or stabilized PaCO2 together with lower work of breathing. In hypoxemic patients, look for lower FiO2 requirements, improved PaO2/FiO2, and consistency with LUS and clinical findings. In septic or hypoperfused patients, lactate and base excess should be interpreted together with perfusion and should not automatically be attributed to respiratory support.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Timing<\/p><\/th><th><p>Main question<\/p><\/th><th><p>What to look for in the ABG<\/p><\/th><th><p>Practical decision<\/p><\/th><\/tr><tr><td><p>Before NIV<\/p><\/td><td><p>Is non-invasive support indicated?<\/p><\/td><td><p>pH, PaCO2, HCO3/BE, PaO2/FiO2, lactate, and when relevant AG and chloride.<\/p><\/td><td><p>Choose HFNC, CPAP, or NIV-PS according to the pathophysiological target.<\/p><\/td><\/tr><tr><td><p>5–10 minutes<\/p><\/td><td><p>Is support actually reaching the patient?<\/p><\/td><td><p>ABG only if deterioration or instability occurs; verify actual FiO2 and settings.<\/p><\/td><td><p>Correct interface, leaks, trigger, cycling, and comfort before increasing pressures.<\/p><\/td><\/tr><tr><td><p>30–60 minutes<\/p><\/td><td><p>Is a pathophysiological response emerging?<\/p><\/td><td><p>Improving pH and PaCO2 in hypercapnia; decreasing FiO2 requirement; lactate not increasing.<\/p><\/td><td><p>Continue if the trend is coherent; adjust if the response is incomplete.<\/p><\/td><\/tr><tr><td><p>2 hours<\/p><\/td><td><p>Should the trial continue?<\/p><\/td><td><p>pH/PaCO2, PaO2/FiO2, required FiO2, lactate, and consistency with clinical findings and LUS.<\/p><\/td><td><p>Continue, change strategy, or stop the trial if failure is likely.<\/p><\/td><\/tr><\/table><\/div><p>Table 12.3. Practical use of ABG at the four main time points of an ultrasound-guided NIV trial.<\/p><h4>Key clinical examples<\/h4><p>Several recurring ABG profiles are particularly useful for linking biochemical findings to the choice of respiratory support.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Scenario<\/p><\/th><th><p>Typical ABG profile<\/p><\/th><th><p>NIV interpretation<\/p><\/th><\/tr><tr><td><p>Hypercapnic COPD<\/p><\/td><td><p>High PaCO2, low pH if acute or acute-on-chronic, high HCO3 if chronic compensation is present.<\/p><\/td><td><p>NIV-PS; monitor pH/PaCO2, comfort, leaks, auto-PEEP, cycling, and chloride if metabolic alkalosis is present.<\/p><\/td><\/tr><tr><td><p>Cardiogenic pulmonary edema<\/p><\/td><td><p>Hypoxemia, possible hypocapnia from distress or hypercapnia with fatigue; lactate if hypoperfusion is present.<\/p><\/td><td><p>CPAP/EPAP for a congestive phenotype; ABG should improve together with LUS and clinical status.<\/p><\/td><\/tr><tr><td><p>Pneumonia/de novo hypoxemia<\/p><\/td><td><p>Reduced PaO2/FiO2, often low PaCO2 from high drive; rising PaCO2 is an unfavorable sign.<\/p><\/td><td><p>Short trial and a low threshold for escalation if respiratory drive, LUS, and ABG do not improve.<\/p><\/td><\/tr><tr><td><p>Sepsis/lactate<\/p><\/td><td><p>Lactic metabolic acidosis, often with respiratory alkalosis; pH may even be normal when opposing forces coexist.<\/p><\/td><td><p>Do not confuse respiratory compensation with stability; treat perfusion and the underlying cause.<\/p><\/td><\/tr><tr><td><p>Hyperchloremic acidosis<\/p><\/td><td><p>Negative BE, low HCO3, no major lactate elevation, high Cl relative to Na.<\/p><\/td><td><p>Review fluids and chloride; do not automatically attribute acidosis to ventilatory failure.<\/p><\/td><\/tr><\/table><\/div><p>Table 12.4. Common ABG profiles and their implications during an NIV trial.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to use ABG simply to label a disorder without translating it into a decision. Writing “respiratory acidosis” or “metabolic acidosis” is not enough. One should state whether compensation is appropriate, whether a mixed disorder is present, whether oxygenation can be assessed using the current FiO2, whether lactate and chloride explain part of the picture, and whether the trend supports continuing NIV.<\/p><p>Another error is to confuse correction of SpO2 with trial success. If SpO2 improves but pH, PaCO2, lactate, required FiO2, LUS, or work of breathing do not move in the right direction, the patient should not be considered stabilized.<\/p><h4>References for Chapter 12<\/h4><p>1. Stewart PA. Modern quantitative acid-base chemistry. Can J Physio Pharmacol. 1983;61(12):1444-1461.<\/p><p>2. Kellum JA. Clinical review: reunification of acid-base physiology. Crit Care. 2005;9(5):500-507.<\/p><p>3. Berend K, de Vries APJ, Gans ROB. Physiological approach to assessment of acid-base disturbances. N Engl J Med. 2014;371(15):1434-1445.<\/p><p>4. Yee J, Durning SJ, O&#x27;Connor AB, Battistone MJ. Fundamentals of arterial blood gas interpretation. J Clin Med. 2022;11(17):5082.<\/p><p>5. Figge J, Jabor A, Kazda A, Fencl V. Anion gap and hypoalbuminemia. Crit Care Med. 1998;26(11):1807-1810.<\/p><p>6. Morgan TJ. The meaning of acid-base abnormalities in the intensive care unit: effects of fluid administration. Crit Care. 2005;9(2):204-211.<\/p><p>7. Morgan TJ. The Stewart approach - one clinician&#x27;s perspective. Clin Biochem Rev. 2009;30(2):41-54.<\/p><p>8. Wooten EW. Quantitative acid-base physiology using the Stewart model. Crit Care. 2004;8(6):448-452.<\/p>", "plain": " Practical objective  Arterial blood gas analysis (ABG) should not be interpreted as a list of separate values, but as a concise representation of the patient’s ventilatory, metabolic, perfusion, and oxygenation status. In patients considered for HFNC, CPAP, or pressure-support NIV, ABG helps distinguish ventilatory failure, metabolic disturbance, hypoperfusion, and hypoxemia, and helps separate a true pathophysiological response from merely apparent stabilization [1-4].  Within an ultrasound-guided NIV pathway, ABG does not replace clinical assessment, ventilator data, or ultrasound; it connects them. PaCO2 reflects alveolar ventilation, pH indicates whether compensation is still adequate, bicarbonate and base excess describe the metabolic component, lactate and chloride clarify perfusion and iatrogenic factors, and PaO2 together with FiO2 defines oxygenation. Practical value comes not from a single number but from the trend after support is started or modified.      Practical message. The question is not simply “what is the patient’s pH?” The correct question is: which variable is driving the pH, and what should I change in NIV or causal treatment?      Why ABG is essential during NIV  NIV may rapidly improve oxygen saturation without truly correcting the pathophysiological problem. Higher FiO2 may produce acceptable SpO2 while the patient remains tachypneic, hypercapnic, acidotic, or has high respiratory drive. Similarly, a reassuring initial ultrasound image does not guarantee that support is adequately ventilating the patient or reducing respiratory muscle work.  ABG is therefore useful in three main situations: before starting support, to define severity and mechanism; during the trial, to verify whether pH, PaCO2, and oxygenation are moving in the expected direction; and at the decision point, to avoid prolonging ineffective NIV. In hypercapnic patients in particular, respiratory rate and SpO2 are not enough: improvement should also be reflected in pH and PaCO2, while taking the chronicity of the disturbance into account.  Before interpretation: sample, context, and ventilator setting  Before discussing formulas and compensation, first ask whether the sample is reliable and whether the context is known. An ABG without the sampling time, actual FiO2, support modality, EPAP/PEEP, pressure support, respiratory rate, and treatment delivered in the preceding hours is incomplete information. Even the best interpretive method may lead to the wrong conclusion if the sample is venous, diluted, analyzed late, or inconsistent with the clinical picture.  In this manual, every ABG used for NIV decision-making should be linked to three minimum pieces of information: current support and major settings, timing relative to starting or modifying NIV, and the patient’s clinical trend. Without this context, ABG risks becoming an isolated number rather than a guide to treatment.      Download image     Figure 12.1. Integrated ABG interpretation algorithm. Interpretation starts with pH, identifies the variable driving it, and links the finding to a change in NIV or causal treatment.  Practical interpretation sequence  A fixed sequence reduces errors. The first step is pH, which indicates acidemia, alkalemia, or an apparently normal pH. The second is PaCO2, which identifies the immediate ventilatory component: an increase tends to acidify, while a decrease tends to alkalinize. The third step is the metabolic component, assessed through bicarbonate, base excess, anion gap, lactate, chloride, and albumin.  Interpretation becomes reliable only after checking whether the expected compensation is present. If compensation does not fit, the disorder is not simple. This is common in critically ill patients: lactic acidosis may coexist with respiratory alkalosis, chronic hypercapnia with hypochloremic metabolic alkalosis, and fluid-related hyperchloremic acidosis may coexist with sepsis or renal failure.      Question    Main variable    Practical meaning during NIV      Is pH low, high, or normal?    pH    Defines the apparent direction of the disorder but is not enough to judge severity.      Is alveolar ventilation adequate?    PaCO2    High PaCO2 indicates effective hypoventilation or fatigue; very low PaCO2 may indicate high respiratory drive.      Is the metabolic component relevant?    HCO3 / BE    Quantifies the overall metabolic burden without identifying its cause by itself.      Is compensation as expected?    Compensation formulas    If it does not fit, look for a mixed disorder.      Are unmeasured anions present?    Albumin-corrected AG    Useful for lactate, ketones, uremia, toxins, and masked acidity.      Are chloride or fluids contributing?    Na–Cl / simplified SID    Helps recognize hyperchloremic acidosis or hypochloremic alkalosis.      Is oxygenation coherent?    PaO2/FiO2, SaO2, Hb    PaO2 alone is insufficient without FiO2, PEEP/CPAP, and Hb.      Table 12.1. Practical sequence for interpreting ABG in patients receiving non-invasive support.  Normal pH: the most common trap  A pH within the normal range does not exclude a severe disorder. It may result from opposing forces: lactic metabolic acidosis with respiratory alkalosis, hyperchloremic acidosis with hypoalbuminemia, or chronic hypercapnia with diuretic-related metabolic alkalosis. In septic patients, for example, high lactate and low bicarbonate may be masked by very low PaCO2 and hypoalbuminemia.  Whenever pH is normal but PaCO2, bicarbonate, base excess, or lactate is abnormal, a mixed disorder should be suspected. A normal pH should not be reassuring when the underlying variables are moving in opposite directions.  Compensation should be calculated, not guessed  Physiological compensation has predictable limits and does not overcompensate. If metabolic acidosis is associated with a PaCO2 that is lower or higher than expected, an additional respiratory component is present. If a hypercapnic patient has a bicarbonate concentration higher than expected for the chronicity of the disorder, an additional metabolic alkalosis may be present, often related to diuretics, vomiting, hypochloremia, or bicarbonate administration.  In a patient receiving NIV, this distinction is crucial. High PaCO2 with only mild pH alteration may indicate chronicity and renal compensation. High PaCO2 with rapidly worsening pH indicates acute or acute-on-chronic hypoventilation and requires reassessment of support, leaks, synchrony, and the threshold for escalation.      Primary disorder    Expected compensation    When to suspect a mixed disorder      Metabolic acidosis    PaCO2 = 1.5 × HCO3 + 8 ± 2    Higher PaCO2: associated respiratory acidosis; lower PaCO2: associated respiratory alkalosis.      Metabolic alkalosis    PaCO2 ≈ 0.7 × HCO3 + 20 ± 5    PaCO2 not appropriate for bicarbonate level or an inconsistent clinical picture.      Acute respiratory acidosis    HCO3 increases by ≈1 mEq/L for each +10 mmHg PaCO2    Bicarbonate too high or too low for the time course.      Chronic respiratory acidosis    HCO3 increases by ≈3.5–4 mEq/L for each +10 mmHg PaCO2    pH lower than expected or superimposed metabolic alkalosis.      Acute respiratory alkalosis    HCO3 decreases by ≈2 mEq/L for each −10 mmHg PaCO2    Very low HCO3 suggests an associated metabolic component.      Chronic respiratory alkalosis    HCO3 decreases by ≈4–5 mEq/L for each −10 mmHg PaCO2    Values inconsistent with clinical history and trend.      Table 12.2. Expected compensation: compare the measured value with the predicted value before defining a simple acid–base disorder.  Acute, chronic, and acute-on-chronic hypercapnia  In hypercapnic patients, clinical history matters as much as the number itself. A PaCO2 of 70 mmHg in a stable patient with COPD and high bicarbonate does not have the same meaning as a PaCO2 of 70 mmHg with pH 7.20 and only mildly increased bicarbonate. In the first case, renal compensation suggests chronicity; in the second, the problem is acute or acute-on-chronic.  NIV-PS is particularly rational when hypercapnia is associated with acidemia, high work of breathing, and signs of fatigue. The initial goal is not to normalize PaCO2, but to improve pH, comfort, respiratory rate, and respiratory pump workload. In chronic COPD, pursuing a normal PaCO2 may be unrealistic and potentially harmful; trend and consistency with the clinical picture are what matter.      Application to NIV. In patients with COPD or OHS, hypochloremic metabolic alkalosis may maintain high bicarbonate levels and make ventilation more difficult. Check chloride, potassium, and diuretic therapy before attributing everything to respiratory muscle dysfunction.      Base excess, anion gap, and albumin  Base excess quantifies the overall metabolic component but does not identify the mechanism responsible for it. A BE of −8 may be due to lactate, hyperchloremia, renal failure, or several causes acting together. It should therefore be interpreted together with the anion gap, albumin, lactate, and chloride.  The anion gap is useful for detecting unmeasured anions, but in critically ill patients it should be corrected for albumin. Hypoalbuminemia reduces plasma weak anions and lowers the apparent gap, potentially masking a high-gap acidosis. A practical formula is: corrected AG = AG + 2.5 × (4 − albumin in g/dL) [5].  A hypoalbuminemic septic patient may have only a moderately elevated anion gap despite high lactate. Without correction, the severity of the metabolic disturbance may be underestimated.  Lactate: perfusion, stress, and trend  Lactate is not automatically synonymous with tissue hypoxia, but it remains an important marker of metabolic and perfusion stress. During an NIV trial, elevated lactate changes the interpretation: respiratory failure with rising lactate should not be treated as a purely ventilatory problem. Shock, sepsis, ischemia, adrenergic drive, hepatic dysfunction, or impaired clearance should be considered.  Trend is more informative than an isolated value. If SpO2 and PaCO2 improve after NIV is started but lactate rises, the response is not fully favorable. The patient may still have a perfusion deficit or hemodynamic instability, and non-invasive support should not distract from causal treatment.  Oxygenation: PaO2 without FiO2 is an incomplete number  PaO2 in isolation is difficult to interpret if FiO2, EPAP/PEEP or CPAP, hemoglobin, oxygen saturation, and the clinical context are unknown. In ultrasound-guided NIV, oxygenation should be interpreted as the relationship between gas exchange, the support delivered, and oxygen requirements. An acceptable PaO2 achieved with very high FiO2 does not necessarily indicate success.  The PaO2/FiO2 ratio can help describe the severity of hypoxemia, but it must be contextualized: CPAP/EPAP, position, recruitment, LUS pattern, and patient comfort may all modify its meaning. Arterial oxygen content also matters: an anemic patient may have acceptable PaO2 and SaO2 but inadequate oxygen transport.      Remember. SpO2 and PaO2 describe oxygenation. By themselves, they do not demonstrate that alveolar ventilation, work of breathing, or perfusion has improved.      Simplified Stewart approach: chloride, SID, albumin, and fluids  The traditional approach provides rapid orientation. The Stewart approach helps explain some complex ABGs, especially in critically ill patients treated with fluids, diuretics, or catecholamines, or in the presence of hypoalbuminemia. It does not need to become a mathematical exercise: at the bedside, remember the three main independent variables—PaCO2, strong ion difference (SID), and total weak acids (ATOT), represented mainly by albumin and phosphate [6-8].      Download image     Figure 12.2. The three independent variables in the Stewart approach. PaCO2, SID, and ATOT help identify the mechanism driving pH.  The most useful shortcut is to compare chloride with sodium. When sodium and chloride are too close, SID decreases and plasma tends toward acidosis. When chloride is low relative to sodium, SID increases and an alkalinizing tendency develops. Lactate behaves as a strong anion: when it rises, SID falls and the system shifts toward acidosis. Low albumin reduces weak acids and therefore has an alkalinizing effect, potentially masking lactic or hyperchloremic acidosis.  This is particularly useful after large volumes of 0.9% NaCl. Normal saline has a SID of zero: when given in substantial amounts, it increases chloride relative to sodium and may produce hyperchloremic metabolic acidosis. In that situation, the patient may be acidotic because of fluid composition rather than hypoperfusion.      Download image     Figure 12.3. Stewart at the bedside. Correcting pH means acting on the variable that is driving it: alveolar ventilation/NIV, fluid and strong-ion composition, albumin, and phosphate.  ABG at the four decision points of ultrasound-guided NIV  ABG should be integrated into the timing of the non-invasive trial. Before NIV, it defines indication, severity, and target. During the first 5–10 minutes, the main issues are technical performance and adaptation; ABG does not always need to be repeated, but if the patient worsens, the actual ventilator setting and FiO2 must be known. At 30–60 minutes, ABG should begin to show a trend consistent with the pathophysiological response. At two hours, it contributes to the decision to continue, modify, or stop the trial.  In hypercapnic patients, the expected direction is improved pH and reduced or stabilized PaCO2 together with lower work of breathing. In hypoxemic patients, look for lower FiO2 requirements, improved PaO2/FiO2, and consistency with LUS and clinical findings. In septic or hypoperfused patients, lactate and base excess should be interpreted together with perfusion and should not automatically be attributed to respiratory support.      Timing    Main question    What to look for in the ABG    Practical decision      Before NIV    Is non-invasive support indicated?    pH, PaCO2, HCO3/BE, PaO2/FiO2, lactate, and when relevant AG and chloride.    Choose HFNC, CPAP, or NIV-PS according to the pathophysiological target.      5–10 minutes    Is support actually reaching the patient?    ABG only if deterioration or instability occurs; verify actual FiO2 and settings.    Correct interface, leaks, trigger, cycling, and comfort before increasing pressures.      30–60 minutes    Is a pathophysiological response emerging?    Improving pH and PaCO2 in hypercapnia; decreasing FiO2 requirement; lactate not increasing.    Continue if the trend is coherent; adjust if the response is incomplete.      2 hours    Should the trial continue?    pH/PaCO2, PaO2/FiO2, required FiO2, lactate, and consistency with clinical findings and LUS.    Continue, change strategy, or stop the trial if failure is likely.      Table 12.3. Practical use of ABG at the four main time points of an ultrasound-guided NIV trial.  Key clinical examples  Several recurring ABG profiles are particularly useful for linking biochemical findings to the choice of respiratory support.      Scenario    Typical ABG profile    NIV interpretation      Hypercapnic COPD    High PaCO2, low pH if acute or acute-on-chronic, high HCO3 if chronic compensation is present.    NIV-PS; monitor pH/PaCO2, comfort, leaks, auto-PEEP, cycling, and chloride if metabolic alkalosis is present.      Cardiogenic pulmonary edema    Hypoxemia, possible hypocapnia from distress or hypercapnia with fatigue; lactate if hypoperfusion is present.    CPAP/EPAP for a congestive phenotype; ABG should improve together with LUS and clinical status.      Pneumonia/de novo hypoxemia    Reduced PaO2/FiO2, often low PaCO2 from high drive; rising PaCO2 is an unfavorable sign.    Short trial and a low threshold for escalation if respiratory drive, LUS, and ABG do not improve.      Sepsis/lactate    Lactic metabolic acidosis, often with respiratory alkalosis; pH may even be normal when opposing forces coexist.    Do not confuse respiratory compensation with stability; treat perfusion and the underlying cause.      Hyperchloremic acidosis    Negative BE, low HCO3, no major lactate elevation, high Cl relative to Na.    Review fluids and chloride; do not automatically attribute acidosis to ventilatory failure.      Table 12.4. Common ABG profiles and their implications during an NIV trial.  Pitfall to avoid  The most common error is to use ABG simply to label a disorder without translating it into a decision. Writing “respiratory acidosis” or “metabolic acidosis” is not enough. One should state whether compensation is appropriate, whether a mixed disorder is present, whether oxygenation can be assessed using the current FiO2, whether lactate and chloride explain part of the picture, and whether the trend supports continuing NIV.  Another error is to confuse correction of SpO2 with trial success. If SpO2 improves but pH, PaCO2, lactate, required FiO2, LUS, or work of breathing do not move in the right direction, the patient should not be considered stabilized.  References for Chapter 12  1. Stewart PA. Modern quantitative acid-base chemistry. Can J Physio Pharmacol. 1983;61(12):1444-1461.  2. Kellum JA. Clinical review: reunification of acid-base physiology. Crit Care. 2005;9(5):500-507.  3. Berend K, de Vries APJ, Gans ROB. Physiological approach to assessment of acid-base disturbances. N Engl J Med. 2014;371(15):1434-1445.  4. Yee J, Durning SJ, O&#x27;Connor AB, Battistone MJ. Fundamentals of arterial blood gas interpretation. J Clin Med. 2022;11(17):5082.  5. Figge J, Jabor A, Kazda A, Fencl V. Anion gap and hypoalbuminemia. Crit Care Med. 1998;26(11):1807-1810.  6. Morgan TJ. The meaning of acid-base abnormalities in the intensive care unit: effects of fluid administration. Crit Care. 2005;9(2):204-211.  7. Morgan TJ. The Stewart approach - one clinician&#x27;s perspective. Clin Biochem Rev. 2009;30(2):41-54.  8. Wooten EW. Quantitative acid-base physiology using the Stewart model. Crit Care. 2004;8(6):448-452. "}, {"part": "Part IV — Final Operational Synthesis", "title": "Chapter 13. Decision Timing in Ultrasound-Guided NIV", "tag": "Ch. 13", "html": "<h4>Practical objective<\/h4><p>Ultrasound applied to non-invasive ventilation should not create a pathway separate from clinical care. Its role is to organize clinical reasoning over time. The final aim of this manual is not to complete a checklist, but to know when to start a trial, how to correct it during the first minutes, how to recognize a true pathophysiological response, and when to stop without waiting any longer.<\/p><p>The entire pathway can be understood through four decision time points. Each has a dominant question. Before NIV, the question is whether there is an indication and which target should be treated. At 5–10 minutes, the question is whether support is actually reaching the patient. At 30–60 minutes, the question is whether the system is modifying the underlying pathophysiological mechanism by integrating lung ultrasound, respiratory muscle assessment, and ABG. At two hours, the question is no longer how to adjust one more parameter, but whether the trial should continue or end [1-5].<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_54.png\" alt=\"English teaching figure 54\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_54.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 13.1. Timeline of ultrasound-guided NIV. The final pathway summarizes four decision windows: indication, technical adaptation, pathophysiological response, and the two-hour decision.<\/p><h4>Step 1. Before setting NIV: indication<\/h4><p>Initial assessment should replace the generic question “Should I start NIV?” with a more useful one: what problem do I want to correct with non-invasive support? At this stage, integrate the clinical picture, ABG, work of breathing, LUS, diaphragm and accessory muscle activity, and hemodynamic tolerance of positive pressure.<\/p><p>Assess: predominant LUS pattern, distribution of aeration loss, presence of consolidations or pleural effusion, signs of congestion, an A-pattern associated with hypercapnia, diaphragmatic and respiratory muscle activity, hemodynamic status, and the patient’s ability to cooperate and protect the airway.<\/p><p>Interpret: an A-pattern with hypercapnia points toward a respiratory pump problem and pressure-support NIV; an orderly congestive pattern supports CPAP/EPAP; a heterogeneous lung with high respiratory drive requires caution and early stopping criteria; a dependent consolidation requires assessment of recruitability and consideration of causes that will not respond to positive pressure.<\/p><p>Decision: choose the most appropriate initial support—HFNC, CPAP/EPAP, or NIV-PS—and define from the outset which parameter may need adjustment and when reassessment will occur.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_55.png\" alt=\"English teaching figure 55\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_55.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 13.2. Initial assessment for NIV indication. Respiratory support is selected by integrating the lung, respiratory muscles, heart, and overall patient condition.<\/p><h4>Step 2. At 5–10 minutes: NIV adaptation and optimization<\/h4><p>During the first few minutes, the pathophysiological success of treatment is not yet the main issue. The focus is the quality of interaction among the patient, interface, circuit, and ventilator. A trial may appear ineffective simply because the mask leaks, the helmet is inadequately pressurized, the trigger is unstable, cycling is delayed, or the patient does not tolerate the device.<\/p><p>Assess: comfort, claustrophobia, pain, leaks, noise, achievement of set pressures, ineffective triggering or auto-triggering, premature or delayed cycling, rise time, estimated tidal volume, respiratory rate, and obvious accessory muscle use.<\/p><p>Interpret: if the patient remains agitated or tachypneic, determine whether support is actually being delivered before increasing pressure support or EPAP. Asynchronies and leaks may maintain high work of breathing despite apparently adequate pressure levels.<\/p><p>Decision: optimize the interface, seal, trigger, cycling, rise time, and comfort. Only after technical problems have been corrected does it make sense to attribute lack of response to the phenotype or chosen settings.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_56.png\" alt=\"English teaching figure 56\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_56.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 13.3. Adaptation during the first few minutes. Before declaring failure, correct the interface, leaks, trigger, cycling, rise time, and comfort.<\/p><h4>Step 3. At 30–60 minutes: pathophysiological response<\/h4><p>At 30–60 minutes, the trial should show a clear direction. Improvement in SpO2 alone is not enough: it may simply reflect increased FiO2 and mask persistently high work of breathing. A favorable response is present when clinical status, ventilator data, ABG, and ultrasound all move in the same direction.<\/p><p>Assess: respiratory rate, comfort, required FiO2, SpO2/FiO2, pH and PaCO2 when relevant, serial LUS in the most affected regions, TFdi, intercostal and abdominal muscle activity, residual leaks, estimated tidal volumes, and hemodynamic tolerance.<\/p><p>Interpret: a true response combines reduced work of breathing, improved or stable LUS, decreasing FiO2 requirements, better comfort, and a consistent ABG trend. An apparent response is present when oxygen saturation improves but FiO2 remains high, respiratory drive and muscle activity remain elevated, LUS fails to improve or worsens, and pH or PaCO2 do not change in the expected direction.<\/p><p>Decision: if the response is favorable, continue with a defined reassessment plan; if uncertain, change one element at a time and reassess promptly; if unfavorable, do not turn the trial into passive waiting.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_57.png\" alt=\"English teaching figure 57\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_57.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 13.4. Pathophysiological response at 30–60 minutes. A true response requires consistency among clinical findings, ABG, LUS, respiratory muscle activity, and ventilator data.<\/p><h4>Step 4. At two hours: continue NIV or end the trial<\/h4><p>At two hours, the non-invasive trial should have a clearly interpretable trajectory. This does not mean that every patient must be completely stabilized within two hours, but it does mean that the decision should be explicit. Continuing NIV is reasonable if the initial target has been at least partially achieved. Persisting becomes dangerous when support maintains acceptable oxygen saturation but does not reduce respiratory drive, improve ABG, or modify the ultrasound pattern.<\/p><p>Assess: clinical trend, ABG, FiO2, LUS, respiratory muscle activity, mental status, secretions, airway protection, hemodynamics, interface tolerance, and the trend in ventilator parameters.<\/p><p>Interpret: the trial can continue if the patient is breathing less rapidly, working less, requires less FiO2, has stable or improving ultrasound findings, and shows a consistent ABG trend. It should be stopped or converted to another strategy if pH, PaCO2, mental status, hemodynamics, LUS, respiratory drive, or tolerance deteriorate.<\/p><p>Decision: continue NIV, begin de-escalation, transition to HFNC/oxygen when appropriate, or stop the trial and consider escalation. The decision should be based on the trend, not on a single number.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_58.png\" alt=\"English teaching figure 58\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_58.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 13.5. The two-hour decision. The trial may continue, be adjusted or de-escalated, or be stopped if the trend is unfavorable.<\/p><h4>Conclusion<\/h4><p>Ultrasound-guided NIV is not a closed algorithm. It is a way to make therapeutic targets visible and to prevent a non-invasive trial from becoming indefinite. The probe does not make decisions for the clinician, but it helps distinguish true improvement from temporary compensation. Ventilator settings should not be adjusted by chasing isolated numbers: every adjustable parameter only makes sense when linked to a target, a time window, and reassessment. The guiding principle remains the same throughout the manual: select support according to phenotype, optimize it during the first minutes, verify the pathophysiological response within the first hour, and decide within a defined timeframe whether to continue or stop.<\/p><h4>Pitfall to avoid<\/h4><p>The final error to avoid is treating NIV as a generic trial to be prolonged as long as SpO2 remains acceptable. NIV should have an indication, a target, early technical correction, a documentable pathophysiological response, and a decision within predefined time windows.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Key messages\nThe initial assessment defines indication, phenotype, and the target of support.\nAt 5–10 minutes, correct technique, interface, leaks, and synchrony.\nAt 30–60 minutes, look for a true pathophysiological response, not just better SpO2.\nAt two hours, decide whether to continue, adjust, de-escalate, or stop the trial.\nThe integrated trend matters more than any single measurement.<\/p><\/th><\/tr><\/table><\/div><h4>References for Chapter 13<\/h4><p>1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p><p>2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>3. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p><p>4. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5.<\/p><p>5. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>", "plain": " Practical objective  Ultrasound applied to non-invasive ventilation should not create a pathway separate from clinical care. Its role is to organize clinical reasoning over time. The final aim of this manual is not to complete a checklist, but to know when to start a trial, how to correct it during the first minutes, how to recognize a true pathophysiological response, and when to stop without waiting any longer.  The entire pathway can be understood through four decision time points. Each has a dominant question. Before NIV, the question is whether there is an indication and which target should be treated. At 5–10 minutes, the question is whether support is actually reaching the patient. At 30–60 minutes, the question is whether the system is modifying the underlying pathophysiological mechanism by integrating lung ultrasound, respiratory muscle assessment, and ABG. At two hours, the question is no longer how to adjust one more parameter, but whether the trial should continue or end [1-5].      Download image     Figure 13.1. Timeline of ultrasound-guided NIV. The final pathway summarizes four decision windows: indication, technical adaptation, pathophysiological response, and the two-hour decision.  Step 1. Before setting NIV: indication  Initial assessment should replace the generic question “Should I start NIV?” with a more useful one: what problem do I want to correct with non-invasive support? At this stage, integrate the clinical picture, ABG, work of breathing, LUS, diaphragm and accessory muscle activity, and hemodynamic tolerance of positive pressure.  Assess: predominant LUS pattern, distribution of aeration loss, presence of consolidations or pleural effusion, signs of congestion, an A-pattern associated with hypercapnia, diaphragmatic and respiratory muscle activity, hemodynamic status, and the patient’s ability to cooperate and protect the airway.  Interpret: an A-pattern with hypercapnia points toward a respiratory pump problem and pressure-support NIV; an orderly congestive pattern supports CPAP/EPAP; a heterogeneous lung with high respiratory drive requires caution and early stopping criteria; a dependent consolidation requires assessment of recruitability and consideration of causes that will not respond to positive pressure.  Decision: choose the most appropriate initial support—HFNC, CPAP/EPAP, or NIV-PS—and define from the outset which parameter may need adjustment and when reassessment will occur.      Download image     Figure 13.2. Initial assessment for NIV indication. Respiratory support is selected by integrating the lung, respiratory muscles, heart, and overall patient condition.  Step 2. At 5–10 minutes: NIV adaptation and optimization  During the first few minutes, the pathophysiological success of treatment is not yet the main issue. The focus is the quality of interaction among the patient, interface, circuit, and ventilator. A trial may appear ineffective simply because the mask leaks, the helmet is inadequately pressurized, the trigger is unstable, cycling is delayed, or the patient does not tolerate the device.  Assess: comfort, claustrophobia, pain, leaks, noise, achievement of set pressures, ineffective triggering or auto-triggering, premature or delayed cycling, rise time, estimated tidal volume, respiratory rate, and obvious accessory muscle use.  Interpret: if the patient remains agitated or tachypneic, determine whether support is actually being delivered before increasing pressure support or EPAP. Asynchronies and leaks may maintain high work of breathing despite apparently adequate pressure levels.  Decision: optimize the interface, seal, trigger, cycling, rise time, and comfort. Only after technical problems have been corrected does it make sense to attribute lack of response to the phenotype or chosen settings.      Download image     Figure 13.3. Adaptation during the first few minutes. Before declaring failure, correct the interface, leaks, trigger, cycling, rise time, and comfort.  Step 3. At 30–60 minutes: pathophysiological response  At 30–60 minutes, the trial should show a clear direction. Improvement in SpO2 alone is not enough: it may simply reflect increased FiO2 and mask persistently high work of breathing. A favorable response is present when clinical status, ventilator data, ABG, and ultrasound all move in the same direction.  Assess: respiratory rate, comfort, required FiO2, SpO2/FiO2, pH and PaCO2 when relevant, serial LUS in the most affected regions, TFdi, intercostal and abdominal muscle activity, residual leaks, estimated tidal volumes, and hemodynamic tolerance.  Interpret: a true response combines reduced work of breathing, improved or stable LUS, decreasing FiO2 requirements, better comfort, and a consistent ABG trend. An apparent response is present when oxygen saturation improves but FiO2 remains high, respiratory drive and muscle activity remain elevated, LUS fails to improve or worsens, and pH or PaCO2 do not change in the expected direction.  Decision: if the response is favorable, continue with a defined reassessment plan; if uncertain, change one element at a time and reassess promptly; if unfavorable, do not turn the trial into passive waiting.      Download image     Figure 13.4. Pathophysiological response at 30–60 minutes. A true response requires consistency among clinical findings, ABG, LUS, respiratory muscle activity, and ventilator data.  Step 4. At two hours: continue NIV or end the trial  At two hours, the non-invasive trial should have a clearly interpretable trajectory. This does not mean that every patient must be completely stabilized within two hours, but it does mean that the decision should be explicit. Continuing NIV is reasonable if the initial target has been at least partially achieved. Persisting becomes dangerous when support maintains acceptable oxygen saturation but does not reduce respiratory drive, improve ABG, or modify the ultrasound pattern.  Assess: clinical trend, ABG, FiO2, LUS, respiratory muscle activity, mental status, secretions, airway protection, hemodynamics, interface tolerance, and the trend in ventilator parameters.  Interpret: the trial can continue if the patient is breathing less rapidly, working less, requires less FiO2, has stable or improving ultrasound findings, and shows a consistent ABG trend. It should be stopped or converted to another strategy if pH, PaCO2, mental status, hemodynamics, LUS, respiratory drive, or tolerance deteriorate.  Decision: continue NIV, begin de-escalation, transition to HFNC/oxygen when appropriate, or stop the trial and consider escalation. The decision should be based on the trend, not on a single number.      Download image     Figure 13.5. The two-hour decision. The trial may continue, be adjusted or de-escalated, or be stopped if the trend is unfavorable.  Conclusion  Ultrasound-guided NIV is not a closed algorithm. It is a way to make therapeutic targets visible and to prevent a non-invasive trial from becoming indefinite. The probe does not make decisions for the clinician, but it helps distinguish true improvement from temporary compensation. Ventilator settings should not be adjusted by chasing isolated numbers: every adjustable parameter only makes sense when linked to a target, a time window, and reassessment. The guiding principle remains the same throughout the manual: select support according to phenotype, optimize it during the first minutes, verify the pathophysiological response within the first hour, and decide within a defined timeframe whether to continue or stop.  Pitfall to avoid  The final error to avoid is treating NIV as a generic trial to be prolonged as long as SpO2 remains acceptable. NIV should have an indication, a target, early technical correction, a documentable pathophysiological response, and a decision within predefined time windows.      Key messages\nThe initial assessment defines indication, phenotype, and the target of support.\nAt 5–10 minutes, correct technique, interface, leaks, and synchrony.\nAt 30–60 minutes, look for a true pathophysiological response, not just better SpO2.\nAt two hours, decide whether to continue, adjust, de-escalate, or stop the trial.\nThe integrated trend matters more than any single measurement.      References for Chapter 13  1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.  2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.  3. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.  4. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5.  5. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. "}], "phenotypes": [{"id": "pump", "title": "Respiratory muscles / hypercapnia", "question": "Is the lung relatively aerated while the patient is working hard?", "lus": "Predominant A-pattern, few or no vertical artifacts; loss of aeration is not the dominant problem.", "pump": "High TFdi, intercostal TR and respiratory rate; abdominal recruitment may reflect active expiration or auto-PEEP.", "ventilator": "Check effective PS, trigger, c
