tent diaphragm and intercostal muscle activity, but the cause may be poor patient–ventilator interaction.  Ineffective triggering  The patient inspires, but the ventilator either does not deliver pressure support or delivers it late. Clinically, this appears as inspiratory efforts, discomfort, tachypnea, and increased accessory muscle recruitment. In COPD, auto-PEEP may also contribute. Correction requires optimization of trigger sensitivity, leaks, EPAP/PEEP, and interface.  Delayed cycling  The ventilator continues insufflation when the patient wants to exhale. This is common with leaks and high pressure support. It may worsen discomfort, abdominal muscle recruitment, forced expiration, and asynchrony.  Premature cycling  The ventilator ends inspiration too early. The patient remains air hungry, may immediately trigger another breath, and may maintain high respiratory drive and respiratory rate.  Rise time  A rise time that is too slow may cause air hunger; conversely, an excessively fast rise time may increase discomfort, leaks, and abrupt pressurization.      Download image     Figure 9.4. Before changing parameters: check technique and synchrony. Leaks, ineffective triggering, incorrect cycling, and inappropriate rise time can mimic inadequate assistance or treatment failure. Correct technical problems before increasing PS or EPAP/PEEP.  Interface: part of the ventilator setting, not a logistical detail  Interface selection affects efficacy, leaks, comfort, asynchronies, and tolerance. A mask that is too tight may be intolerable; a mask that is too loose destabilizes triggering. A helmet may be useful in selected settings but requires attention to flow, pressurization, noise, response delay, and comfort. In practice, the interface should be considered a true adjustable therapeutic variable. If the patient cannot tolerate the interface, even the best ultrasound-based algorithm will fail.  Pitfall to avoid  The most common error is to progressively increase everything: more FiO2, more pressure support, more EPAP/PEEP, and tighter mask straps. This produces apparently more intensive NIV, but not necessarily more effective NIV.  Ultrasound-guided setting is not about increasing numbers; it is about choosing the right adjustable parameter for the right target.     References for Chapter 9  1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.  3. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.  4. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.  5. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.  6. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC.  7. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.  8. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3. "}, {"part": "Part III — Selecting and Setting Respiratory Support", "title": "Chapter 10. Monitoring, Failure, and De-escalation", "tag": "Ch. 10", "html": "<h4>Practical objective<\/h4><p>Ultrasound-guided NIV does not end with the initial ventilator setup. The decisive step is monitoring the response, because stabilization of SpO2 may coexist with persistent high respiratory drive, worsening ultrasound findings, or failure to correct acidosis [1-4].<\/p><p>true success, when support corrects the underlying pathophysiological mechanism;<\/p><p>apparent response, when SpO2 improves but respiratory drive, muscle recruitment, LUS score, or ABG does not;<\/p><p>failure, when the non-invasive trial is delaying a more appropriate strategy.<\/p><p>Monitoring should not become an accumulation of measurements. It should be a structured sequence of assessments that answers practical questions: is the patient breathing better? Is lung aeration improving? Has respiratory pump load decreased? Is the ABG improving? Does the heart tolerate positive pressure? Can support be reduced, or does the strategy need to change?<\/p><h4>The principle: trend, not snapshot<\/h4><p>A single ultrasound assessment has limited value. The strength of an ultrasound-guided approach lies in serial comparison: the same patient, the same objective, the same region of interest, after a therapeutic change [5,6].<\/p><p>Baseline LUS describes the phenotype. Follow-up LUS shows whether support has changed the lung. Baseline TFdi describes diaphragmatic load. Follow-up TFdi indicates whether support has reduced respiratory muscle load. Intercostal and abdominal muscles show whether the patient is still compensating. ABG confirms whether improvement is pathophysiological rather than merely cosmetic [7].<\/p><p>The correct question is not “what does the ultrasound look like?” but “has it changed in the right direction after our intervention?”<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_41.png\" alt=\"English teaching figure 41\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_41.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 10.1. Serial monitoring of ultrasound-guided NIV. Response to support should be reassessed over time by integrating the patient, ventilator, ultrasound, ABG, and the resulting clinical decision.<\/p><h4>T0: define the baseline<\/h4><p>Before starting or modifying NIV, establish a baseline. Not every parameter needs to be measured in every patient, but the dominant problem—the prevailing phenotype—must be identified.<\/p><p>In a hypercapnic patient, pH, PaCO2, respiratory rate, TFdi/TR, and synchrony are central. In a congested patient, LUS, FiO2, work of breathing, and hemodynamic stability are central. In non-cardiogenic hypoxemia, assess LUS, respiratory drive, FiO2, estimated tidal volume when available, and risk of failure. In obstructive patients, abdominal muscle activity, suspected auto-PEEP, cycling, rise time, and expiratory time also matter.<\/p><p>T0 should be documented or at least clearly defined mentally. Without a baseline, there is no trend.<\/p><h4>5–10 minutes: technique, comfort, and synchrony<\/h4><p>The first few minutes are mainly used to determine whether support is actually being delivered effectively. At this stage, lack of response should not immediately be interpreted as pathophysiological failure. The problem is often technical: leaks, interface intolerance, ineffective triggering, delayed cycling, or inadequate pressurization [8].<\/p><p>Signs to check immediately:<\/p><p>noise and magnitude of leaks;<\/p><p>mask or helmet discomfort;<\/p><p>air hunger;<\/p><p>ineffective efforts;<\/p><p>inspiration that is too long or too short;<\/p><p>increased abdominal muscle activation or discomfort;<\/p><p>implausible estimated tidal volume.<\/p><p>Technical correction comes before physiological titration. If the technique is wrong, ultrasound will measure the fatigue generated by ineffective support.<\/p><h4>30–60 minutes: look for a pathophysiological response<\/h4><p>At 30–60 minutes, determine whether the patient is moving in the right direction. SpO2 may improve rapidly, but that is not enough. True improvement requires consistency across domains.<\/p><p>In patients receiving HFNC, the ROX index may be reported as an additional trend measure, but it should not replace respiratory rate, work of breathing, LUS, and ABG when indicated.<\/p><p>Favorable signs:<\/p><p>decreasing respiratory rate;<\/p><p>less accessory muscle use;<\/p><p>TFdi/TR decreasing toward a more appropriate range;<\/p><p>less abdominal muscle activity if the initial problem was obstruction/hyperinflation;<\/p><p>ability to reduce FiO2;<\/p><p>stable or improving LUS score;<\/p><p>improving pH and PaCO2 when hypercapnia was the problem;<\/p><p>better comfort.<\/p><p>Signs of an apparent response only:<\/p><p>better SpO2 but persistently high FiO2;<\/p><p>persistently high respiratory rate;<\/p><p>TFdi/TR still elevated;<\/p><p>unchanged or worsening LUS score;<\/p><p>unstable comfort;<\/p><p>no improvement in ABG.<\/p><p>This distinction is summarized in Figure 10.2, while Figure 10.4 adds LUS examples showing how the ultrasound pattern may improve, remain unchanged, or worsen during serial monitoring.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_42.png\" alt=\"English teaching figure 42\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_42.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 10.2. True success, apparent response, failure. The response to NIV should be classified by integrating SpO2, FiO2, respiratory rate, LUS, respiratory muscle activity, and ABG.<\/p><p>It is not enough to “try NIV.” The expected response must be defined: lower respiratory rate, better comfort, reduced respiratory muscle work, improved pH and PaCO2 in hypercapnia, lower FiO2 requirement, and improvement or stability of LUS.<\/p><p>Favorable response: the trial can continue if the patient is calmer, respiratory rate decreases, leaks are limited, mental status is stable, arterial pressure is adequate, ABG improves when initially abnormal, and ultrasound findings are stable or improving.<\/p><p>Uncertain response: support should be corrected and reassessed if SpO2 improves but respiratory rate remains high, FiO2 remains elevated, the patient poorly tolerates the device, large leaks or asynchronies persist, LUS does not improve, or the diaphragm remains highly active.<\/p><p>Unfavorable response: do not persist if pH or PaCO2 worsens during the trial, hemodynamic instability develops, mental status deteriorates, secretions cannot be managed, airway protection is inadequate, LUS worsens, the diaphragm appears exhausted, or the interface is not tolerated.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_43.png\" alt=\"English teaching figure 43\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_43.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 10.3. Safety of the non-invasive trial: a clinical traffic-light approach. The trial should be rapidly classified as favorable, uncertain, or unfavorable. An uncertain response requires correction and prompt reassessment; an unfavorable response requires escalation or a change in strategy.<\/p><p>Illustrative LUS images during monitoring<\/p><p>During NIV monitoring, LUS should not be reported only as a number. The clinician should determine whether the ultrasound pattern is moving toward reaeration, remaining unchanged, or worsening. When possible, at least one or two images from the same scanned regions should be documented: one at T0 and one after the support has been modified.<\/p><p>True improvement may be suggested by fewer coalescent B-lines, transition toward a less dense pattern, or reaeration of previously affected regions. An apparent response occurs when SpO2 improves but the LUS pattern remains essentially unchanged and the patient maintains high respiratory drive or high FiO2 requirements. Failure becomes more likely when new deaerated areas or consolidations appear, or when dependent regions worsen.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_44.png\" alt=\"English teaching figure 44\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_44.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 10.4. Ultrasound examples for serial LUS monitoring. The figure combines illustrative ultrasound images to distinguish true response, apparent response, and probable failure. The images are adapted from material supplied by the author for teaching purposes and do not represent a serial study of the same patient.<\/p><h4>Two hours: make a decision, do not wait indefinitely<\/h4><p>By approximately two hours, it should be clear whether the trial is working, needs correction, or should be stopped. This does not mean that every patient who is not perfect after two hours must be intubated. It means that the trial must have a clear direction.<\/p><p>If the patient improves, continue. If the response is uncertain, correct an adjustable parameter and reassess promptly. If the patient worsens, do not prolong support merely because SpO2 is temporarily acceptable.<\/p><p>In de novo hypoxemic respiratory failure, a heterogeneous lung, extensive pneumonia, or high respiratory drive, the threshold for stopping should be lower. The danger is not only NIV failure, but failure that is recognized too late.<\/p><p>Warning signs<\/p><p>Failure is rarely defined by a single number. It usually emerges from convergence of signals across several domains.<\/p><p>The patient remains tachypneic. pH does not improve or worsens. PaCO2 rises. FiO2 remains high. LUS shows increasing loss of aeration. The diaphragm and intercostal muscles remain hyperactive. The abdominal muscles indicate forced expiration. The ventilator shows large leaks or persistent asynchronies. The right ventricle does not tolerate increasing airway pressures.<\/p><p>In these situations, monitoring removes ambiguity: the patient is not moving in the right direction.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_45.png\" alt=\"English teaching figure 45\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_45.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 10.5. Warning signs during NIV. Clinical, ABG, ultrasound, respiratory muscle, ventilator, and hemodynamic signals should be interpreted together. When several domains deteriorate, the non-invasive trial should not be prolonged.<\/p><p>HACOR and risk scores: useful, but not sufficient by themselves<\/p><p>Clinical scores can help objectify risk. HACOR integrates heart rate, acidosis, consciousness, oxygenation, and respiratory rate. It is useful because it forces attention to simple bedside parameters.<\/p><p>In this practical manual, however, the score should not replace ultrasound-based reasoning. An unfavorable HACOR together with worsening LUS and high TFdi/TR strengthens the indication to change strategy. An intermediate HACOR in a patient improving both clinically and on ultrasound can be interpreted more cautiously.<\/p><p>The score helps clinicians avoid denying failure. Ultrasound helps explain why failure is occurring.<\/p><h4>De-escalation: reducing support without losing the benefit<\/h4><p>When the patient improves, the opposite error should be avoided: maintaining excessively intense NIV for too long. The goal is not to keep the patient attached to the ventilator, but to progressively reduce support without allowing the original problem to recur.<\/p><p>De-escalation should be guided by stability:<\/p><p>controlled respiratory rate;<\/p><p>reduced FiO2;<\/p><p>good comfort;<\/p><p>stable pH and PaCO2 in hypercapnic patients;<\/p><p>LUS not worsening;<\/p><p>TFdi/TR not rising again;<\/p><p>no excessive abdominal muscle activity;<\/p><p>stable hemodynamics.<\/p><p>The sequence of reduction should reflect the initial problem. If the problem was respiratory pump load, reduce pressure support first. If the problem was congestion or atelectasis, reduce EPAP/PEEP more cautiously. If the problem was hypoxemia, reduce FiO2 without losing sight of LUS and work of breathing.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_46.png\" alt=\"English teaching figure 46\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_46.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 10.6. De-escalation: when to reduce NIV or transition to HFNC/oxygen. Support should be reduced progressively: confirm stability, decrease intensity, introduce controlled breaks, and stop NIV only if the trend remains favorable.<\/p><h4>Decision-oriented monitoring report<\/h4><p>A useful report after starting or modifying NIV does not need to be long. It should state whether the patient is improving and what decision follows from that assessment.<\/p><p>Practical example:<\/p><p>“After 45 minutes of NIV in PS, the patient is more comfortable, respiratory rate has decreased from 32 to 24/min, and FiO2 has been reduced from 0.60 to 0.45. Anterolateral LUS is unchanged, with no new consolidations. TFdi has decreased from baseline and intercostal muscles are less active. ABG is improving. Findings are consistent with a favorable response; continue support and reassess within 2 hours.”<\/p><p>Or:<\/p><p>“SpO2 has improved with FiO2 0.80, but respiratory rate remains 34/min, TFdi/TR remain high, posterolateral LUS has worsened with increasing areas of aeration loss, and ABG has not improved. Findings are consistent with an apparent response/probable failure; do not prolong the trial without multidisciplinary reassessment and possible escalation.”<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to confuse acceptable oxygen saturation with a favorable response. SpO2 may improve while the patient continues to generate high respiratory drive, high work of breathing, and progressive loss of aeration.<\/p><p>Monitoring is intended to determine whether the patient is truly improving, not whether the monitor looks less alarming.<\/p><h4>References for Chapter 10<\/h4><p>1. Duan J, Han X, Bai L, Zhou L, Huang S. Assessment of heart rate, acidosis, consciousness, oxygenation, and respiratory rate to predict noninvasive ventilation failure in hypoxemic patients. Intensive Care Med. 2017;43(2):192-199. doi:10.1007/s00134-016-4601-3.<\/p><p>2. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p><p>3. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p><p>4. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p><p>5. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>6. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound fo rameters.  In this practical manual, however, the score should not replace ultrasound-based reasoning. An unfavorable HACOR together with worsening LUS and high TFdi/TR strengthens the indication to change strategy. An intermediate HACOR in a patient improving both clinically and on ultrasound can be interpreted more cautiously.  The score helps clinicians avoid denying failure. Ultrasound helps explain why failure is occurring.  De-escalation: reducing support without losing the benefit  When the patient improves, the opposite error should be avoided: maintaining excessively intense NIV for too long. The goal is not to keep the patient attached to the ventilator, but to progressively reduce support without allowing the original problem to recur.  De-escalation should be guided by stability:  controlled respiratory rate;  reduced FiO2;  good comfort;  stable pH and PaCO2 in hypercapnic patients;  LUS not worsening;  TFdi/TR not rising again;  no excessive abdominal muscle activity;  stable hemodynamics.  The sequence of reduction should reflect the initial problem. If the problem was respiratory pump load, reduce pressure support first. If the problem was congestion or atelectasis, reduce EPAP/PEEP more cautiously. If the problem was hypoxemia, reduce FiO2 without losing sight of LUS and work of breathing.      Download image     Figure 10.6. De-escalation: when to reduce NIV or transition to HFNC/oxygen. Support should be reduced progressively: confirm stability, decrease intensity, introduce controlled breaks, and stop NIV only if the trend remains favorable.  Decision-oriented monitoring report  A useful report after starting or modifying NIV does not need to be long. It should state whether the patient is improving and what decision follows from that assessment.  Practical example:  “After 45 minutes of NIV in PS, the patient is more comfortable, respiratory rate has decreased from 32 to 24/min, and FiO2 has been reduced from 0.60 to 0.45. Anterolateral LUS is unchanged, with no new consolidations. TFdi has decreased from baseline and intercostal muscles are less active. ABG is improving. Findings are consistent with a favorable response; continue support and reassess within 2 hours.”  Or:  “SpO2 has improved with FiO2 0.80, but respiratory rate remains 34/min, TFdi/TR remain high, posterolateral LUS has worsened with increasing areas of aeration loss, and ABG has not improved. Findings are consistent with an apparent response/probable failure; do not prolong the trial without multidisciplinary reassessment and possible escalation.”  Pitfall to avoid  The most common error is to confuse acceptable oxygen saturation with a favorable response. SpO2 may improve while the patient continues to generate high respiratory drive, high work of breathing, and progressive loss of aeration.  Monitoring is intended to determine whether the patient is truly improving, not whether the monitor looks less alarming.  References for Chapter 10  1. Duan J, Han X, Bai L, Zhou L, Huang S. Assessment of heart rate, acidosis, consciousness, oxygenation, and respiratory rate to predict noninvasive ventilation failure in hypoxemic patients. Intensive Care Med. 2017;43(2):192-199. doi:10.1007/s00134-016-4601-3.  2. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.  3. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  4. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.  5. Bouhemad B, Mongodi <img loading=\"lazy\" src=\"english_images/figure_47.png\" alt=\"English teaching figure 47\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_47.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 11.1. Ultrasound-guided NIV clinical pathways: from LUS to decision-making. The figure integrates representative ultrasound images in the four main practical scenarios: COPD/hypercapnia, cardiogenic pulmonary edema, pneumonia/de novo hypoxemia, and postoperative atelectasis.<\/p><h4>Scenario 1. Acute COPD exacerbation and hypercapnic respiratory failure<\/h4><p>In acute COPD exacerbation, NIV has a strong rationale when respiratory acidosis, hypercapnia, increased work of breathing, and signs of fatigue are present. In this scenario, LUS often does not show diffuse loss of aeration. The predominant finding may be an A-pattern with preserved sliding and no clear recruitment target [1,2].<\/p><p>This does not mean that LUS is useless. Rather, it helps avoid choosing the wrong target. If the lung is predominantly aerated, the priority is not to increase EPAP/PEEP to “open” the lung. The priority is to unload the respiratory muscles, improve alveolar ventilation, correct acidosis and hypercapnia, reduce inspiratory work, and optimize synchrony.<\/p><p>The most useful findings are:<\/p><p>a predominant A-pattern or absence of major loss of aeration;<\/p><p>high TFdi when the diaphragm is overloaded;<\/p><p>increased intercostal TR when the patient compensates with accessory inspiratory muscles;<\/p><p>active abdominal muscles when forced expiration, obstruction, or hyperinflation is present;<\/p><p>difficult triggering, prolonged expiration, or inappropriate cycling.<\/p><p>Initial support is usually NIV-PS. Pressure support is titrated according to work of breathing, comfort, respiratory rate, and ABG. EPAP should be set carefully: it may help counterbalance auto-PEEP and improve triggering, but excessive EPAP may worsen hyperinflation and discomfort.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_48.png\" alt=\"English teaching figure 48\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_48.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 11.2. COPD/hypercapnia: from an A-pattern to pressure-support NIV. In a hypercapnic patient with a predominantly aerated lung, LUS shifts the focus toward respiratory muscles, auto-PEEP, trigger, cycling, pressure support, and accessory muscle activity.<\/p><p>At 30–60 minutes, determine whether ventilation is truly improving. Expected signs include a lower respiratory rate, better comfort, reduced TFdi/TR, less abdominal muscle activation when present, and improvement in pH and PaCO2. If pH does not improve, PaCO2 rises, leaks are large, or ineffective efforts persist, simply increasing FiO2 is not an adequate response.<\/p><h4>Practical case: acute COPD exacerbation with respiratory acidosis<\/h4><p>Initial example: a patient with acute COPD exacerbation, severe dyspnea, respiratory rate 32/min, accessory muscle use, and SpO2 89–90% on a 35% Venturi mask. ABG: pH 7.28, PaCO2 72 mmHg, HCO3− 33 mEq/L, PaO2 58 mmHg, normal lactate. LUS: predominant A-pattern, no extensive consolidations, hyperactive diaphragm and intercostal muscles, and active abdominal muscles during expiration.<\/p><p>Reasonable initial setup: a well-tolerated oronasal mask; EPAP 4–5 cmH2O; IPAP 14–16 cmH2O, giving pressure support of approximately 9–11 cmH2O; FiO2 adjusted to an SpO2 target of 88–92%; a sufficiently sensitive trigger without auto-triggering; a medium-to-fast rise time if the patient has air hunger; relatively earlier cycling if expiration is prolonged or signs of hyperinflation appear; and a backup rate of 12–14/min as a safety measure, not as treatment for tachypnea.<\/p><p>Assessment at 5–10 minutes: check leaks, comfort, synchrony, achievement of EPAP/IPAP, plausible tidal volume, absence of delayed cycling, and reduction in air hunger. If the patient remains agitated, correct the interface, trigger, cycling, and rise time first; increase pressure support only afterward if needed.<\/p><p>Expected response at 30 minutes: respiratory rate decreases, for example from 32 to 24–26/min; accessory muscle activation is reduced; comfort improves; SpO2 remains within target without increasing FiO2; pH shows early improvement, for example to 7.31–7.33; and PaCO2 is stable or decreasing without requiring immediate normalization. TFdi may decrease toward a less extreme workload range.<\/p><p>Signs of failure or insufficient correction include unchanged or worsening pH, rising PaCO2, respiratory rate persistently &gt;30/min, worsening mental status, unmanageable secretions, non-correctable leaks, persistently marked abdominal muscle activity, unresolved delayed cycling, hemodynamic instability, or interface intolerance. In these situations, the trial should not be prolonged simply because SpO2 is acceptable.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to treat COPD as though it were primarily a recruitment problem. In an obstructive patient, increasing EPAP without a clear target may worsen hyperinflation, comfort, and tolerance.<\/p><h4>Scenario 2. Cardiogenic pulmonary edema<\/h4><p>In cardiogenic pulmonary edema, LUS often shows diffuse, relatively orderly bilateral vertical artifacts with a distribution consistent with congestion. The clinical picture should also be coherent: acute dyspnea, hypertension or volume overload, cardiac findings, and response to decongestive therapy.<\/p><p>In this scenario, CPAP/EPAP has a clear pathophysiological target. Positive pressure can reduce work of breathing, improve oxygenation, reduce venous return in the setting of congestion, and help reduce left-ventricular afterload. NIV-PS may be useful when hypercapnia, respiratory fatigue, or insufficient alveolar ventilation coexist [6].<\/p><p>Findings to look for include:<\/p><p>diffuse and relatively orderly B-lines;<\/p><p>bilateral distribution consistent with congestion;<\/p><p>absence of marked pleural heterogeneity or dominant consolidations;<\/p><p>a consistent left-heart picture, when assessed;<\/p><p>reduced work of breathing after CPAP/EPAP.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_49.png\" alt=\"English teaching figure 49\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_49.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 11.3. Cardiogenic pulmonary edema: orderly B-lines and CPAP/EPAP. Diffuse, orderly B-lines, when consistent with the clinical picture, represent a rational target for CPAP/EPAP and causal therapy.<\/p><p>The expected response is rapid: reduced dyspnea, lower respiratory rate, ability to reduce FiO2, better comfort, tolerated arterial pressure, and stable or improving LUS. If LUS does not change, FiO2 remains high, the pattern is heterogeneous, or hemodynamic instability develops, the phenotype should be reassessed.<\/p><h4>Pitfall to avoid<\/h4><p>Not all B-lines indicate cardiogenic pulmonary edema. Disorganized B-lines, an irregular pleura, subpleural consolidations, and a patchy distribution should suggest pneumonia, an ARDS-like process, fibrosis, or primary lung injury.<\/p><h4>Scenario 3. Pneumonia and de novo hypoxemic respiratory failure<\/h4><p>This is the scenario in which LUS is most useful for avoiding false reassurance. SpO2 may improve with high FiO2 and positive pressure while the patient continues to have high respiratory drive, high work of breathing, and progressive regional loss of aeration [3,5,7-9].<\/p><p>LUS may show:<\/p><p>an irregular pleura;<\/p><p>a disorganized pattern;<\/p><p>spared areas alternating with abnormal regions;<\/p><p>subpleural or more extensive consolidations;<\/p><p>air bronchograms;<\/p><p>a focal or asymmetric distribution.<\/p><p>Initial support may be HFNC or, in a highly selected, cooperative, closely monitorable patient without immediate intubation criteria, a trial of NIV-PS. NIV must not become a means of delaying escalation.<\/p><h4>HFNC in de novo hypoxemic respiratory failure<\/h4><p>If HFNC is chosen, the trial should follow the same time discipline as NIV: use an adequate, tolerated flow; set FiO2 to the oxygen saturation target; and reassess respiratory rate, respiratory muscle work, LUS, and ROX index early. Acceptable SpO2 with high FiO2, a ROX index that is not improving, and persistently hyperactive diaphragm/intercostal muscles should not be interpreted as stabilization.<\/p><p>Early reassessment is mandatory. If respiratory rate remains high, FiO2 remains elevated, TFdi/TR stay high, LUS is unchanged or worsening, ABG is unfavorable, or comfort is poor, the trial is at risk of failure.<\/p><h4>Scenario 4. Postoperative state, obesity, and dependent atelectasis<\/h4><p>In postoperative, obese, bedridden, or painful patients, the main problem may be dependent loss of aeration. LUS may show posterior or basal consolidations, reduced regional aeration, air bronchograms, associated pleural effusion, or signs of compression.<\/p><p>In this setting, positive pressure may be useful but should be combined with other interventions. CPAP/EPAP may promote reaeration if the region is recruitable. Positioning, analgesia, mobilization, respiratory physiotherapy, secretion management, and an effective cough are often equally important.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_50.png\" alt=\"English teaching figure 50\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_50.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 11.4. Heterogeneous lung: pneumonia, de novo hypoxemia, and atelectasis. In heterogeneous patterns, LUS helps distinguish recruitable loss of aeration, non-recruitable consolidation, and progressive deterioration during a non-invasive trial.<\/p><p>Monitoring should focus on dependent and posterior regions. If support is effective, one should expect a lower FiO2 requirement, better comfort, possible partial reaeration, and reduced work of breathing. If consolidation remains unchanged or worsens, consider secretions, bronchial obstruction, a static air bronchogram, pleural effusion, or non-recruitable disease.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to assume that every consolidation is recruitable. LUS should help determine whether increasing EPAP/PEEP is rational or whether a different causal treatment is required.<\/p><p>Another common error is to turn LUS into an isolated diagnosis. LUS alone does not determine which ventilatory support to use; it identifies a plausible target. The decision arises from integration of the ultrasound pattern, work of breathing, ABG, comfort, and hemodynamic tolerance.<\/p><p>LUS does not choose the mode; it makes visible the problem that the mode is intended to correct.<\/p><h4>References for Chapter 11<\/h4><p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p><p>2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p><p>3. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>4. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p><p>5. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p><p>6. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124.<\/p><p>7. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.<\/p><p>8. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p><p>9. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800.<\/p>", "plain": " Practical objective  After defining phenotypes, parameters, monitoring, and stopping criteria, the approach must be applied to common clinical scenarios. The aim is not to propose rigid protocols, but to show how lung ultrasound, ABG, respiratory muscle assessment, and hemodynamic tolerance can guide initiation, adjustment, and, when necessary, discontinuation of non-invasive support [1-5].  COPD/hypercapnia;  cardiogenic pulmonary edema;  pneumonia or de novo hypoxemic respiratory failure;  postoperative state, obesity, atelectasis, and dependent loss of aeration.  This chapter does not propose rigid protocols. It presents practical pathways with reasonable initial settings, reassessment timing, and stopping criteria. The pressures and flows shown are operational examples and should be adapted to the ventilator, interface, tolerance, ABG, LUS, and risk of failure.      Download image     Figure 11.1. Ultrasound-guided NIV
