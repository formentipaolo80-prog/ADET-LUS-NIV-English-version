sso.mp4", "poster": "images_app/app_image_13.png"}, {"id": "05_doppio_trigger", "title": "Double triggering", "desc": "Two assisted breaths occur during one prolonged effort.", "video": "videos/20_doppio_trigger.mp4", "poster": "images_app/app_image_14.png"}, {"id": "06_cycling_precoce", "title": "Premature cycling", "desc": "Assistance ends before patient effort has finished.", "video": "videos/21_cycling_precoce.mp4", "poster": "images_app/app_image_15.png"}, {"id": "07_cycling_ritardato", "title": "Delayed cycling", "desc": "The ventilator continues insufflation when the patient wants to exhale.", "video": "videos/22_cycling_ritardato.mp4", "poster": "images_app/app_image_16.png"}], "materials": {"figures": [{"index": 1, "caption": "Figure 1.1. The spectrum of non-invasive respiratory support. Conventional oxygen therapy, HFNC, CPAP, and pressure-support NIV represent different levels of intervention. They are not equivalent: they increase FiO2, flow, continuous pressure, or inspiratory support in different ways.", "file": "english_images/figure_01.png"}, {"index": 2, "caption": "Figure 1.2. CPAP vs NIV-PS. CPAP maintains continuous positive pressure. During pressure-support NIV, the ventilator delivers an inspiratory pressure above EPAP up to IPAP; the difference between the two levels corresponds to pressure support.", "file": "english_images/figure_02.png"}, {"index": 3, "caption": "Figure 1.3. EPAP/PEEP and pressure support: two different adjustable parameters. EPAP/PEEP and pressure support address different problems. The former acts mainly on aeration and oxygenation; the latter acts on inspiratory work and alveolar ventilation.", "file": "english_images/figure_03.png"}, {"index": 4, "caption": "Figure 2.1. NIV parameters: what they actually control. The main NIV parameters are not equivalent: EPAP/PEEP, IPAP, pressure support, FiO2, trigger, cycling, rise time, and backup rate have different targets.", "file": "english_images/figure_04.png"}, {"index": 5, "caption": "Figure 2.2. PSV or NIV-PS. The patient activates the inspiratory trigger; the ventilator delivers pressure support above the EPAP/PEEP level and ends assistance when inspiratory flow falls below the cycling threshold.", "file": "english_images/figure_05.png"}, {"index": 6, "caption": "Figure 2.3. Assisted cycle during NIV-PS: trigger, rise time, and cycling. The trigger initiates assistance, rise time determines the speed of pressure delivery, and cycling defines the transition to expiration. Many asynchronies depend more on these three elements than on the absolute pressure values.", "file": "english_images/figure_06.png"}, {"index": 7, "caption": "Figure 2.4. S/T mode. Assisted spontaneous breaths remain predominant; if the patient does not trigger, the backup rate generates a timed breath.", "file": "english_images/figure_07.png"}, {"index": 8, "caption": "Figure 2.5. Rapid ventilator assessment during NIV. Ventilator data must be interpreted together with clinical findings and ultrasound. The number on the display matters only if it is consistent with the patient.", "file": "english_images/figure_08.png"}, {"index": 9, "caption": "Figure 3.1. SIMV-VC + PSV. Synchronized mandatory volume-controlled breaths alternate with spontaneous breaths assisted by pressure support.", "file": "english_images/figure_09.png"}, {"index": 10, "caption": "Figure 3.2. SIMV-PC + PSV. Synchronized mandatory pressure-controlled breaths alternate with spontaneous breaths assisted by pressure support.", "file": "english_images/figure_10.png"}, {"index": 11, "caption": "Figure 3.3. PCV. Inspiratory pressure is controlled; flow is typically decelerating, and tidal volume depends on compliance, resistance, leaks, and patient effort.", "file": "english_images/figure_11.png"}, {"index": 12, "caption": "Figure 3.4. VCV. Tidal volume and inspiratory flow are preset; the pressure required to deliver them becomes a consequence of respiratory mechanics.", "file": "english_images/figure_12.png"}, {"index": 13, "caption": "Figure 3.5. CPAP. CPAP maintains an almost constant positive pressure throughout the respiratory cycle; the patient breathes spontaneously above the CPAP/PEEP level without differential inspiratory assistance.", "file": "english_images/figure_14.png"}, {"index": 14, "caption": "Figure 3.6. NIV modes: translating the name into physiology. Non-invasive modes should be interpreted according to the controlled variable, the presence or absence of inspiratory support, the backup rate, and circuit behavior.", "file": "english_images/figure_15.png"}, {"index": 15, "caption": "Figure 3.7. PRVC. The mode uses breath-by-breath adaptive pressure control to approach a target volume while maintaining a decelerating flow profile.", "file": "english_images/figure_16.png"}, {"index": 16, "caption": "Figure 3.8. VAPS/AVAPS. Pressure support changes progressively to bring tidal volume toward the set target; monitoring remains essential in the presence of leaks or variable respiratory mechanics.", "file": "english_images/figure_17.png"}, {"index": 17, "caption": "Figure 3.9. NIV circuits: single-limb and dual-limb. In a single-limb circuit, inspiration and expiration share the same tubing and CO2 elimination depends on an intentional leak or valve. In a dual-limb circuit, inspiratory and expiratory limbs are separate, with different handling of expiratory-flow measurement.", "file": "english_images/figure_18.png"}, {"index": 18, "caption": "Figure 4.1. Interfaces: practical selection and main limitations. Interfaces are not equivalent. Selection should take into account the respiratory problem, urgency, comfort, expected duration of treatment, leak risk, and need for stable positive pressure.", "file": "english_images/figure_19.png"}, {"index": 19, "caption": "Figure 4.2. Patient–ventilator asynchronies during NIV: trigger, flow, and cycling. The figure summarizes the main types of asynchrony, their waveform signs, common causes, and initial practical corrections.", "file": "english_images/figure_20.png"}, {"index": 20, "caption": "Figure 4.3. Early problems: what to suspect and what to correct. Leaks, discomfort, asynchronies, gastric distension, skin injury, and dryness/secretions should be actively assessed during the early phase of a non-invasive trial.", "file": "english_images/figure_21.png"}, {"index": 21, "caption": "Figure 5.1. The ADET method applied to NIV. Each ultrasound finding must be linked to a pathophysiological interpretation and a practical decision about respiratory support.", "file": "english_images/figure_21.png"}, {"index": 22, "caption": "Figure 5.2. Ultrasound examples: LUS score 0–3. Teaching examples of progressive ultrasound patterns: aerated lung, mild loss of aeration, severe loss of aeration, and consolidation. The score should always be interpreted together with distribution, pleural-line characteristics, and clinical context. Images adapted from the author’s ADET teaching material.", "file": "english_images/figure_22.png"}, {"index": 23, "caption": "Figure 5.3. Consolidation: ultrasound images and operational meaning. Static and dynamic air bronchograms, together with C-lines, the shred sign, and tissue-like hepatization, help interpret consolidation and estimate the expected role of positive pressure. Ultrasound images are taken from material provided by the author and arranged for teaching purposes.", "file": "english_images/figure_23.png"}, {"index": 24, "caption": "Figure 5.4. From ultrasound finding to ventilatory choice. Operational summary of the transition from ultrasound findings to decisions about non-invasive respiratory support.", "file": "english_images/figure_24.png"}, {"index": 25, "caption": "Figure 6.1. Practical 12-zone protocol for NIV. Anterior and lateral regions allow rapid initial assessment; posterior regions are essential for detecting consolidations, dependent atelectasis, and pleural effusions.", "file": "english_images/figure_25.png"}, {"index": 26, "caption": "Figure 6.2. Lung ultrasound: finding, meaning, and effect on NIV. An ultrasound finding becomes useful when it changes the support modality, settings, causal treatment, or threshold for escalation.", "file": "english_images/figure_26.png"}, {"index": 27, "caption": "Figure 6.3. Serial LUS: favorable, uncertain, or unfavorable response. Changes in LUS over time help distinguish true improvement from apparent stability.", "file": "english_images/figure_27.png"}, {"index": 28, "caption": "Figure 7.1. Diaphragm thickness and Thickening Fraction. Diaphragm thickness is measured in the zone of apposition using a linear probe. Tdi-exp describes the baseline value and allows monitoring of atrophy; Tdi-insp is used to calculate TFdi, the percentage change in thickness during inspiration.", "file": "english_images/figure_28.png"}, {"index": 29, "caption": "Figure 7.2. Diaphragmatic excursion: acoustic window and measurement. Diaphragmatic excursion measures displacement of the diaphragm dome and is assessed using M-mode. During NIV, it should be interpreted after thickness/TFdi and together with work of breathing, ventilatory support, synchrony, and ABG.", "file": "english_images/figure_29.png"}, {"index": 30, "caption": "Figure 7.3. Intercostal muscle ultrasound: Thickness Ratio. Intercostal muscles are assessed with a linear probe in the intercostal space. TR describes inspiratory thickening and may help identify compensatory muscle recruitment, respiratory distress, or insufficient ventilatory support.", "file": "english_images/figure_30.png"}, {"index": 31, "caption": "Figure 7.4. Abdominal muscle ultrasound: lateral abdominal wall and TFabd. The lateral abdominal muscles—external oblique, internal oblique, and transversus abdominis—can be assessed with a linear probe. TFabd helps identify active expiration and increased expiratory load.", "file": "english_images/figure_31.png"}, {"index": 32, "caption": "Figure 7.5. Respiratory muscles during NIV: integrated interpretation. The combination of TFdi, diaphragmatic excursion, intercostal TR, TFabd, respiratory rate, comfort, and ABG helps distinguish insufficient assistance, adequate assistance, over-assistance, and obstruction/hyperinflation.", "file": "english_images/figure_32.png"}, {"index": 33, "caption": "Figure 7.6. Positive pressure: ventilator waveforms and hemodynamic effects. The pressure, flow, and volume waveforms are separated from the hemodynamic boxes to keep the respiratory cycle readable. The operational message remains the same: during positive-pressure inspiration, intrathoracic pressure and lung volume increase, affecting preload, afterload, and right- and left-ventricular tolerance.", "file": "english_images/figure_33.png"}, {"index": 34, "caption": "Figure 8.1. Decision triangle: lung, pump, heart. Non-invasive support simultaneously affects lung aeration, respiratory muscle work, and heart–lung interaction. The choice of mode and settings should integrate all three domains.", "file": "english_images/figure_34.png"}, {"index": 35, "caption": "Figure 8.2. From ultrasound phenotype to support selection. The initial choice among HFNC, CPAP/EPAP, and pressure-support NIV depends on the dominant phenotype: respiratory muscle dysfunction, congestion, non-cardiogenic hypoxemia, atelectasis, or hemodynamic tolerance.", "file": "english_images/figure_35.png"}, {"index": 36, "caption": "Figure 8.3. First hour of ultrasound-guided NIV. A practical sequence to avoid indefinite non-invasive trials: initial phenotype, technical check, physiological response, and a decision within predefined time points.", "file": "english_images/figure_36.png"}, {"index": 37, "caption": "Figure 9.1. Adjustable parameters in ultrasound-guided NIV setup. Pressure support, EPAP/PEEP, FiO2, trigger/cycling, and interface are shown in a table linking each adjustable parameter to its physiological target, practical indication, and reassessment.", "file": "english_images/figure_37.png"}, {"index": 38, "caption": "Figure 9.2. Pressure-support titration. Pressure support should reduce respiratory muscle load without causing over-assistance, excessive tidal volumes, or asynchronies. TFdi, intercostal TR, respiratory rate, comfort, and ABG guide adjustment.", "file": "english_images/figure_38.png"}, {"index": 39, "caption": "Figure 9.3. EPAP/PEEP titration using LUS and cardiac assessment. Every increase in EPAP/PEEP should have a target: congestion, recruitment, auto-PEEP, or atelectasis. After adjustment, reassess LUS, FiO2, respiratory rate, comfort, and hemodynamic tolerance.", "file": "english_images/figure_39.png"}, {"index": 40, "caption": "Figure 9.4. Before changing parameters: check technique and synchrony. Leaks, ineffective triggering, incorrect cycling, and inappropriate rise time can mimic inadequate assistance or treatment failure. Correct technical problems before increasing PS or EPAP/PEEP.", "file": "english_images/figure_40.png"}, {"index": 41, "caption": "Figure 10.1. Serial monitoring of ultrasound-guided NIV. Response to support should be reassessed over time by integrating the patient, ventilator, ultrasound, ABG, and the resulting clinical decision.", "file": "english_images/figure_41.png"}, {"index": 42, "caption": "Figure 10.2. True success, apparent response, failure. The response to NIV should be classified by integrating SpO2, FiO2, respiratory rate, LUS, respiratory muscle activity, and ABG.", "file": "english_images/figure_42.png"}, {"index": 43, "caption": "Figure 10.3. Safety of the non-invasive trial: a clinical traffic-light approach. The trial should be rapidly classified as favorable, uncertain, or unfavorable. An uncertain response requires correction and prompt reassessment; an unfavorable response requires escalation or a change in strategy.", "file": "english_images/figure_43.png"}, {"index": 44, "caption": "Figure 10.4. Ultrasound examples for serial LUS monitoring. The figure combines illustrative ultrasound images to distinguish true response, apparent response, and probable failure. The images are adapted from material supplied by the author for teaching purposes and do not represent a serial study of the same patient.", "file": "english_images/figure_44.png"}, {"index": 45, "caption": "Figure 10.5. Warning signs during NIV. Clinical, ABG, ultrasound, respiratory muscle, ventilator, and hemodynamic signals should be interpreted together. When several domains deteriorate, the non-invasive trial should not be prolonged.", "file": "english_images/figure_45.png"}, {"index": 46, "caption": "Figure 10.6. De-escalation: when to reduce NIV or transition to HFNC/oxygen. Support should be reduced progressively: confirm stability, decrease intensity, introduce controlled breaks, and stop NIV only if the trend remains favorable.", "file": "english_images/figure_46.png"}, {"index": 47, "caption": "Figure 11.1. Ultrasound-guided NIV clinical pathways: from LUS to decision-making. The figure integrates representative ultrasound images in the four main practical scenarios: COPD/hypercapnia, cardiogenic pulmonary edema, pneumonia/de novo hypoxemia, and postoperative atelectasis.", "file": "english_images/figure_47.png"}, {"index": 48, "caption": "Figure 11.2. COPD/hypercapnia: from an A-pattern to pressure-support NIV. In a hypercapnic patient with a predominantly aerated lung, LUS shifts the focus toward respiratory muscles, auto-PEEP, trigger, cycling, pressure support, and accessory muscle activity.", "file": "english_images/figure_48.png"}, {"index": 49, "caption": "Figure 11.3. Cardiogenic pulmonary edema: orderly B-lines and CPAP/EPAP. Diffuse, orderly B-lines, when consistent with the clinical picture, represent a rational target for CPAP/EPAP and causal therapy.", "file": "english_images/figure_49.png"}, {"index": 50, "caption": "Figure 11.4. Heterogeneous lung: pneumonia, de novo hypoxemia, and atelectasis. In heterogeneous patterns, LUS helps distinguish recruitable loss of aeration, non-recruitable consolidation, and progressive deterioration during a non-invasive trial.", "file": "english_images/figure_50.png"}, {"index": 51, "caption": "Figure 12.1. Integrated ABG interpretation algorithm. Interpretation starts with pH, identifies the variable driving it, and links the finding to a change in NIV or causal treatment.", "file": "english_images/figure_51.png"}, {"index": 52, "caption": "Figure 12.2. The three independent variables in the Stewart approach. PaCO2, SID, and ATOT help identify the mechanism driving pH.", "file": "english_images/figure_52.png"}, {"index": 53, "caption": "Figure 12.3. Stewart at the bedside. Correcting pH means acting on the variable that is driving it: alveolar ventilation/NIV, fluid and strong-ion composition, albumin, and phosphate.", "file": "english_images/figure_53.png"}, {"index": 54, "caption": "Figure 13.1. Timeline of ultrasound-guided NIV. The final pathway summarizes four decision windows: indication, technical adaptation, pathophysiological response, and the two-hour decision.", "file": "english_images/figure_54.png"}, {"index": 55, "caption": "Figure 13.2. Initial assessment for NIV indication. Respiratory support is selected by integrating the lung, respiratory muscles, heart, and overall patient condition.", "file": "english_images/figure_55.png"}, {"index": 56, "caption": "Figure 13.3. Adaptation during the first few minutes. Before declaring failure, correct the interface, leaks, trigger, cycling, rise time, and comfort.", "file": "english_images/figure_56.png"}, {"index": 57, "caption": "Figure 13.4. Pathophysiological response at 30–60 minutes. A true response requires consistency among clinical findings, ABG, LUS, respiratory muscle activity, and ventilator data.", "file": "english_images/figure_57.png"}, {"index": 58, "caption": "Figure 13.5. The two-hour decision. The trial may continue, be adjusted or de-escalated, or be stopped if the trend is unfavorable.", "file": "english_images/figure_58.png"}]}}</script>
<script>window.APP_DATA=JSON.parse(document.getElementById("app-data").textContent);</script>
<script>const D=window.APP_DATA;
const tabs=[['home','Home','🏠'],['manuale','Manual','📘'],['ega','ABG','🩸'],['modalita','Modes','🫁'],['asincronie','Asynchronies','〽️'],['correzioni','Corrections','🎛️'],['algoritmo','Algorithm','🧭'],['calcoli','Calculators','🧮'],['referto','Report','📝'],['visivo','Visual report','🖼️'],['appendici','Appendices','🧩'],['materiali','Figures','📦'],['atlante','Atlas','🌊']];
const $=id=>document.getElementById(id), val=id=>$(id)?.value||'', num=id=>Number(val(id).replace(',','.'))||0, fmt=n=>(Math.round(n*10)/10).toString();
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const field=(id,label,value='')=>`<label><span>${label}</span><input id="${id}" value="${esc(value)}"></label>`;
const select=(id,label,options)=>`<label><span>${label}</span><select id="${id}">${options.map(x=>Array.isArray(x)?`<option value="${x[0]}">${x[1]}</option>`:`<option>${x}</option>`).join('')}</select></label>`;
const hero=(title,text='')=>`<section class="hero"><h2>${title}</h2>${text?`<p>${text}</p>`:''}</section>`;
const info=(title,text,cls='')=>`<div class="info ${cls}"><b>${title}</b><br>${text}</div>`;
const result=(id,label)=>`<div class="result"><small>${label}</small><strong id="${id}">—</strong></div>`;
function switchTab(id){document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!==id));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));window.scrollTo({top:0,behavior:'smooth'});}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();}}
function printText(title,text){const w=window.open('','_blank');if(!w)return;w.document.write(`<html lang="en"><head><title>${esc(title)}</title><style>body{font-family:Arial;margin:28px;line-height:1.5}pre{white-space:pre-wrap;font-family:Arial}img{max-width:100%}@media print{button{display:none}}</style></head><body><button onclick="print()">Print / save PDF</button><h1>${esc(title)}</h1><pre>${esc(text)}</pre></body></html>`);w.document.close();}
function bindInputs(section,fn){document.querySelectorAll(`#${section} input,#${section} select,#${section} textarea`).forEach(x=>x.oninput=fn);fn();}
function outputButtons(id,title){return `<div class="actions"><button class="btn dark" onclick="copyText($('${id}').textContent)">Copy text</button><button class="btn" onclick="printText('${title}',$('${id}').textContent)">Print / PDF</button></div><pre id="${id}"></pre>`;}
function renderHome(){$('home').innerHTML=hero('Ultrasound-guided non-invasive ventilation','AdET manual and bedside companion · English edition')+`<div class="homeActionRow">${tabs.filter(x=>['manuale','asincronie','ega','algoritmo'].includes(x[0])).map(x=>`<button class="btn" onclick="switchTab('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="homeCleanGrid" style="margin-top:18px">${[['manuale','Manual','13 searchable chapters with English figures and references.'],['atlante','Atlas and videos','LUS patterns, clinical clips and practical interpretation.'],['asincronie','Asynchronies','Waveform recognition, videos and corrective actions.'],['materiali','Figures','Open and download the English teaching figures.']].map(x=>`<div class="card homeTile" onclick="switchTab('${x[0]}')"><h2>${x[1]}</h2><p>${x[2]}</p></div>`).join('')}</div>`;}
function renderManual(){ $('manuale').innerHTML=`<div class="grid two"><div class="card"><div class="search"><input id="manualSearch" placeholder="Search the manual..."></div><div id="chapterList" class="sideList"></div></div><div id="chapterContent" class="card"></div></div>`;function show(c){$('chapterContent').innerHTML=c?`<span class="pill">${c.part}</span><h2>${c.title}</h2><div class="summary">${c.html}</div>`:'<p>No chapters match your search.</p>';};function list(){const q=val('manualSearch').toLowerCase();const rows=D.manual.filter(c=>(c.title+' '+c.part+' '+c.plain).toLowerCase().includes(q));$('chapterList').innerHTML=rows.map(c=>`<button class="item" data-ch="${D.manual.indexOf(c)}"><small>${c.part} · ${c.tag}</small><b>${c.title}</b></button>`).join('');$('chapterList').querySelectorAll('button').forEach(b=>b.onclick=()=>show(D.manual[+b.dataset.ch]));show(rows[0]);};$('manualSearch').oninput=list;list();}
function renderAlgorithm(id='pump'){const p=D.phenotypes.find(x=>x.id===id)||D.phenotypes[0];$('algoritmo').innerHTML=`<div class="grid two"><div class="card"><h2>1. Initial phenotype</h2><p>Choose the dominant problem. Integrate LUS, respiratory muscles, ventilator findings and trend.</p>${D.phenotypes.map(x=>`<button class="item" onclick="renderAlgorithm('${x.id}')"><small>${x.question}</small><b>${x.title}</b></button>`).join('')}</div><div class="card"><span class="pill">AdET algorithm</span><h2>${p.title}</h2><div class="decisionFlow">${[['Why NIV?',p.question],['Lung findings',p.lus],['Respiratory muscles',p.pump],['Ventilator assessment',p.ventilator]].map(x=>`<div class="flowStep"><b>${x[0]}</b><br>${x[1]}</div>`).join('')}</div><div class="decisionBox"><small>Suggested action</small><strong>${p.action}</strong></div><div class="grid cards2" style="margin-top:14px">${info('Reassessment',p.reassess,'ok')}${info('Pitfall',p.risk,'warn')}</div>${info('Practical rule','SpO₂ alone is insufficient. Assess comfort, RR/drive, FiO₂ or ABG and serial lung or muscle findings.')}</div></div>`;}
function renderAsincronie(){$('asincronie').innerHTML=hero('Patient–ventilator asynchronies during NIV','Identify the phase that does not match patient effort before changing the settings.')+`<div class="card"><img style="width:100%" src="${D.asynchronyBoxes[0].src}" alt="Patient–ventilator asynchronies"><div class="actions"><a href="${D.asynchronyBoxes[0].src}" download>Download English figure</a></div></div><div class="asynchVideoGrid">${D.asynchronyVideos.map(v=>`<article class="card"><video style="width:100%" controls playsinline preload="metadata" poster="${v.poster}"><source src="${v.video}" type="video/mp4"></video><h3>${v.title}</h3><p>${v.desc}</p></article>`).join('')}</div><div class="grid cards2">${D.asynchronyCards.map(c=>`<div class="card"><small>${c.phase}</small><h3>${c.title}</h3><p><b>Finding:</b> ${c.what}</p><p><b>Causes:</b> ${c.causes}</p><p><b>Correction:</b> ${c.action}</p></div>`).join('')}</div>`;}
const corrections=[
['Check interface and leaks; assess auto-PEEP and expiratory time.','Increase trigger sensitivity if this does not cause auto-triggering; consider cautious EPAP in obstruction and reassess after one change.'],
['Reduce leaks, improve triggering, assess hyperinflation and extend expiratory time.','In COPD, increasing the cycling threshold can shorten Ti. Consider cautious EPAP for auto-PEEP; reduce PS if over-assistance is present.'],
['Check mask, circuit, condensation, leaks and interface–circuit compatibility.','Reduce trigger sensitivity. Correct leaks before changing pressures; reduce PS if it worsens leaks.'],
['Assess clinical condition, comfort, the cause of high drive and suitability of the trial.','Increase pressurization speed. Consider more PS only if tidal volumes and de novo injury risk allow; reassess RR and muscles.'],
['Check combined tidal volume and the risk of over-assistance; assess high drive.','Lower the cycling threshold or increase Ti where available. Optimize PS cautiously and reassess volume and comfort.'],
['Assess flow and patient demand; exclude major leaks.','Lower the cycling/ETS threshold or increase Ti where available; reassess double triggering and comfort.'],
['Correct leaks and assess hyperinflation and active abdominal expiration.','Increase cycling/ETS to end inspiration earlier. Reduce excessive PS; preserve expiratory time in COPD.']];
function renderAsynchronyActions(){$('correzioni').innerHTML=hero('From asynchrony to corrective action','Start with interface and leaks, then adjust trigger, cycling, rise time, EPAP or pressure support.')+`<div class="grid two"><div class="card">${select('asyncAction','Observed asynchrony',D.asynchronyCards.map((c,i)=>[i,c.title]))}${info('Sequence','1. Patient and comfort<br>2. Interface and leaks<br>3. Ventilator waveforms<br>4. One setting at a time<br>5. Immediate reassessment')}</div><div id="asyncActionOutput" class="card"></div></div>${info('Persistent deterioration','Persistent tachypnea, high FiO₂, worsening LUS, unfavorable ABG or sustained drive require reassessment of the trial, rather than repeated technical adjustments.','warn')}`;$('asyncAction').onchange=()=>{const i=+val('asyncAction'),c=D.asynchronyCards[i];$('asyncActionOutput').innerHTML=`<h2>${c.title}</h2>${info('Waveform finding',c.what)}${info('Likely causes',c.causes)}${info('First correction',corrections[i][0])}${info('Setting to consider',corrections[i][1])}`;};$('asyncAction').onchange();}
const modes=[
['Respiratory muscles / hypercapnia','NIV-PS / BiLevel S or S/T','Unload respiratory muscles and improve alveolar ventilation.','Adjust PS; cautious EPAP for auto-PEEP; sensitive but stable trigger and cycling matched to mechanics.','pH, PaCO₂, RR, comfort, TFdi, TR, leaks and asynchronies.'],
['Cardiogenic congestion / orderly B-lines','CPAP/EPAP; NIV-PS if hypercapnia coexists','Improve aeration, reduce work of breathing and treat congestion.','Choose tolerated CPAP/EPAP; add PS when ventilation requires assistance.','Serial LUS, FiO₂, blood pressure, comfort, RR and ABG when indicated.'],
['Non-cardiogenic hypoxemia / heterogeneous lung','HFNC or a short, closely monitored NIV trial','Avoid masking failure or maintaining high drive in a heterogeneous lung.','Avoid excessive PS and tidal volumes; define stopping criteria before starting.','RR, FiO₂, PaO₂/FiO₂, LUS, TFdi/TR, estimated Vt, consciousness and ABG.'],
['Atelectasis / postoperative state / obesity','CPAP/EPAP plus positioning, analgesia and physiotherapy','Re-aerate dependent regions if consolidation is recruitable.','Increase EPAP/CPAP gradually; use appropriate positioning and manage secretions and pain.','Posterior regions, serial LUS, FiO₂, comfort, cough, bronchograms and effusion.'],
['OHS / chronic hypoventilation / sleep','BiLevel S/T; consider VAPS/AVAPS if Vt is unstable','Maintain stable average ventilation during sleep or variable mechanics.','Set IPAP/EPAP or PS limits; adequate EPAP for residual obstructive events.','PaCO₂/TcCO₂, estimated Vt, leaks, comfort, adherence and sleep quality.'],
['Vulnerable right ventricle / hemodynamic instability','HFNC or low pressures; avoid blind pressure escalation','Positive pressure can reduce venous return and worsen RV function.','Cautious EPAP/PEEP, close hemodynamic reassessment and focused echo where available.','Blood pressure, hypoperfusion, RV, IVC, FiO₂, comfort and clinical trend.']];

function media(type,title){
  const base = `<div class="media"><div class="label">${title}</div>`;
  if(type === 'patternA') return base + `<div class="pleura sliding"></div><div class="aline" style="top:125px"></div><div class="aline" style="top:175px"></div><div class="aline" style="top:225px"></div></div>`;
  if(type === 'barcode') return base + `<div class="pleura"></div><div class="barcode"></div></div>`;
  if(type === 'lungPoint') return base + `<div class="lungPointA"></div><div class="lungPointB"></div><div class="aline" style="top:145px;left:30px;right:55%"></div><div class="aline" style="top:190px;left:30px;right:55%"></div></div>`;
  if(type === 'verticalFew') return base + `<div class="pleura sliding"></div><div class="vArtifact" style="left:80px"></div><div class="vArtifact" style="left:165px;animation-delay:.3s"></div></div>`;
  if(type === 'verticalOrdered') return base + `<div class="pleura sliding"></div>${[55,95,135,175,215,255].map((x,i) => `<div class="vArtifact" style="left:${x}px;animation-delay:${i*.12}s"></div>`).join('')}</div>`;
  if(type === 'verticalConfluent') return base + `<div class="pleura sliding"></div>${[42,72,102,132,162,192,222,252].map((x,i) => `<div class="vArtifact confluent" style="left:${x}px;animation-delay:${i*.08}s"></div>`).join('')}</div>`;
  if(type === 'disordered') return base + `<div class="pleura rough"></div><div class="vArtifact" style="left:45px;height:120px"></div><div class="vArtifact confluent" style="left:105px;height:165px"></div><div class="shred" style="left:180px;right:28px;height:60px"></div></div>`;
  if(type === 'shred') return base + `<div class="pleura rough"></div><div class="shred"></div></div>`;
  if(type === 'broncoDyn') return base + `<div class="pleura rough"></div><div class="hepat"></div><div class="airdot" style="left:105px;bottom:85px"></div><div class="airdot" style="left:150px;bottom:98px;animation-delay:.25s"></div><div class="airdot" style="left:195px;bottom:75px;animation-delay:.5s"></div></div>`;
  if(type === 'fluid') return base + `<div class="pleura"></div><div class="fluid"></div><div class="hepat" style="left:95px;right:95px;bottom:96px;height:42px;opacity:.55"></div></div>`;
  if(type === 'diaphragm') return base + `<div class="diaphragm"></div><div class="mmode"></div><div class="curve"></div></div>`;
  if(type === 'intercostal') return base + `<div class="rib" style="left:70px"></div><div class="rib" style="right:70px"></div><div class="intercostalMuscle"></div><div class="muscleThicken"></div><div class="probeLine"></div></div>`;
  if(type === 'abdominal') return base + `<div class="abdLayer oe">EO</div><div class="abdLayer oi">IO</div><div class="abdLayer tra">TrA</div><div class="abdArrow">↔</div></div>`;
  if(type === 'pumpIntegrated') return base + `<div class="pumpNode dia">Diaphragm</div><div class="pumpNode ic">Intercostals</div><div class="pumpNode abd">Abdominals</div><div class="pumpLink l1"></div><div class="pumpLink l2"></div><div class="pumpLink l3"></div></div>`;
  return base + `<div class="pleura"></div></div>`;
}</script>
</body></html>
