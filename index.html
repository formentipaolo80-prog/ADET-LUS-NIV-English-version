ed areas, an irregular pleura, small subpleural consolidations, or a patchy distribution suggest primary lung disease such as pneumonia, an ARDS-like process, pulmonary contusion, fibrosis, or another form of heterogeneous loss of aeration [4,5].  What changes: non-invasive support should be used more cautiously. If the patient has high respiratory drive, a high LUS score, and a hyperactive diaphragm, the threshold for escalation should be low. The goal is not merely to achieve a good SpO2, but to truly reduce work of breathing. Do not prolong an ineffective trial.  Consolidation  Consolidation corresponds to score 3, but not all consolidations have the same meaning. It may represent pneumonia, atelectasis, compression from pleural effusion, bronchial obstruction, or retained secretions. Dynamic, static, or fluid bronchograms and the clinical context become decisive.  What changes: PEEP should not be increased automatically. First determine whether the region is recruitable, whether the bronchi are patent, whether secretions or pleural effusion are present, and whether physiotherapy, drainage of an associated effusion, or disobstructive bronchoscopy is required.  Pleural effusion  Pleural effusion can compress the lung and contribute to dyspnea, passive atelectasis, and NIV failure. NIV is not always the best treatment in this setting.  What changes: assess size, laterality, compressive effect, and indication for drainage. If the dominant problem is mechanical compression, increasing EPAP/PEEP may have limited efficacy.  Absent lung sliding and suspected pneumothorax  Absent lung sliding alone is not sufficient to diagnose pneumothorax, but it must be taken seriously in a patient receiving positive-pressure support. The lung point should be sought, A-lines assessed, absence of B-lines confirmed at the suspicious site, and associated clinical signs and hemodynamic stability considered [6].  What changes: before increasing ventilatory pressures or persisting with NIV/CPAP, the suspicion should be clarified. If pneumothorax is confirmed and clinically relevant, treatment of the cause, namely drainage, takes priority.      Download image     Figure 6.2. Lung ultrasound: finding, meaning, and effect on NIV. An ultrasound finding becomes useful when it changes the support modality, settings, causal treatment, or threshold for escalation.  LUS score in NIV practice  The LUS score is useful for serial monitoring of aeration loss, but it should not replace qualitative description of the pattern. In ultrasound-guided NIV, the numerical value should always be linked to the location of abnormalities, their homogeneity or heterogeneity, pleural-line characteristics, the presence of consolidation or pleural effusion, and the response to changes in support or position [3,7].  The key is repeated assessment in the same patient. The absolute value has limited meaning unless linked to distribution and clinical status. Change over time is more informative:  improving LUS + decreasing respiratory rate + reducible FiO2: true response;  unchanged LUS + better SpO2 but high FiO2: uncertain response;  worsening LUS + high respiratory drive + unfavorable ABG: probable failure.      Download image     Figure 6.3. Serial LUS: favorable, uncertain, or unfavorable response. Changes in LUS over time help distinguish true improvement from apparent stability.  LUS and EPAP/PEEP titration  LUS can help determine whether an increase in EPAP/PEEP is producing reaeration. If a region changes from consolidation or confluent artifacts toward a more aerated pattern, the support is reaching a real target. If LUS remains unchanged despite increasing pressures, poor recruitability becomes more likely [2,7].  Caution: LUS does not directly measure overdistension. Improvement in some dependent regions may coexist with overdistension of already aerated regions, especially in heterogeneous lungs. Titration should therefore not rely on lung ultrasound alone, but also on clinical status, hemodynamics, ventilator-derived volumes, patient comfort, and monitoring of diaphragm and right-ventricular function.  NIV-oriented report  A useful report does not need to be long. It should state what is relevant to treatment.  Example of a concise structure:  Lung sliding: present/absent in the regions examined.  Predominant pattern: A-pattern, vertical artifacts, consolidation, pleural effusion.  Distribution: focal/diffuse, homogeneous/heterogeneous, anterior/lateral/posterior.  LUS score: if calculated, including the most affected regions.  Consolidations: location, bronchogram characteristics, and any associated pleural effusion.  Interpretation: aerated, congested, disorganized, consolidated, or compressed lung.  NIV implication: HFNC/CPAP/NIV, EPAP/PEEP, reassessment, escalation.  Pitfall to avoid  The most common error is to use LUS as a single baseline snapshot rather than as a monitoring tool. LUS performed only before NIV is useful diagnostically, but much of its practical value is lost if it is not repeated when the patient changes clinically or when ventilator settings are modified.  LUS during NIV should be serial, targeted, and decision-oriented.  References for Chapter 6  1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.  2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.  3. Mongodi S, Bouhemad B, Orlando A, Stella A, Tavazzi G, Via G, Iotti GA, Braschi A, Mojoli F. Modified Lung Ultrasound Score for Assessing and Monitoring Pulmonary Aeration. Ultraschall Med. 2017;38(5):530-537. doi:10.1055/s-0042-120260.  4. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116.  5. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397.  6. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800.  7. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC. "}, {"part": "Part II — Ultrasound Applied to NIV: the AdET Method", "title": "Chapter 7. Diaphragm, Respiratory Muscles, and Heart", "tag": "Ch. 7", "html": "<h4>Practical objective<\/h4><p>NIV does not only modify lung aeration; it also changes the load imposed on the respiratory muscles and heart–lung interaction. Ultrasound assessment should therefore determine whether support effectively reduces patient effort, whether the diaphragm remains overloaded, whether accessory muscles are compensating, and whether positive pressure is hemodynamically tolerated [1-3].<\/p><p>The question remains the same:<\/p><p>what do I see → what does it mean → what do I set or change in NIV?<\/p><h4>Diaphragm thickness and thickening fraction<\/h4><p>The most useful measure for assessing the diaphragm during assisted ventilation is usually not displacement of the dome but muscle thickening, expressed as thickening fraction. Diaphragm thickness is measured in the zone of apposition using a high-frequency linear probe, generally between the seventh and ninth intercostal spaces along the anterior-to-mid axillary line [1-4].<\/p><p>The diaphragm should appear as a three-layer structure: two hyperechoic lines, the pleura and peritoneum, with the hypoechoic muscle between them.<\/p><p>The main measurements are:<\/p><p>Tdi-exp: end-expiratory thickness;<\/p><p>Tdi-insp: end-inspiratory thickness;<\/p><p>TFdi: diaphragmatic thickening fraction, also referred to as DTF in the literature.<\/p><p>The formula is:<\/p><p>TFdi (%) = [(Tdi-insp − Tdi-exp) / Tdi-exp] × 100<\/p><p>Each parameter has a different practical meaning. Tdi-exp primarily describes baseline thickness and helps monitor atrophy over time. TFdi, also termed DTF, describes relative contractile activity during inspiration.<\/p><p>During NIV, very low TFdi values may indicate dysfunction, respiratory muscle fatigue, or over-assistance. High TFdi values may indicate high respiratory drive, insufficient assistance, or risk of fatigue. A normal reference range during NIV, always to be interpreted within the clinical context, is approximately 20–30%.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_28.png\" alt=\"English teaching figure 28\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_28.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 7.1. Diaphragm thickness and Thickening Fraction. Diaphragm thickness is measured in the zone of apposition using a linear probe. Tdi-exp describes the baseline value and allows monitoring of atrophy; Tdi-insp is used to calculate TFdi, the percentage change in thickness during inspiration.<\/p><h4>Diaphragmatic excursion<\/h4><p>Diaphragmatic excursion (DE) measures cranio-caudal displacement of the diaphragm dome during inspiration. It is assessed using a convex probe through a subcostal approach, usually on the right, with M-mode [5,6].<\/p><p>It is an intuitive and rapid measure, but it has an important limitation: it describes muscle movement, not force. The diaphragm may move because it contracts, but also because of accessory respiratory muscle activity, pleural pressure changes, or ventilatory support.<\/p><p>For this reason, during NIV, excursion should not precede thickness/TFdi assessment in clinical reasoning. It should be used as complementary information.<\/p><p>It may indicate:<\/p><p>preserved excursion: good dome mobility, but not proof of normal strength;<\/p><p>reduced excursion: dysfunction, hyperinflation, obesity, pain, low respiratory drive, or a suboptimal acoustic window;<\/p><p>paradoxical movement: suspected severe diaphragmatic dysfunction, to be confirmed in the clinical context.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_29.png\" alt=\"English teaching figure 29\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_29.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 7.2. Diaphragmatic excursion: acoustic window and measurement. Diaphragmatic excursion measures displacement of the diaphragm dome and is assessed using M-mode. During NIV, it should be interpreted after thickness/TFdi and together with work of breathing, ventilatory support, synchrony, and ABG.<\/p><h4>Intercostal and parasternal muscles<\/h4><p>The diaphragm does not work alone. When respiratory load increases, or when the diaphragm is weak, disadvantaged by hyperinflation, or over-assisted, the patient may recruit intercostal and parasternal muscles.<\/p><p>Intercostal muscles are assessed with a linear probe in the intercostal space, visualizing the two ribs, their posterior acoustic shadows, the intercostal muscle, and the pleura. The simplest parameter is the intercostal Thickness Ratio (TR) [7,8]:<\/p><p>TR (%) = [(inspiratory thickness − expiratory thickness) / expiratory thickness] × 100<\/p><p>An increased TR suggests accessory inspiratory muscle recruitment. This is particularly important when TFdi is low or ambiguous: the diaphragm may appear relatively inactive because the patient is compensating with other muscles.<\/p><p>What changes in NIV:<\/p><p>high TR + tachypnea: possible insufficient support or high respiratory drive;<\/p><p>high TR + low TFdi: possible compensation for diaphragmatic dysfunction;<\/p><p>low TR + low TFdi: low respiratory muscle activity, possible over-assistance or weakness;<\/p><p>persistently high TR despite NIV: reassess pressure support, trigger, leaks, comfort, and the indication for non-invasive support.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_30.png\" alt=\"English teaching figure 30\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_30.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 7.3. Intercostal muscle ultrasound: Thickness Ratio. Intercostal muscles are assessed with a linear probe in the intercostal space. TR describes inspiratory thickening and may help identify compensatory muscle recruitment, respiratory distress, or insufficient ventilatory support.<\/p><h4>Abdominal muscles<\/h4><p>The abdominal muscles are not inspiratory muscles, but they become important when the patient actively recruits expiration. During normal quiet breathing, expiration is mainly passive. Marked abdominal contraction indicates use of an expiratory pump.<\/p><p>This may occur in COPD, airflow obstruction, dynamic hyperinflation, ineffective cough, retained secretions, discomfort, asynchronies, or increased respiratory load.<\/p><p>Assessment is performed with a linear probe on the abdominal wall. Laterally, three main muscle layers can be visualized:<\/p><p>EO: external oblique;<\/p><p>IO: internal oblique;<\/p><p>TrA: transversus abdominis.<\/p><p>A practical parameter is abdominal muscle thickening fraction, TFabd, calculated with an expiratory orientation:<\/p><p>TFabd (%) = [(end-expiratory thickness − end-inspiratory thickness) / end-inspiratory thickness] × 100<\/p><p>An increase in TFabd indicates active expiratory contraction.<\/p><p>What changes in NIV:<\/p><p>markedly active abdominal muscles: suspect forced expiration, obstruction, or hyperinflation;<\/p><p>active abdominal muscles + COPD: reassess EPAP, cycling, and expiratory time;<\/p><p>active abdominal muscles + secretions: consider ineffective cough and airway clearance;<\/p><p>progressively increasing TFabd: possible fatigue or worsening expiratory load.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_31.png\" alt=\"English teaching figure 31\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_31.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 7.4. Abdominal muscle ultrasound: lateral abdominal wall and TFabd. The lateral abdominal muscles—external oblique, internal oblique, and transversus abdominis—can be assessed with a linear probe. TFabd helps identify active expiration and increased expiratory load.<\/p><h4>Integrated interpretation during NIV<\/h4><p>Respiratory muscle measurements are meaningful only when integrated with clinical status, ventilator settings, changes in lung ultrasound, and ABG [1-4,7-9].<\/p><p>Insufficient assistance<\/p><p>The patient remains tachypneic and dyspneic, with high TFdi, increased intercostal TR, active accessory muscles, and no improvement in PaCO2 or pH. In this situation, support may be insufficient, poorly synchronized, or limited by large leaks.<\/p><p>Adequate assistance<\/p><p>Support reduces respiratory muscle load without abolishing diaphragmatic activity.<\/p><p>Over-assistance<\/p><p>Very low TFdi, little inspiratory accessory muscle activity, high estimated tidal volume, asynchronies, or large leaks. The ventilator may be dominating the breath excessively. In this setting, reducing pressure support may be reasonable if clinically safe.<\/p><p>Obstruction or hyperinflation<\/p><p>Active abdominal muscles, increased TR, reduced or rapid diaphragmatic excursion, and forced expiration. In this setting, reassess auto-PEEP, EPAP, cycling, expiratory time, and comfort.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_32.png\" alt=\"English teaching figure 32\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_32.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 7.5. Respiratory muscles during NIV: integrated interpretation. The combination of TFdi, diaphragmatic excursion, intercostal TR, TFabd, respiratory rate, comfort, and ABG helps distinguish insufficient assistance, adequate assistance, over-assistance, and obstruction/hyperinflation.<\/p><h4>Heart and tolerance of positive pressure<\/h4><p>Positive pressure alters venous return, preload, afterload, intrathoracic pressure, and heart–lung interaction. Focused cardiac ultrasound is not intended to provide a complete cardiological diagnosis, but to avoid major errors when EPAP/PEEP is increased [10].<\/p><p>Left heart<\/p><p>In cardiogenic pulmonary edema, positive pressure can reduce respiratory load and favorably modify left-ventricular preload and afterload; conversely, in patients with a vulnerable right ventricle, pressure increases require greater caution [10].<\/p><p>Right heart<\/p><p>A dilated right ventricle, a D-shaped left ventricle, hypotension, or suspected pulmonary hypertension makes the patient more vulnerable to increases in airway pressure. In these situations, EPAP/PEEP should not be increased indiscriminately.<\/p><p>Inferior vena cava and congestion<\/p><p>The inferior vena cava (IVC) may provide useful orientation, but during NIV/CPAP it should be interpreted cautiously. Diameter and collapsibility depend on volume status, intrathoracic pressure, respiratory drive, and applied pressure. IVC findings should not be used alone to decide on fluid administration, PEEP/EPAP settings, or escalation.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_33.png\" alt=\"English teaching figure 33\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_33.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 7.6. Positive pressure: ventilator waveforms and hemodynamic effects. The pressure, flow, and volume waveforms are separated from the hemodynamic boxes to keep the respiratory cycle readable. The operational message remains the same: during positive-pressure inspiration, intrathoracic pressure and lung volume increase, affecting preload, afterload, and right- and left-ventricular tolerance.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to use a single measurement, especially diaphragmatic excursion, as though it directly measured diaphragm function. During NIV, knowing how far the diaphragm moves is not enough. One must also know whether it thickens, whether other muscles are compensating, whether the patient is actively exhaling, and whether the heart tolerates the support.<\/p><p>The diaphragm should not be interpreted as an isolated number, but as a response to ventilatory support.<\/p><h4>References for Chapter 7<\/h4><p>1. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412.<\/p><p>2. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5.<\/p><p>3. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.<\/p><p>4. Goligher EC, Fan E, Herridge MS, Murray A, Vorona S, Brace D, Rittayamai N, et al. Evolution of diaphragm thickness during mechanical ventilation: impact of inspiratory effort. Am J Respir Crit Care Med. 2015;192(9):1080-1088. doi:10.1164/rccm.201503-0620OC.<\/p><p>5. McCool FD, Tzelepis GE. Dysfunction of the diaphragm. N Engl J Med. 2012;366(10):932-942. doi:10.1056/NEJMra1007236.<\/p><p>6. Boussuges A, Gole Y, Blanc P. Diaphragmatic motion studied by M-mode ultrasonography: methods, reproducibility, and normal values. Chest. 2009;135(2):391-400. doi:10.1378/chest.08-1541.<\/p><p>7. Formenti P, Umbrello M, Dres M, Chiumello D. Ultrasonographic assessment of parasternal intercostal muscles during mechanical ventilation. Ann Intensive Care. 2020;10(1):120. doi:10.1186/s13613-020-00749-0.<\/p><p>8. Dres M, Dubé BP, Goligher E, Vorona S, Demiri S, Morawiec E, et al. Usefulness of parasternal intercostal muscle ultrasound during weaning from mechanical ventilation. Anesthesiology. 2020;132(5):1114-1125. doi:10.1097/ALN.0000000000003191.<\/p><p>9. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p><p>10. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3.<\/p>", "plain": " Practical objective  NIV does not only modify lung aeration; it also changes the load imposed on the respiratory muscles and heart–lung interaction. Ultrasound assessment should therefore determine whether support effectively reduces patient effort, whether the diaphragm remains overloaded, whether accessory muscles are compensating, and whether positive pressure is hemodynamically tolerated [1-3].  The question remains the same:  what do I see → what does it mean → what do I set or change in NIV?  Diaphragm thickness and thickening fraction  The most useful measure for assessing the diaphragm during assisted ventilation is usually not displacement of the dome but muscle thickening, expressed as thickening fraction. Diaphragm thickness is measured in the zone of apposition using a high-frequency linear probe, generally between the seventh and ninth intercostal spaces along the anterior-to-mid axillary line [1-4].  The diaphragm should appear as a three-layer structure: two hyperechoic lines, the pleura and peritoneum, with the hypoechoic muscle between them.  The main measurements are:  Tdi-exp: end-expiratory thickness;  Tdi-insp: end-inspiratory thickness;  TFdi: diaphragmatic thickening fraction, also referred to as DTF in the literature.  The formula is:  TFdi (%) = [(Tdi-insp − Tdi-exp) / Tdi-exp] × 100  Each parameter has a different practical meaning. Tdi-exp primarily describes baseline thickness and helps monitor atrophy over time. TFdi, also termed DTF, describes relative contractile activity during inspiration.  During NIV, very low TFdi values may indicate dysfunction, respiratory muscle fatigue, or over-assistance. High TFdi values may indicate high respiratory drive, insufficient assistance, or risk of fatigue. A normal reference range during NIV, always to be interpreted within the clinical context, is approximately 20–30%.      Download image     Figure 7.1. Diaphragm thickness and Thickening Fraction. Diaphragm thickness is measured in the zone of apposition using a linear probe. Tdi-exp describes the baseline value and allows monitoring of atrophy; Tdi-insp is used to calculate TFdi, the percentage change in thickness during inspiration.  Diaphragmatic excursion  Diaphragmatic excursion (DE) measures cranio-caudal displacement of the diaphragm dome during inspiration. It is assessed using a convex probe through a subcostal approach, usually on the right, with M-mode [5,6].  It is an intuitive and rapid measure, but it has an important limitation: it describes muscle movement, not force. The diaphragm may move because it contracts, but also because of accessory respiratory muscle activity, pleural pressure changes, or ventilatory support.  For this reason, during NIV, excursion should not precede thickness/TFdi assessment in clinical reasoning. It should be used as complementary information.  It may indicate:  preserved excursion: good dome mobility, but not proof of normal strength;  reduced excursion: dysfunction, hyperinflation, obesity, pain, low respiratory drive, or a suboptimal acoustic window;  paradoxical movement: suspected severe diaphragmatic dysfunction, to be confirmed in the clinical context.      Download image     Figure 7.2. Diaphragmatic excursion: acoustic window and measurement. Diaphragmatic excursion measures displacement of the diaphragm dome and is assessed using M-mode. During NIV, it should be interpreted after thickness/TFdi and together with work of breathing, ventilatory support, synchrony, and ABG.  Intercostal and parasternal muscles  The diaphragm does not work alone. When respiratory load increases, or when the diaphragm is weak, disadvantaged by hyperinflation, or over-assisted, the patient may recruit intercostal and parasternal muscles.  Intercostal muscles are assessed with a linear probe in the intercostal space, visualizing the two ribs, their posterior acoustic shadows, the intercostal muscle, and the pleura. The simplest parameter is the intercostal Thickness Ratio (TR) [7,8]:  TR (%) = [(inspiratory thickness − expiratory thickness) / expiratory thickness] × 100  An increased TR suggests accessory inspiratory muscle recruitment. This is particularly important when TFdi is low or ambiguous: the diaphragm may appear relatively inactive because the patient is compensating with other muscles.  What changes in NIV:  high TR + tachypnea: possible insufficient support or high respiratory drive;  high TR + low TFdi: possible compensation for diaphragmatic dysfunction;  low TR + low TFdi: low respiratory muscle activity, possible over-assistance or weakness;  persistently high TR despite NIV: reassess pressure support, trigger, leaks, comfort, and the indication for non-invasive support.      Download image     Figure 7.3. Intercostal muscle ultrasound: Thickness Ratio. Intercostal muscles are assessed with a linear probe in the intercostal space. TR describes inspiratory thickening and may help identify compensatory muscle recruitment, respiratory distress, or insufficient ventilatory support.  Abdominal muscles  The abdominal muscles are not inspiratory muscles, but they become important when the patient actively recruits expiration. During normal quiet breathing, expiration is mainly passive. Marked abdominal contraction indicates use of an expiratory pump.  This may occur in COPD, airflow obstruction, dynamic hyperinflation, ineffective cough, retained secretions, discomfort, asynchronies, or increased respiratory load.  Assessment is performed with a linear probe on the abdominal wall. Laterally, three main muscle layers can be visualized:  EO: external oblique;  IO: internal oblique;  TrA: transversus abdominis.  A practical parameter is abdominal muscle thickening fraction, TFabd, calculated with an expiratory orientation:  TFabd (%) = [(end-expiratory thickness − end-inspiratory thickness) / end-inspiratory thickness] × 100  An increase in TFabd indicates active expiratory contraction.  What changes in NIV:  markedly active abdominal muscles: suspect forced expiration, obstruction, or hyperinflation;  active abdominal muscles + COPD: reassess EPAP, cycling, and expiratory time;  active abdominal muscles + secretions: consider ineffective cough and airway clearance;  progressively increasing TFabd: possible fatigue or worsening expiratory load.      Download image     Figure 7.4. Abdominal muscle ultrasound: lateral abdominal wall and TFabd. The lateral abdominal muscles—external oblique, internal oblique, and transversus abdominis—can be assessed with a linear probe. TFabd helps identify active expiration and increased expiratory load.  Integrated interpretation during NIV  Respiratory muscle measurements are meaningful only when integrated with clinical status, ventilator settings, changes in lung ultrasound, and ABG [1-4,7-9].  Insufficient assistance  The patient remains tachypneic and dyspneic, with high TFdi, increased intercostal TR, active accessory muscles, and no improvement in PaCO2 or pH. In this situation, support may be insufficient, poorly synchronized, or limited by large leaks.  Adequate assistance  Support reduces respiratory muscle load without abolishing diaphragmatic activity.  Over-assistance  Very low TFdi, little inspiratory accessory muscle activity, high estimated tidal volume, asynchronies, or large leaks. The ventilator may be dominating the breath excessively. In this setting, reducing pressure support may be reasonable if clinically safe.  Obstruction or hyperinflation  Active abdominal muscles, increased TR, reduced or rapid diaphragmatic excursion, and forced expiration. In this setting, reassess auto-PEEP, EPAP, cycling, expiratory time, and comfort.      Download image     Figure 7.5. Respiratory muscles during NIV: integrated interpretation. The combination of TFdi, diaphragmatic excursion, intercostal TR, TFabd, respiratory rate, comfort, and ABG helps distinguish insufficient assistance, adequate assistance, over-assistance, and obstruction/hyperinflation.  Heart and tolerance of positive pressure  Positive pressure alters venous return, preload, afterload, intrathoracic pressure, and heart–lung interaction. Focused cardiac ultrasound is not intended to provide a complete cardiological diagnosis, but to avoid major errors when EPAP/PEEP is increased [10].  Left heart  In cardiogenic pulmonary edema, positive pressure can reduce respiratory load and favorably modify left-ventricular preload and afterload; conversely, in patients with a vulnerable right ventricle, pressure increases require greater caution [10].  Right heart  A dilated right ventricle, a D-shaped left ventricle, hypotension, or suspected pulmonary hypertension makes the patient more vulnerable to increases in airway pressure. In these situations, EPAP/PEEP should not be increased indiscriminately.  Inferior vena cava and congestion  The inferior vena cava (IVC) may provide useful orientation, but during NIV/CPAP it should be interpreted cautiously. Diameter and collapsibility depend on volume status, intrathoracic pressure, respiratory drive, and applied pressure. IVC findings should not be used alone to decide on fluid administration, PEEP/EPAP settings, or escalation.      Download image     Figure 7.6. Positive pressure: ventilator waveforms and hemodynamic effects. The pressure, flow, and volume waveforms are separated from the hemodynamic boxes to keep the respiratory cycle readable. The operational message remains the same: during positive-pressure inspiration, intrathoracic pressure and lung volume increase, affecting preload, afterload, and right- and left-ventricular tolerance.  Pitfall to avoid  The most common error is to use a single measurement, especially diaphragmatic excursion, as though it directly measured diaphragm function. During NIV, knowing how far the diaphragm moves is not enough. One must also know whether it thickens, whether other muscles are compensating, whether the patient is actively exhaling, and whether the heart tolerates the support.  The diaphragm should not be interpreted as an isolated number, but as a response to ventilatory support.  References for Chapter 7  1. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412.  2. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5.  3. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.  4. Goligher EC, Fan E, Herridge MS, Murray A, Vorona S, Brace D, Rittayamai N, et al. Evolution of diaphragm thickness during mechanical ventilation: impact of inspiratory effort. Am J Respir Crit Care Med. 2015;192(9):1080-1088. doi:10.1164/rccm.201503-0620OC.  5. McCool FD, Tzelepis GE. Dysfunction of the diaphragm. N Engl J Med. 2012;366(10):932-942. doi:10.1056/NEJMra1007236.  6. Boussuges A, Gole Y, Blanc P. Diaphragmatic motion studied by M-mode ultrasonography: methods, reproducibility, and normal values. Chest. 2009;135(2):391-400. doi:10.1378/chest.08-1541.  7. Formenti P, Umbrello M, Dres M, Chiumello D. Ultrasonographic assessment of parasternal intercostal muscles during mechanical ventilation. Ann Intensive Care. 2020;10(1):120. doi:10.1186/s13613-020-00749-0.  8. Dres M, Dubé BP, Goligher E, Vorona S, Demiri S, Morawiec E, et al. Usefulness of parasternal intercostal muscle ultrasound during weaning from mechanical ventilation. Anesthesiology. 2020;132(5):1114-1125. doi:10.1097/ALN.0000000000003191.  9. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.  10. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3. "}, {"part": "Part III — Selecting and Setting Respiratory Support", "title": "Chapter 8. Ultrasound Phenotypes and Initial Choice of Support", "tag": "Ch. 8", "html": "<h4>Practical objective<\/h4><p>The initial NIV setup should be simple, justified, and easy to reassess. Before setting EPAP, pressure support, or FiO2, identify the dominant phenotype:<\/p><p>respiratory muscle problem;<\/p><p>congestion/interstitial problem;<\/p><p>non-cardiogenic hypoxemia;<\/p><p>atelectatic or postoperative problem;<\/p><p>poor hemodynamic tolerance of positive pressure.<\/p><p>These phenotypes are not definitive diagnoses. They are operational categories used to decide where to start and what to reassess immediately afterward [1-3].<\/p><p>The guiding question is: what do I want respiratory support to achieve?<\/p><p>Should support unload the respiratory pump, recruit the lung, treat congestion, correct focal loss of aeration, or avoid harm from positive pressure?<\/p><h4>The principle: do not start from SpO2<\/h4><p>Oxygen saturation is important, but it is not enough. Two patients with the same SpO2 may have opposite problems: one may have cardiogenic pulmonary edema and respond rapidly to CPAP; another may have heterogeneous pneumonia, high respiratory drive, and a high risk of NIV failure. A third patient may be hypercapnic, with an A-pattern and an overloaded diaphragm; in that case the priority is not recruitment, but ventilation and unloading of the respiratory pump.<\/p><p>Ultrasound-guided setting begins by integrating the answers to three questions:<\/p><p>Lung: aerated, congested, disorganized, consolidated, or compressed?\nPump: are the diaphragm and accessory muscles working too much or too little?\nHeart: is positive pressure likely to be useful or harmful?<\/p><p>By integrating these three domains, the predominant ultrasound phenotype can be defined and an appropriate support strategy selected.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_34.png\" alt=\"English teaching figure 34\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_34.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 8.1. Decision triangle: lung, pump, heart. Non-invasive support simultaneously affects lung aeration, respiratory muscle work, and heart–lung interaction. The choice of mode and settings should integrate all three domains.<\/p><h4>Phenotype 1: respiratory muscle problem<\/h4><p>The respiratory muscle phenotype is typical of hypercapnic patients and is often associated with COPD, obesity hypoventilation, acute obstructive exacerbation, neuromuscular disease, or ventilatory fatigue. LUS may show a predominant A-pattern without a clear recruitment target. TFdi may be high, intercostal muscles may be active, and abdominal muscle activity may indicate forced expiration [4].<\/p><p>In this phenotype, NIV-PS is the most logical initial support. Pressure support reduces inspiratory work and improves alveolar ventilation. EPAP should be set carefully: too little may fail to counteract auto-PEEP and ineffective triggering, while too much may worsen hyperinflation and tolerance.<\/p><p>What to reassess during setup: respiratory rate, pH, PaCO2, comfort, leaks, trigger, cycling, TFdi/intercostal TR, and abdominal muscle activity.<\/p><p>Pitfall to avoid: increasing EPAP/PEEP as if the problem were always recruitment.<\/p><h4>Phenotype 2: cardiogenic congestion or an orderly interstitial pattern<\/h4><p>In this phenotype, LUS shows diffuse, relatively orderly vertical artifacts, often symmetric, with a pleural line that is not markedly irregular. When the clinical and cardiac picture is consistent, positive pressure has a clear target: reducing work of breathing, improving oxygenation, and contributing to redistribution of intrathoracic volumes [5-7].<\/p><p>Initial support may be CPAP/EPAP. NIV-PS may be useful when hypercapnia, respiratory fatigue, or inadequate alveolar ventilation coexist.<\/p><p>What to monitor: reduction in dyspnea, decrease in respiratory rate, lower FiO2 requirement, blood-pressure stability, LUS improvement, and response to causal treatment.<\/p><p>Pitfall to avoid: looking only at SpO2 without checking whether LUS and work of breathing are truly improving.<\/p><h4>Phenotype 3: non-cardiogenic hypoxemia and a heterogeneous lung<\/h4><p>This is the most challenging phenotype. LUS shows a disorganized pattern, an irregular pleura, spared areas, subpleural consolidations, or heterogeneous loss of aeration. It may correspond to pneumonia, an ARDS-like process, inflammatory lung injury, or de novo hypoxemic respiratory failure [2,8,9].<\/p><p>In this setting, NIV may be risky if respiratory drive remains high. The patient may generate large tidal volumes, maintain high lung stress, and mask failure with temporarily acceptable SpO2.<\/p><p>HFNC may be the initial choice if the patient is cooperative, hemodynamically stable, and not markedly hypercapnic. An NIV-PS trial should be considered only with close surveillance and predefined failure criteria.<\/p><p>What to monitor: respiratory rate, required FiO2, serial LUS score, TFdi/TR, estimated tidal volume when available, ABG, mental status, and comfort.<\/p><p>Pitfall to avoid: prolonging NIV simply because SpO2 has improved.<\/p><h4>Phenotype 4: atelectasis, postoperative state, and dependent consolidations<\/h4><p>In postoperative, obese, bedridden, or painful patients, the main problem may be focal or dependent loss of aeration. LUS may show posterior or posterobasal consolidations, sometimes with air bronchograms, associated pleural effusion, or reduced regional expansion [4,5].<\/p><p>In this phenotype, CPAP/EPAP, optimization of positioning and analgesia, respiratory physiotherapy, and mobilization may all play an important role. Positive pressure is useful if the region is at least partially recruitable, but it cannot by itself resolve a bronchus obstructed by secretions or a non-recruitable consolidation.<\/p><p>What to monitor: reaeration of dependent regions, reduced FiO2 requirement, comfort, pain, cough, secretions, and bronchogram characteristics.<\/p><p>Pitfall to avoid: assuming that every LUS score-3 region can be corrected by setting or increasing EPAP/PEEP.<\/p><h4>Phenotype 5: vulnerable right ventricle or poor hemodynamic tolerance<\/h4><p>Positive pressure may be useful, but it is not physiologically neutral. If the right ventricle is dilated, the patient is hypotensive, or pulmonary embolism, pulmonary hypertension, or shock is suspected, increasing EPAP/PEEP may reduce venous return and worsen hemodynamic tolerance [10].<\/p><p>Caution is required in this phenotype. HFNC, a low-pressure CPAP/NIV-PS trial, or another strategy may be preferable depending on the clinical picture.<\/p><p>What to monitor: arterial pressure, signs of hypoperfusion, the right ventricle, IVC/congestion, required FiO2, and clinical response.<\/p><p>Pitfall to avoid: increasing positive pressure in a patient whose hemodynamics are deteriorating.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_35.png\" alt=\"English teaching figure 35\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_35.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 8.2. From ultrasound phenotype to support selection. The initial choice among HFNC, CPAP/EPAP, and pressure-support NIV depends on the dominant phenotype: respiratory muscle dysfunction, congestion, non-cardiogenic hypoxemia, atelectasis, or hemodynamic tolerance.<\/p><h4>The first hour: do not wait too long<\/h4><p>The first hour is used to confirm whether the initial phenotype was correct and whether support is producing a favorable trend. The detailed sequence of the four decision time points is presented in Chapter 13; the key point here is that every change should have a specific target and prompt reassessment.<\/p><p>During the first few minutes, assess technique and tolerance; at 30–60 minutes, look for a pathophysiological response; at approximately 2 hours, decide whether to continue, modify, or stop the trial.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_36.png\" alt=\"English teaching figure 36\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_36.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 8.3. First hour of ultrasound-guided NIV. A practical sequence to avoid indefinite non-invasive trials: initial phenotype, technical check, physiological response, and a decision within predefined time points.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to choose NIV because “the patient is desaturating” and then chase SpO2 by increasing pressures and FiO2. SpO2 is an outcome, not a pathophysiological diagnosis.<\/p><p>The choice of respiratory support should arise from the phenotype, not from SpO2 alone.<\/p><h4>References for Chapter 8<\/h4><p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p><p>2. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p><p>3. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p><p>4. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.<\/p><p>5. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124.<\/p><p>6. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>7. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p><p>8. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.<\/p><p>9. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p><p>10. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3.<\/p>", "plain": " Practical objective  The initial NIV setup should be simple, justified, and easy to reassess. Before setting EPAP, pressure support, or FiO2, identify the dominant phenotype:  respiratory muscle problem;  congestion/interstitial problem;  non-cardiogenic hypoxemia;  atelectatic or postoperative problem;  poor hemodynamic tolerance of positive pressure.  These phenotypes are not definitive diagnoses. They are operational categories used to decide where to start and what to reassess immediately afterward [1-3].  The guiding question is: what do I want respiratory support to achieve?  Should support unload the respiratory pump, recruit the lung, treat congestion, correct focal loss of aeration, or avoid harm from positive pressure?  The principle: do not start from SpO2  Oxygen saturation is important, but it is not enough. Two patients with the same SpO2 may have opposite problems: one may have cardiogenic pulmonary edema and respond rapidly to CPAP; another may have heterogeneous pneumonia, high respiratory drive, and a high risk of NIV failure. A third patient may be hypercapnic, with an A-pattern and an overloaded diaphragm; in that case the priority is not recruitment, but ventilation and unloading of the respiratory pump.  Ultrasound-guided setting begins by integrating the answers to three questions:  Lung: aerated, congested, disorganized, consolidated, or compressed?\nPump: are the diaphragm and accessory muscles working too much or too little?\nHeart: is positive pressure likely to be useful or harmful?  By integrating these three domains, the predominant ultrasound phenotype can be defined and an appropriate support strategy selected.      Download image     Figure 8.1. Decision triangle: lung, pump, heart. Non-invasive support simultaneously affects lung aeration, respiratory muscle work, and heart–lung interaction. The choice of mode and settings should integrate all three domains.  Phenotype 1: respiratory muscle problem  The respiratory muscle phenotype is typical of hypercapnic patients and is often associated with COPD, obesity hypoventilation, acute obstructive exacerbation, neuromuscular disease, or ventilatory fatigue. LUS may show a predominant A-pattern without a clear recruitment target. TFdi may be high, intercostal muscles may be active, and abdominal muscle activity may indicate forced expiration [4].  In this phenotype, NIV-PS is the most logical initial support. Pressure support reduces inspiratory work and improves alveolar ventilation. EPAP should be set carefully: too little may fail to counteract auto-PEEP and ineffective triggering, while too much may worsen hyperinflation and tolerance.  What to reassess during setup: respiratory rate, pH, PaCO2, comfort, leaks, trigger, cycling, TFdi/intercostal TR, and abdominal muscle activity.  Pitfall to avoid: increasing EPAP/PEEP as if the problem were always recruitment.  Phenotype 2: cardiogenic congestion or an orderly interstitial pattern  In this phenotype, LUS shows diffuse, relatively orderly vertical artifacts, often symmetric, with a pleural line that is not markedly irregular. When the clinical and cardiac picture is consistent, positive pressure has a clear target: reducing work of breathing, improving oxygenation, and contributing to redistribution of intrathoracic volumes [5-7].  Initial support may be CPAP/EPAP. NIV-PS may be useful when hypercapnia, respiratory fatigue, or inadequate alveolar ventilation coexist.  What to monitor: reduction in dyspnea, decrease in respiratory rate, lower FiO2 requirement, blood-pressure stability, LUS improvement, and response to causal treatment.  Pitfall to avoid: looking only at SpO2 without checking whether LUS and work of breathing are truly improving.  Phenotype 3: non-cardiogenic hypoxemia and a heterogeneous lung  This is the most challenging phenotype. LUS shows a disorganized pattern, an irregular pleura, spared areas, subpleural consolidations, or heterogeneous loss of aeration. It may correspond to pneumonia, an ARDS-like process, inflammatory lung injury, or de novo hypoxemic respiratory failure [2,8,9].  In this setting, NIV may be risky if respiratory drive remains high. The patient may generate large tidal volumes, maintain high lung stress, and mask failure with temporarily acceptable SpO2.  HFNC may be the initial choice if the patient is cooperative, hemodynamically stable, and not markedly hypercapnic. An NIV-PS trial should be considered only with close surveillance and predefined failure criteria.  What to monitor: respiratory rate, required FiO2, serial LUS score, TFdi/TR, estimated tidal volume when available, ABG, mental status, and comfort.  Pitfall to avoid: prolonging NIV simply because SpO2 has improved.  Phenotype 4: atelectasis, postoperative state, and dependent consolidations  In postoperative, obese, bedridden, or painful patients, the main problem may be focal or dependent loss of aeration. LUS may show posterior or posterobasal consolidations, sometimes with air bronchograms, associated pleural effusion, or reduced regional expansion [4,5].  In this phenotype, CPAP/EPAP, optimization of positioning and analgesia, respiratory physiotherapy, and mobilization may all play an important role. Positive pressure is useful if the region is at least partially recruitable, but it cannot by itself resolve a bronchus obstructed by secretions or a non-recruitable consolidation.  What to monitor: reaeration of dependent regions, reduced FiO2 requirement, comfort, pain, cough, secretions, and bronchogram characteristics.  Pitfall to avoid: assuming that every LUS score-3 region can be corrected by setting or increasing EPAP/PEEP.  Phenotype 5: vulnerable right ventricle or poor hemodynamic tolerance  Positive pressure may be useful, but it is not physiologically neutral. If the right ventricle is dilated, the patient is hypotensive, or pulmonary embolism, pulmonary hypertension, or shock is suspected, increasing EPAP/PEEP may reduce venous return and worsen hemodynamic tolerance [10].  Caution is required in this phenotype. HFNC, a low-pressure CPAP/NIV-PS trial, or another strategy may be preferable depending on the clinical picture.  What to monitor: arterial pressure, signs of hypoperfusion, the right ventricle, IVC/congestion, required FiO2, and clinical response.  Pitfall to avoid: increasing positive pressure in a patient whose hemodynamics are deteriorating.      Download image     Figure 8.2. From ultrasound phenotype to support selection. The initial choice among HFNC, CPAP/EPAP, and pressure-support NIV depends on the dominant phenotype: respiratory muscle dysfunction, congestion, non-cardiogenic hypoxemia, atelectasis, or hemodynamic tolerance.  The first hour: do not wait too long  The first hour is used to confirm whether the initial phenotype was correct and whether support is producing a favorable trend. The detailed sequence of the four decision time points is presented in Chapter 13; the key point here is that every change should have a specific target and prompt reassessment.  During the first few minutes, assess technique and tolerance; at 30–60 minutes, look for a pathophysiological response; at approximately 2 hours, decide whether to continue, modify, or stop the trial.      Download image     Figure 8.3. First hour of ultrasound-guided NIV. A practical sequence to avoid indefinite non-invasive trials: initial phenotype, technical check, physiological response, and a decision within predefined time points.  Pitfall to avoid  The most common error is to choose NIV because “the patient is desaturating” and then chase SpO2 by increasing pressures and FiO2. SpO2 is an outcome, not a pathophysiological diagnosis.  The choice of respiratory support should arise from the phenotype, not from SpO2 alone.  References for Chapter 8  1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  2. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.  3. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.  4. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.  5. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124.  6. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.  7. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.  8. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.  9. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.  10. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3. "}, {"part": "Part III — Selecting and Setting Respiratory Support", "title": "Chapter 9. Ultrasound-Guided Titration of NIV Parameters", "tag": "Ch. 9", "html": "<h4>Practical objective<\/h4><p>After selecting the initial support, clinical management requires coherent titration: which parameter should be changed, for which pathophysiological target, and with what reassessment timing [1,2]?<\/p><p>Ultrasound-guided titration does not mean continuously changing parameters in response to every image. It means linking each change to a pathophysiological target:<\/p><p>pressure support when the problem is inspiratory load, hypercapnia, or respiratory muscle dysfunction;<\/p><p>EPAP/PEEP when the problem is recruitment, congestion, auto-PEEP, or atelectasis;<\/p><p>FiO2 when oxygenation needs to be stabilized, remembering that it does not correct the underlying mechanism;<\/p><p>trigger, cycling, and rise time when the problem is asynchrony;<\/p><p>interface when the problem is excessive leak, poor comfort, or intolerance.<\/p><p>The rule is simple:<\/p><p>one change, one target, one reassessment.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_37.png\" alt=\"English teaching figure 37\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_37.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 9.1. Adjustable parameters in ultrasound-guided NIV setup. Pressure support, EPAP/PEEP, FiO2, trigger/cycling, and interface are shown in a table linking each adjustable parameter to its physiological target, practical indication, and reassessment.<\/p><h4>Before titration: make sure NIV is technically effective<\/h4><p>Before increasing pressure support or EPAP/PEEP, check the technical setup. A leaking mask, poorly fitted helmet, unstable trigger, or delayed cycling can mimic insufficient assistance. In that situation, the diaphragm remains hyperactive, intercostal muscle activity increases, and the patient appears not to respond, but the problem is not the phenotype or target: it is ineffective delivery of support [3].<\/p><p>The first questions are very practical:<\/p><p>does the patient tolerate the interface?<\/p><p>are there significant leaks?<\/p><p>does the ventilator deliver support when the patient inspires?<\/p><p>does inspiration end at the right time?<\/p><p>does the patient have air hunger or discomfort?<\/p><p>are the estimated tidal volumes plausible or excessive?<\/p><p>Only after this check does ultrasound-guided titration become meaningful.<\/p><h4>Pressure support: when to increase it and when to reduce it<\/h4><p>Pressure support is the main adjustable parameter when the problem lies in the respiratory muscles. Its purpose is to reduce inspiratory load, improve alveolar ventilation, and correct hypercapnia and respiratory acidosis.<\/p><p>When to increase it<\/p><p>Increasing pressure support is reasonable if the patient remains tachypneic, dyspneic, hypercapnic, or acidotic, with high TFdi, active intercostal muscles, and inadequate comfort. The reasoning is that inspiratory load remains excessive despite assistance [4].<\/p><p>The increase should be gradual. After each step, reassess respiratory rate, comfort, leak magnitude, estimated tidal volume, TFdi/TR, and ABG when indicated.<\/p><p>When not to increase it<\/p><p>Pressure support should not be increased when the main problem is a heterogeneous lung with a high risk of failure, when measured tidal volumes are already high, when leaks worsen, or when additional support generates asynchronies.<\/p><p>In non-cardiogenic hypoxemic respiratory failure, excessive pressure support may promote large tidal volumes and increased lung stress. In this setting, SpO2 may improve while risk increases [5].<\/p><p>When to reduce it<\/p><p>Pressure support may be excessive when TFdi is very low, tidal volumes are high, large leaks or discomfort develop, the patient appears dominated by the ventilator, or asynchronies occur. Reducing pressure support may improve synchrony and comfort when clinically safe.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_38.png\" alt=\"English teaching figure 38\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_38.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 9.2. Pressure-support titration. Pressure support should reduce respiratory muscle load without causing over-assistance, excessive tidal volumes, or asynchronies. TFdi, intercostal TR, respiratory rate, comfort, and ABG guide adjustment.<\/p><h4>EPAP/PEEP: not just oxygenation<\/h4><p>EPAP/PEEP is a powerful adjustable parameter. It can recruit atelectatic regions, improve oxygenation, reduce work of breathing in congested patients, and help overcome auto-PEEP in obstructive patients. It can also worsen hyperinflation, reduce venous return, and increase right-ventricular load [6-8].<\/p><p>The question is therefore not “how much should I increase PEEP?” but:<\/p><p>what is the target of PEEP in this patient?<\/p><p>Target: congestion<\/p><p>If LUS shows diffuse, orderly vertical artifacts in a clinically consistent cardiogenic setting, CPAP/EPAP has a strong rationale. The expected response is reduced work of breathing, lower FiO2 requirements, improved serial LUS, and hemodynamic stability.<\/p><p>Target: atelectasis or dependent loss of aeration<\/p><p>If LUS shows consolidation or dependent loss of aeration, EPAP/PEEP may be useful only when the region is at least partially recruitable. Positioning, physiotherapy, analgesia optimization, and secretion management are also important.<\/p><p>Target: auto-PEEP<\/p><p>In obstructive patients, appropriate EPAP/PEEP may facilitate triggering and reduce the inspiratory effort required to overcome intrinsic pressure. Excessive EPAP/PEEP may worsen hyperinflation and discomfort. Abdominal muscle activity, the shape of the expiratory flow waveform, and patient comfort are important clues.<\/p><p>Target: oxygenation without a clear mechanism<\/p><p>Increasing EPAP/PEEP solely to chase SpO2 is risky. If LUS does not improve, respiratory drive remains high, and the patient still requires high FiO2, the response is uncertain or unfavorable.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_39.png\" alt=\"English teaching figure 39\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_39.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 9.3. EPAP/PEEP titration using LUS and cardiac assessment. Every increase in EPAP/PEEP should have a target: congestion, recruitment, auto-PEEP, or atelectasis. After adjustment, reassess LUS, FiO2, respiratory rate, comfort, and hemodynamic tolerance.<\/p><h4>FiO2: stabilizes oxygenation but does not treat the mechanism<\/h4><p>FiO2 is necessary to maintain safe oxygenation, but it does not correct the underlying pathophysiology. Increasing FiO2 alone, without reducing work of breathing, LUS score, or respiratory drive, may mask failure of NIV.<\/p><p>In practice, a falling FiO2 requirement after support is started is a favorable sign. Persistently high FiO2, even with acceptable SpO2, indicates an incomplete response. If the patient remains tachypneic, with active respiratory muscles and an unchanged or worsening LUS score, an acceptable SpO2 should not be interpreted as success.<\/p><h4>Trigger, cycling, and rise time<\/h4><p>Many NIV problems arise from asynchrony. Ultrasound may show persistent diaphragm and intercostal muscle activity, but the cause may be poor patient–ventilator interaction.<\/p><p>Ineffective triggering<\/p><p>The patient inspires, but the ventilator either does not deliver pressure support or delivers it late. Clinically, this appears as inspiratory efforts, discomfort, tachypnea, and increased accessory muscle recruitment. In COPD, auto-PEEP may also contribute. Correction requires optimization of trigger sensitivity, leaks, EPAP/PEEP, and interface.<\/p><p>Delayed cycling<\/p><p>The ventilator continues insufflation when the patient wants to exhale. This is common with leaks and high pressure support. It may worsen discomfort, abdominal muscle recruitment, forced expiration, and asynchrony.<\/p><p>Premature cycling<\/p><p>The ventilator ends inspiration too early. The patient remains air hungry, may immediately trigger another breath, and may maintain high respiratory drive and respiratory rate.<\/p><p>Rise time<\/p><p>A rise time that is too slow may cause air hunger; conversely, an excessively fast rise time may increase discomfort, leaks, and abrupt pressurization.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_40.png\" alt=\"English teaching figure 40\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_40.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 9.4. Before changing parameters: check technique and synchrony. Leaks, ineffective triggering, incorrect cycling, and inappropriate rise time can mimic inadequate assistance or treatment failure. Correct technical problems before increasing PS or EPAP/PEEP.<\/p><h4>Interface: part of the ventilator setting, not a logistical detail<\/h4><p>Interface selection affects efficacy, leaks, comfort, asynchronies, and tolerance. A mask that is too tight may be intolerable; a mask that is too loose destabilizes triggering. A helmet may be useful in selected settings but requires attention to flow, pressurization, noise, response delay, and comfort. In practice, the interface should be considered a true adjustable therapeutic variable. If the patient cannot tolerate the interface, even the best ultrasound-based algorithm will fail.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to progressively increase everything: more FiO2, more pressure support, more EPAP/PEEP, and tighter mask straps. This produces apparently more intensive NIV, but not necessarily more effective NIV.<\/p><p>Ultrasound-guided setting is not about increasing numbers; it is about choosing the right adjustable parameter for the right target.<\/p><p> <\/p><h4>References for Chapter 9<\/h4><p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p><p>2. Nava S, Hill N. Non-invasive ventilation in
