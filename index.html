lems, continuous monitoring, and early reassessment cannot be guaranteed. In such situations, the priority is to define an alternative strategy rather than progressively increasing pressures in an attempt to compensate for an unsafe setting.<\/p><h4>The interface is part of the therapy<\/h4><p>The interface is not an accessory. Together with the circuit, it is the connection between ventilator and patient. It determines the pressures actually delivered, leaks, comfort, synchrony, risk of skin injury, and the patient’s ability to speak, cough, eat, or communicate.<\/p><p>An oronasal mask can be rapid and effective in acute care, but may cause claustrophobia, nasal-bridge pain, and major leaks. A helmet can be very useful for prolonged treatment and hypoxemia, but requires attention to flow, noise, internal volume, and asynchronies. HFNC is often very well tolerated but does not provide the same positive pressure as CPAP or a full-face mask. A nasal mask may be suitable for chronic or nocturnal support but is less appropriate in severe acute respiratory failure.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_19.png\" alt=\"English teaching figure 19\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_19.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 4.1. Interfaces: practical selection and main limitations. Interfaces are not equivalent. Selection should take into account the respiratory problem, urgency, comfort, expected duration of treatment, leak risk, and need for stable positive pressure.<\/p><h4>Oronasal mask<\/h4><p>This is the most commonly used interface in acute NIV. It covers the nose and mouth, allows rapid delivery of effective pressure, and is suitable for most patients with hypercapnic respiratory failure or respiratory muscle fatigue.<\/p><p>Strengths: availability, rapid application, effective pressure delivery, and ease of use.<\/p><p>Common problems: claustrophobia, pain, nasal-bridge lesions, leaks toward the eyes, dryness, and difficulty speaking or clearing secretions.<\/p><p>What to check immediately: adequate seal without excessive compression, comfort, eye irritation, synchrony, need for short breaks, and skin protection.<\/p><h4>Full-face mask<\/h4><p>A full-face mask covers the entire face. It can be useful when an oronasal mask causes difficult-to-correct leaks or localized skin lesions. It distributes pressure over a larger surface and may improve tolerance in some patients.<\/p><p>Strengths: better pressure distribution; useful when a conventional mask causes pressure lesions or leaks.<\/p><p>Common problems: larger internal volume, possible sense of isolation, leak management, and the need for experienced nursing and medical staff.<\/p><p>What to check immediately: comfort, lateral leaks, synchrony, and any increase in perceived dead space.<\/p><h4>Helmet<\/h4><p>The helmet allows CPAP or NIV to be delivered without direct contact with the nasal bridge and cheeks. It can be useful for prolonged treatment, in hypoxemic patients, and when reducing facial pressure injury is a priority. The helmet has also been studied in hypoxemic respiratory failure and ARDS, with favorable results in some trials, but it requires an appropriate setup and experienced staff [4].<\/p><p>Strengths: better tolerance during prolonged treatment, fewer facial lesions, and the ability to maintain stable PEEP/CPAP.<\/p><p>Common problems: noise, neck discomfort, large internal volume, asynchronies, need for adequate flow, and difficult rapid access to the face.<\/p><p>What to check immediately: flow, noise, comfort, fixation, synchrony, CO2 rebreathing if the system is inadequate, and ability to communicate.<\/p><h4>HFNC as both interface and support<\/h4><p>HFNC is both an interface and a support modality and is generally very well tolerated: compared with masks, it facilitates speaking, eating in selected cases, secretion clearance, and communication [5,6]. In de novo hypoxemic respiratory failure, however, good interface tolerance must not lead clinicians to underestimate persistent high respiratory drive or excessive tidal volumes during a non-invasive trial [7].<\/p><p>Strengths: comfort, humidification, stable FiO2, dead-space washout, and less claustrophobia.<\/p><p>Common problems: variable positive-pressure effect, risk of underestimating failure, and dryness or discomfort if flow or temperature are poorly tolerated.<\/p><p>What to monitor: respiratory rate, SpO2/FiO2, ROX index, comfort, work of breathing, and LUS in hypoxemic respiratory failure [8].<\/p><h4>Single-limb and dual-limb circuits<\/h4><p>In a single-limb circuit, inspiration and expiration use the same tubing. CO2 elimination depends on a calibrated intentional leak or an expiratory valve. This circuit is simple and widely used in NIV, but requires attention to leaks, rebreathing, triggering, and ventilator compensation.<\/p><p>In a dual-limb circuit, inspiration and expiration are separated. This generally allows more reliable measurement of exhaled volumes and more controlled management of expiratory flow, but does not automatically make support better: compatibility between ventilator, circuit, interface, and patient is what matters. When comparing different ventilators, single- versus dual-limb circuits may explain performance differences, particularly in the presence of large leaks.<\/p><h4>Interface-related problems during the non-invasive trial<\/h4><p>Patient–ventilator asynchronies are among the most common practical causes of NIV-PS failure. They do not always mean that support is “too low”; they often indicate excessive leaks, an inappropriate interface, poorly adjusted trigger settings, cycling that does not match the patient’s mechanics, auto-PEEP, or discomfort. These problems should be identified and corrected before increasing pressure levels [9-13].<\/p><p>In practice, asynchrony should be interpreted throughout the respiratory cycle. At the start of inspiration, determine whether the ventilator recognizes the patient’s effort and identify possible trigger asynchronies. During inspiration, determine whether delivered flow meets ventilatory demand and identify possible flow asynchrony. At the end of inspiration, determine whether the ventilator stops assistance when the patient wants to exhale and identify possible cycling asynchronies. Figure 4.2 summarizes the main NIV asynchronies and links waveform findings to the first practical correction.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_20.png\" alt=\"English teaching figure 20\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_20.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 4.2. Patient–ventilator asynchronies during NIV: trigger, flow, and cycling. The figure summarizes the main types of asynchrony, their waveform signs, common causes, and initial practical corrections.<\/p><p>Trigger asynchronies<\/p><p>Delayed triggering: the patient begins to inspire, but the ventilator delivers support late. On the flow or pressure waveform, an initial effort is seen that is not immediately followed by an assisted breath. Common causes include an insensitive trigger, auto-PEEP, reduced respiratory drive, weak effort, or ventilator/circuit characteristics. During NIV, leaks, interface fit, trigger settings, and possible hyperinflation should be checked first.<\/p><p>Ineffective effort: the patient generates an inspiratory effort that fails to trigger the ventilator. Waveforms show small deflections or changes in the slope of expiratory flow that are not followed by a mechanical breath. This is common in obstructive patients with auto-PEEP, in weak patients, or when excessive pressure support suppresses respiratory drive. Correction requires reassessment of trigger sensitivity, EPAP, expiratory time, pressure support, leaks, and any sedative effect.<\/p><p>Auto-triggering: the ventilator delivers breaths that were not requested by the patient. During NIV this is often related to leaks, an overly sensitive trigger, water or secretions in the circuit, cardiac oscillations, or automatic ventilator compensation. The practical sign is a mechanical breath without a true initial deflection consistent with inspiratory effort. Correction starts with optimizing the interface and reducing leaks, followed by adjustment of trigger sensitivity.<\/p><p>Flow asynchrony<\/p><p>Flow asynchrony occurs when delivered flow does not meet the patient’s demand. Clinically, the patient may appear air hungry, dyspneic, tachypneic, agitated, or continue to recruit accessory muscles. Waveforms may show concavity or deformation during pressurization. Common causes include high respiratory drive, rise time that is too slow, insufficient pressure support, or an inappropriate mode. Correction is not automatic: it may require a faster rise time, adjustment of pressure support, improved comfort and interface fit, or recognition that the non-invasive trial itself is inappropriate.<\/p><p>Cycling asynchronies<\/p><p>Double triggering: two mechanical breaths are delivered during a single inspiratory effort. It is often related to premature cycling, insufficient pressure support, an inspiratory time that is too short, or high respiratory drive. It is important because it may increase total tidal volume and worsen comfort.<\/p><p>Premature cycling: the ventilator ends assistance before the patient’s inspiratory effort has finished. The patient may continue to inspire, trigger a second breath, or remain dyspneic. During pressure support, this may result from a cycling threshold that is too high, insufficient pressure support, or an inspiratory time that is too short. Extending assistance by lowering the cycling threshold may help, while monitoring volumes, leaks, and comfort.<\/p><p>Delayed cycling: the ventilator continues insufflation when the patient already wants to exhale. This is common with leaks, high pressure support, a cycling threshold that is too low, or an inappropriate rise time. In obstructive patients, it may shorten expiratory time and promote dynamic hyperinflation. Correction includes reducing leaks, lowering excessive pressure support, and cycling earlier.<\/p><h4>Extrapulmonary complications of poorly adjusted NIV<\/h4><p>Gastric distension<\/p><p>Gastric distension is often underestimated. It can worsen comfort, nausea, vomiting risk, aspiration risk, and diaphragmatic mechanics. It is more likely with high pressures, major leaks, poor patient–ventilator coordination, and low tolerance.<\/p><p>Practical signs:<\/p><p>nausea;<\/p><p>abdominal bloating;<\/p><p>belching;<\/p><p>abdominal pain or tension;<\/p><p>worsening comfort;<\/p><p>reduced mask tolerance.<\/p><p>What to do: reassess pressures, interface, leaks, scheduled breaks, and patient position and, when indicated, consider gastric decompression. In selected cases, gastric ultrasound may also be useful, particularly when the clinical picture is unclear.<\/p><p>Skin injury and comfort<\/p><p>Effective NIV that is not tolerated is not effective NIV. Comfort should be treated as a clinical parameter. Pain, claustrophobia, noise, dryness, facial pressure, and inability to communicate can turn technically correct treatment into failure.<\/p><p>Skin lesions most often develop over the nasal bridge, cheekbones, and other pressure points. They should be prevented through correct interface selection, skin protection, frequent checks, and alternating interfaces when possible.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_21.png\" alt=\"English teaching figure 21\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_21.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 4.3. Early problems: what to suspect and what to correct. Leaks, discomfort, asynchronies, gastric distension, skin injury, and dryness/secretions should be actively assessed during the early phase of a non-invasive trial.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to interpret NIV failure simply as “insufficient pressure.” Very often the problem is the interface, excessive leak, asynchrony, discomfort, or an inappropriate indication.<\/p><p>Before increasing pressures, ask whether support is actually reaching the patient and whether the patient is tolerating it.<\/p><h4>References for Chapter 4<\/h4><p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p><p>2. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319.<\/p><p>3. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p><p>4. Patel BK, Wolfe KS, Pohlman AS, Hall JB, Kress JP. Effect of noninvasive ventilation delivered by helmet vs face mask on the rate of endotracheal intubation in patients with acute respiratory distress syndrome: a randomized clinical trial. JAMA. 2016;315(22):2435-2441. doi:10.1001/jama.2016.6338.<\/p><p>5. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p><p>6. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.<\/p><p>7. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p><p>8. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>9. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p><p>10. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, Brochard L. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.<\/p><p>11. Dres M, Rittayamai N, Brochard L. Monitoring patient-ventilator asynchrony. Curr Opin Crit Care. 2016;22(3):246-253. doi:10.1097/MCC.0000000000000307.<\/p><p>12. Holanda MA, Vasconcelos Rdos S, Ferreira JC, Pinheiro BV. Patient-ventilator asynchrony. J Bras Pneumol. 2018;44(4):321-333. doi:10.1590/S1806-37562017000000185.<\/p><p>13. Arnal JM. Monitoring Mechanical Ventilation Using Ventilator Waveforms. Cham: Springer International Publishing; 2018. ISBN:9783319586540.<\/p>", "plain": " Practical objective  NIV is not just about pressures. It is a system made up of the patient, ventilator, circuit, and interface. Even correct settings may fail if the mask leaks, the helmet is poorly managed, the patient is claustrophobic, the trigger fails to detect effort, cycling is delayed, skin injury develops, or gastric distension makes support intolerable.  This chapter has a very practical objective: to select the most appropriate interface, rapidly recognize tolerance problems, and determine when a non-invasive trial is no longer safe.  The central message is simple: NIV works only if support is actually delivered to the patient and is tolerated long enough to produce a clinical effect.  When not to start or when to stop NIV: practical contraindications  Interface selection must be preceded by a safety assessment. NIV requires a patient who can be closely observed, reassessed promptly, and is sufficiently cooperative to tolerate the device without compromising airway protection, secretion management, or timely escalation. If these conditions are not met, the clinical problem is not simply NIV failure, but the risk of delaying a more appropriate treatment [1-3].  Conditions incompatible with a prolonged non-invasive trial include respiratory arrest or gasping, unstabilized shock, uncontrolled hemodynamic instability, inability to protect the airway, active vomiting or high aspiration risk, copious unmanageable secretions, clinically significant hemoptysis, facial trauma or recent surgery preventing a secure interface seal, clinically relevant undrained pneumothorax, and persistent patient refusal.  Agitation, claustrophobia, limited cooperation, fluctuating mental status, severe dyssynchrony, major skin lesions, recent esophagogastric surgery, marked pain, or gastric distension are not always absolute contraindications, but they require a short, closely monitored trial with a predefined objective and explicit stopping criteria.  Operationally, NIV must not become an indefinite trial when airway protection, secretion management, rapid correction of interface problems, continuous monitoring, and early reassessment cannot be guaranteed. In such situations, the priority is to define an alternative strategy rather than progressively increasing pressures in an attempt to compensate for an unsafe setting.  The interface is part of the therapy  The interface is not an accessory. Together with the circuit, it is the connection between ventilator and patient. It determines the pressures actually delivered, leaks, comfort, synchrony, risk of skin injury, and the patient’s ability to speak, cough, eat, or communicate.  An oronasal mask can be rapid and effective in acute care, but may cause claustrophobia, nasal-bridge pain, and major leaks. A helmet can be very useful for prolonged treatment and hypoxemia, but requires attention to flow, noise, internal volume, and asynchronies. HFNC is often very well tolerated but does not provide the same positive pressure as CPAP or a full-face mask. A nasal mask may be suitable for chronic or nocturnal support but is less appropriate in severe acute respiratory failure.      Download image     Figure 4.1. Interfaces: practical selection and main limitations. Interfaces are not equivalent. Selection should take into account the respiratory problem, urgency, comfort, expected duration of treatment, leak risk, and need for stable positive pressure.  Oronasal mask  This is the most commonly used interface in acute NIV. It covers the nose and mouth, allows rapid delivery of effective pressure, and is suitable for most patients with hypercapnic respiratory failure or respiratory muscle fatigue.  Strengths: availability, rapid application, effective pressure delivery, and ease of use.  Common problems: claustrophobia, pain, nasal-bridge lesions, leaks toward the eyes, dryness, and difficulty speaking or clearing secretions.  What to check immediately: adequate seal without excessive compression, comfort, eye irritation, synchrony, need for short breaks, and skin protection.  Full-face mask  A full-face mask covers the entire face. It can be useful when an oronasal mask causes difficult-to-correct leaks or localized skin lesions. It distributes pressure over a larger surface and may improve tolerance in some patients.  Strengths: better pressure distribution; useful when a conventional mask causes pressure lesions or leaks.  Common problems: larger internal volume, possible sense of isolation, leak management, and the need for experienced nursing and medical staff.  What to check immediately: comfort, lateral leaks, synchrony, and any increase in perceived dead space.  Helmet  The helmet allows CPAP or NIV to be delivered without direct contact with the nasal bridge and cheeks. It can be useful for prolonged treatment, in hypoxemic patients, and when reducing facial pressure injury is a priority. The helmet has also been studied in hypoxemic respiratory failure and ARDS, with favorable results in some trials, but it requires an appropriate setup and experienced staff [4].  Strengths: better tolerance during prolonged treatment, fewer facial lesions, and the ability to maintain stable PEEP/CPAP.  Common problems: noise, neck discomfort, large internal volume, asynchronies, need for adequate flow, and difficult rapid access to the face.  What to check immediately: flow, noise, comfort, fixation, synchrony, CO2 rebreathing if the system is inadequate, and ability to communicate.  HFNC as both interface and support  HFNC is both an interface and a support modality and is generally very well tolerated: compared with masks, it facilitates speaking, eating in selected cases, secretion clearance, and communication [5,6]. In de novo hypoxemic respiratory failure, however, good interface tolerance must not lead clinicians to underestimate persistent high respiratory drive or excessive tidal volumes during a non-invasive trial [7].  Strengths: comfort, humidification, stable FiO2, dead-space washout, and less claustrophobia.  Common problems: variable positive-pressure effect, risk of underestimating failure, and dryness or discomfort if flow or temperature are poorly tolerated.  What to monitor: respiratory rate, SpO2/FiO2, ROX index, comfort, work of breathing, and LUS in hypoxemic respiratory failure [8].  Single-limb and dual-limb circuits  In a single-limb circuit, inspiration and expiration use the same tubing. CO2 elimination depends on a calibrated intentional leak or an expiratory valve. This circuit is simple and widely used in NIV, but requires attention to leaks, rebreathing, triggering, and ventilator compensation.  In a dual-limb circuit, inspiration and expiration are separated. This generally allows more reliable measurement of exhaled volumes and more controlled management of expiratory flow, but does not automatically make support better: compatibility between ventilator, circuit, interface, and patient is what matters. When comparing different ventilators, single- versus dual-limb circuits may explain performance differences, particularly in the presence of large leaks.  Interface-related problems during the non-invasive trial  Patient–ventilator asynchronies are among the most common practical causes of NIV-PS failure. They do not always mean that support is “too low”; they often indicate excessive leaks, an inappropriate interface, poorly adjusted trigger settings, cycling that does not match the patient’s mechanics, auto-PEEP, or discomfort. These problems should be identified and corrected before increasing pressure levels [9-13].  In practice, asynchrony should be interpreted throughout the respiratory cycle. At the start of inspiration, determine whether the ventilator recognizes the patient’s effort and identify possible trigger asynchronies. During inspiration, determine whether delivered flow meets ventilatory demand and identify possible flow asynchrony. At the end of inspiration, determine whether the ventilator stops assistance when the patient wants to exhale and identify possible cycling asynchronies. Figure 4.2 summarizes the main NIV asynchronies and links waveform findings to the first practical correction.      Download image     Figure 4.2. Patient–ventilator asynchronies during NIV: trigger, flow, and cycling. The figure summarizes the main types of asynchrony, their waveform signs, common causes, and initial practical corrections.  Trigger asynchronies  Delayed triggering: the patient begins to inspire, but the ventilator delivers support late. On the flow or pressure waveform, an initial effort is seen that is not immediately followed by an assisted breath. Common causes include an insensitive trigger, auto-PEEP, reduced respiratory drive, weak effort, or ventilator/circuit characteristics. During NIV, leaks, interface fit, trigger settings, and possible hyperinflation should be checked first.  Ineffective effort: the patient generates an inspiratory effort that fails to trigger the ventilator. Waveforms show small deflections or changes in the slope of expiratory flow that are not followed by a mechanical breath. This is common in obstructive patients with auto-PEEP, in weak patients, or when excessive pressure support suppresses respiratory drive. Correction requires reassessment of trigger sensitivity, EPAP, expiratory time, pressure support, leaks, and any sedative effect.  Auto-triggering: the ventilator delivers breaths that were not requested by the patient. During NIV this is often related to leaks, an overly sensitive trigger, water or secretions in the circuit, cardiac oscillations, or automatic ventilator compensation. The practical sign is a mechanical breath without a true initial deflection consistent with inspiratory effort. Correction starts with optimizing the interface and reducing leaks, followed by adjustment of trigger sensitivity.  Flow asynchrony  Flow asynchrony occurs when delivered flow does not meet the patient’s demand. Clinically, the patient may appear air hungry, dyspneic, tachypneic, agitated, or continue to recruit accessory muscles. Waveforms may show concavity or deformation during pressurization. Common causes include high respiratory drive, rise time that is too slow, insufficient pressure support, or an inappropriate mode. Correction is not automatic: it may require a faster rise time, adjustment of pressure support, improved comfort and interface fit, or recognition that the non-invasive trial itself is inappropriate.  Cycling asynchronies  Double triggering: two mechanical breaths are delivered during a single inspiratory effort. It is often related to premature cycling, insufficient pressure support, an inspiratory time that is too short, or high respiratory drive. It is important because it may increase total tidal volume and worsen comfort.  Premature cycling: the ventilator ends assistance before the patient’s inspiratory effort has finished. The patient may continue to inspire, trigger a second breath, or remain dyspneic. During pressure support, this may result from a cycling threshold that is too high, insufficient pressure support, or an inspiratory time that is too short. Extending assistance by lowering the cycling threshold may help, while monitoring volumes, leaks, and comfort.  Delayed cycling: the ventilator continues insufflation when the patient already wants to exhale. This is common with leaks, high pressure support, a cycling threshold that is too low, or an inappropriate rise time. In obstructive patients, it may shorten expiratory time and promote dynamic hyperinflation. Correction includes reducing leaks, lowering excessive pressure support, and cycling earlier.  Extrapulmonary complications of poorly adjusted NIV  Gastric distension  Gastric distension is often underestimated. It can worsen comfort, nausea, vomiting risk, aspiration risk, and diaphragmatic mechanics. It is more likely with high pressures, major leaks, poor patient–ventilator coordination, and low tolerance.  Practical signs:  nausea;  abdominal bloating;  belching;  abdominal pain or tension;  worsening comfort;  reduced mask tolerance.  What to do: reassess pressures, interface, leaks, scheduled breaks, and patient position and, when indicated, consider gastric decompression. In selected cases, gastric ultrasound may also be useful, particularly when the clinical picture is unclear.  Skin injury and comfort  Effective NIV that is not tolerated is not effective NIV. Comfort should be treated as a clinical parameter. Pain, claustrophobia, noise, dryness, facial pressure, and inability to communicate can turn technically correct treatment into failure.  Skin lesions most often develop over the nasal bridge, cheekbones, and other pressure points. They should be prevented through correct interface selection, skin protection, frequent checks, and alternating interfaces when possible.      Download image     Figure 4.3. Early problems: what to suspect and what to correct. Leaks, discomfort, asynchronies, gastric distension, skin injury, and dryness/secretions should be actively assessed during the early phase of a non-invasive trial.  Pitfall to avoid  The most common error is to interpret NIV failure simply as “insufficient pressure.” Very often the problem is the interface, excessive leak, asynchrony, discomfort, or an inappropriate indication.  Before increasing pressures, ask whether support is actually reaching the patient and whether the patient is tolerating it.  References for Chapter 4  1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  2. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319.  3. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.  4. Patel BK, Wolfe KS, Pohlman AS, Hall JB, Kress JP. Effect of noninvasive ventilation delivered by helmet vs face mask on the rate of endotracheal intubation in patients with acute respiratory distress syndrome: a randomized clinical trial. JAMA. 2016;315(22):2435-2441. doi:10.1001/jama.2016.6338.  5. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.  6. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.  7. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.  8. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.  9. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.  10. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, Brochard L. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.  11. Dres M, Rittayamai N, Brochard L. Monitoring patient-ventilator asynchrony. Curr Opin Crit Care. 2016;22(3):246-253. doi:10.1097/MCC.0000000000000307.  12. Holanda MA, Vasconcelos Rdos S, Ferreira JC, Pinheiro BV. Patient-ventilator asynchrony. J Bras Pneumol. 2018;44(4):321-333. doi:10.1590/S1806-37562017000000185.  13. Arnal JM. Monitoring Mechanical Ventilation Using Ventilator Waveforms. Cham: Springer International Publishing; 2018. ISBN:9783319586540. "}, {"part": "Part II — Ultrasound Applied to NIV: the AdET Method", "title": "Chapter 5. What the Probe Shows, What It Means, What It Changes", "tag": "Ch. 5", "html": "<h4>Practical objective<\/h4><p>This chapter introduces the AdET approach, developed within the Accademia di Ecografia Toracica, and applies it to the management of non-invasive ventilation. In this manual, AdET is not presented as an alternative score or as a simple classification of ultrasound signs, but as a pathway for clinical interpretation: the ultrasound finding must be described, contextualized, and translated into a decision about respiratory support [1,2].<\/p><p>The guiding sequence is:<\/p><p>what the probe shows → what it means → what changes in NIV.<\/p><p>This approach avoids two common errors. The first is describing ultrasound signs without translating them into a clinical choice. The second is using ultrasound as an isolated score, without considering distribution, pattern quality, clinical context, and change over time.<\/p><p>Figure 5.1. The ADET method applied to NIV. Each ultrasound finding must be linked to a pathophysiological interpretation and a practical decision about respiratory support.<\/p><h4>AdET as a framework: what it adds to conventional LUS<\/h4><p>In this manual, AdET is not used simply as a label for the Accademia di Ecografia Toracica, but as an operational framework. It does not replace validated LUS protocols and is not intended as an alternative score. Its purpose is to transform an ultrasound finding into a decision about respiratory support.<\/p><p>The operational pathway can be summarized in four steps: describe the sign reproducibly; interpret it by considering image physics, distribution, and possible acoustic traps; assign it to a pathophysiological phenotype; and determine whether the finding changes the support modality, settings, patient position, causal treatment, intensity of monitoring, or threshold for escalation.<\/p><p>Compared with approaches that use lung ultrasound mainly for diagnosis or quantification, AdET emphasizes the management consequence of the finding. The aim is not merely to recognize vertical artifacts, consolidations, lung sliding, or pleural effusion, but to determine whether these findings make HFNC, CPAP, NIV-PS, a change in EPAP/PEEP, repositioning, causal treatment, or termination of the non-invasive trial more appropriate [3-5].<\/p><p>The concept of an “acoustic trap” arises from this perspective. Vertical artifacts are not viewed simply as lines to be counted, but as acoustic effects generated by the interaction between ultrasound, air, fluid, tissue, and subpleural geometry. In the AdET method, therefore, distribution, pleural-line regularity, coalescence, attenuation, spared areas, and consolidations matter as much as the number of artifacts.<\/p><h4>The probe does not replace clinical reasoning<\/h4><p>The probe shows the accessible pleuropulmonary surface, the presence or absence of lung sliding, pleural-line characteristics, vertical artifacts, consolidations, pleural effusions and, through dedicated windows, the diaphragm and heart. These data are immediate, repeatable, and available at the bedside [3-5].<\/p><p>The limitation is equally important: ultrasound does not visualize the entire lung. It visualizes what reaches the pleura or alters the peripheral acoustic interface. Findings must therefore always be interpreted together with clinical status, ABG, ventilator data, and changes over time [3,4].<\/p><p>Practical questions:<\/p><p>is there a target for CPAP or EPAP?<\/p><p>is the problem predominantly pulmonary or muscular?<\/p><p>is the diaphragm working too much or too little?<\/p><p>is the support producing reaeration?<\/p><p>is the improvement in SpO2 real or merely apparent?<\/p><p>am I prolonging a non-invasive trial without a response?<\/p><h4>Vertical artifacts are not simply “B-lines”<\/h4><p>Within the AdET approach, vertical artifacts should not be treated as lines to be counted. They provide information about the peripheral lung surface and the acoustic geometry of the subpleural parenchyma. The term “B-lines” remains useful because it is widely used, but it becomes reductive if it leads clinicians to ignore distribution, pleural-line characteristics, coalescence, spared areas, consolidations, and clinical context [1,2].<\/p><p>In this manual we use the practical term “vertical artifacts,” retaining the term B-lines when needed. The ultrasound examination should always describe:<\/p><p>distribution: focal, diffuse, homogeneous, or heterogeneous;<\/p><p>pleural-line characteristics: regular or irregular;<\/p><p>presence of spared areas;<\/p><p>presence of subpleural consolidations;<\/p><p>lung sliding: preserved or absent;<\/p><p>response after changes in support, position, or treatment.<\/p><p>Acoustic traps: why vertical artifacts should not simply be counted<\/p><p>In the AdET position on vertical artifacts, the concept of the acoustic trap helps explain why artifact appearance depends on the tissue-to-air ratio in the subpleural region, the geometry of peripheral air spaces, the content of the trap, and imaging settings. Not all vertical lines have the same meaning. Ultrasound waves may enter small channels or “acoustic microholes” between highly reflective interfaces and become trapped, generating vertical signals that differ in brightness, attenuation, and regularity.<\/p><p>Bright, regular, diffuse vertical artifacts associated with a smooth pleural line suggest a more orderly pattern. Heterogeneous, attenuated, patchy artifacts associated with an irregular pleura and consolidations suggest more disorganized peripheral structural disruption.<\/p><h4>LUS score: useful, but not sufficient by itself<\/h4><p>The LUS score converts loss of aeration into a numerical value. In its most widely used form, each examined region receives a score from 0 to 3 [3,5,6]:<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Score<\/p><\/th><th><p>Practical finding<\/p><\/th><th><p>General meaning<\/p><\/th><\/tr><tr><td><p>0<\/p><\/td><td><p>A-pattern, lung sliding present<\/p><\/td><td><p>preserved aeration<\/p><\/td><\/tr><tr><td><p>1<\/p><\/td><td><p>limited vertical artifacts<\/p><\/td><td><p>mild loss of aeration<\/p><\/td><\/tr><tr><td><p>2<\/p><\/td><td><p>confluent or extensive vertical artifacts<\/p><\/td><td><p>severe loss of aeration<\/p><\/td><\/tr><tr><td><p>3<\/p><\/td><td><p>consolidation<\/p><\/td><td><p>non-aerated/deaerated lung<\/p><\/td><\/tr><\/table><\/div><p>Table 5.1. LUS score: grading loss of aeration.<\/p><p>The value of the LUS score lies not only in the absolute number but especially in its change over time. Improvement after CPAP/EPAP, prone positioning, sitting, physiotherapy, or diuretic treatment suggests that the intervention is favorably modifying the target. An unchanged LUS despite increasing pressures suggests poor recruitability or a mechanism that cannot be corrected by increasing ventilatory pressure [6].<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_22.png\" alt=\"English teaching figure 22\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_22.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 5.2. Ultrasound examples: LUS score 0–3. Teaching examples of progressive ultrasound patterns: aerated lung, mild loss of aeration, severe loss of aeration, and consolidation. The score should always be interpreted together with distribution, pleural-line characteristics, and clinical context. Images adapted from the author’s ADET teaching material.<\/p><p>Order and disorder: the qualitative component of LUS<\/p><p>Two patients may have the same LUS score but very different pathophysiology. The score must therefore be complemented by qualitative interpretation.<\/p><p>An orderly pattern is relatively homogeneous, bilateral, and symmetric, with a preserved or only mildly altered pleural line. In a consistent clinical context, it may suggest cardiogenic congestion or increased extravascular lung water. In this setting, CPAP/EPAP and medical therapy may have a clear target.<\/p><p>A disorganized pattern is irregular and patchy, with spared areas, a fragmented pleura, subpleural consolidations, and non-uniform distribution. This pattern points toward pneumonia, an ARDS-like process, trauma, inflammatory lung disease, or heterogeneous loss of aeration. NIV should be used cautiously because the risk is not only hypoxemia but also persistence of high respiratory drive in a heterogeneous lung, with the potential to amplify lung injury.<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Practical message. The LUS score indicates “how much” of the lung appears abnormal. Pattern quality helps determine “what type” of problem is being treated.<\/p><\/th><\/tr><\/table><\/div><p>Consolidation: saying “score 3” is not enough<\/p><p>Consolidation is one of the most important findings because it changes the target of NIV. A consolidated area may represent pneumonia, atelectasis, compression by pleural effusion, bronchial obstruction, secretions, or a combination of these mechanisms; each requires a specific treatment.<\/p><p>When faced with a consolidation, therefore, the question is not simply “how much PEEP is needed?” First ask:<\/p><p>is the air bronchogram dynamic or static?<\/p><p>are there signs of fluid-filled bronchi?<\/p><p>is the consolidation dependent and potentially recruitable?<\/p><p>is there a compressive pleural effusion?<\/p><p>does the patient have unmanageable secretions?<\/p><p>A dynamic air bronchogram suggests air moving through patent airways. A static air bronchogram suggests trapped air and possible obstructive or resorption atelectasis. A fluid bronchogram suggests airways filled with fluid or secretions, often within obstructive consolidations. These distinctions have practical consequences: positive pressure can help only when recruitability is present, but it cannot by itself resolve obstruction of a bronchus that is blocked or filled with secretions [7].<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_23.png\" alt=\"English teaching figure 23\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_23.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 5.3. Consolidation: ultrasound images and operational meaning. Static and dynamic air bronchograms, together with C-lines, the shred sign, and tissue-like hepatization, help interpret consolidation and estimate the expected role of positive pressure. Ultrasound images are taken from material provided by the author and arranged for teaching purposes.<\/p><h4>From ultrasound finding to ventilatory decision<\/h4><p>Applying the AdET method to NIV requires immediate translation of the ultrasound finding into a management decision.<\/p><p>A predominant A-pattern in a hypercapnic patient points more strongly toward a respiratory muscle problem than a recruitment problem. In this situation, NIV-PS has a stronger rationale than CPAP alone, and diaphragm ultrasound may be more informative than counting vertical artifacts.<\/p><p>Diffuse, orderly vertical artifacts in a patient with a clinically consistent cardiogenic picture support the use of CPAP/EPAP and decongestive therapy. The expected response is a reduction in artifacts and improved aeration over time.<\/p><p>A disorganized pattern with an irregular pleura and consolidations requires caution: non-invasive support should be attempted only if the patient is stable, cooperative, and can be reassessed rapidly. If respiratory drive remains high and the LUS score worsens, the trial should not be prolonged.<\/p><p>A significant pleural effusion or suspected pneumothorax completely changes the strategy. Before increasing pressures or persisting with NIV, the finding should be clarified and the underlying cause treated when indicated.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_24.png\" alt=\"English teaching figure 24\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_24.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 5.4. From ultrasound finding to ventilatory choice. Operational summary of the transition from ultrasound findings to decisions about non-invasive respiratory support.<\/p><h4>Timing of ultrasound in the NIV pathway<\/h4><p>Ultrasound can be used effectively at three time points.<\/p><p>Before starting support, it helps define the phenotype: aerated/hyperinflated lung, congested lung, disorganized lung, consolidated lung, lung compressed by pleural effusion, lung complicated by pneumothorax, or respiratory muscle dysfunction.<\/p><p>A few minutes after starting support, during setting optimization, it helps determine whether the chosen or modified parameter has reached its target: EPAP/CPAP for loss of aeration or congestion; pressure support for work of breathing and alveolar ventilation; positioning for dependent atelectasis; interface adjustment when the problem is technical.<\/p><p>During reassessment, ultrasound helps distinguish a true response from an apparent one. SpO2 may improve even while the lung remains heterogeneous and the diaphragm continues to work excessively. Serial LUS and respiratory muscle assessment help determine whether to continue, modify, or stop the trial.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to stop at description of the ultrasound sign: “there are B-lines,” “there is consolidation,” or “the LUS is high.” That is not enough. The next question must be: what changes in management?<\/p><p>An ultrasound finding that does not change diagnosis, settings, monitoring, or the threshold for escalation remains incomplete information.<\/p><h4>References for Chapter 5<\/h4><p>1. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116.<\/p><p>2. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397.<\/p><p>3. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>4. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p><p>5. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p><p>6. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC.<\/p><p>7. Lichtenstein D, Mezière G, Seitz J. The dynamic air bronchogram: a lung ultrasound sign of alveolar consolidation ruling out atelectasis. Chest. 2009;135(6):1421-1425. doi:10.1378/chest.08-2281.<\/p>", "plain": " Practical objective  This chapter introduces the AdET approach, developed within the Accademia di Ecografia Toracica, and applies it to the management of non-invasive ventilation. In this manual, AdET is not presented as an alternative score or as a simple classification of ultrasound signs, but as a pathway for clinical interpretation: the ultrasound finding must be described, contextualized, and translated into a decision about respiratory support [1,2].  The guiding sequence is:  what the probe shows → what it means → what changes in NIV.  This approach avoids two common errors. The first is describing ultrasound signs without translating them into a clinical choice. The second is using ultrasound as an isolated score, without considering distribution, pattern quality, clinical context, and change over time.  Figure 5.1. The ADET method applied to NIV. Each ultrasound finding must be linked to a pathophysiological interpretation and a practical decision about respiratory support.  AdET as a framework: what it adds to conventional LUS  In this manual, AdET is not used simply as a label for the Accademia di Ecografia Toracica, but as an operational framework. It does not replace validated LUS protocols and is not intended as an alternative score. Its purpose is to transform an ultrasound finding into a decision about respiratory support.  The operational pathway can be summarized in four steps: describe the sign reproducibly; interpret it by considering image physics, distribution, and possible acoustic traps; assign it to a pathophysiological phenotype; and determine whether the finding changes the support modality, settings, patient position, causal treatment, intensity of monitoring, or threshold for escalation.  Compared with approaches that use lung ultrasound mainly for diagnosis or quantification, AdET emphasizes the management consequence of the finding. The aim is not merely to recognize vertical artifacts, consolidations, lung sliding, or pleural effusion, but to determine whether these findings make HFNC, CPAP, NIV-PS, a change in EPAP/PEEP, repositioning, causal treatment, or termination of the non-invasive trial more appropriate [3-5].  The concept of an “acoustic trap” arises from this perspective. Vertical artifacts are not viewed simply as lines to be counted, but as acoustic effects generated by the interaction between ultrasound, air, fluid, tissue, and subpleural geometry. In the AdET method, therefore, distribution, pleural-line regularity, coalescence, attenuation, spared areas, and consolidations matter as much as the number of artifacts.  The probe does not replace clinical reasoning  The probe shows the accessible pleuropulmonary surface, the presence or absence of lung sliding, pleural-line characteristics, vertical artifacts, consolidations, pleural effusions and, through dedicated windows, the diaphragm and heart. These data are immediate, repeatable, and available at the bedside [3-5].  The limitation is equally important: ultrasound does not visualize the entire lung. It visualizes what reaches the pleura or alters the peripheral acoustic interface. Findings must therefore always be interpreted together with clinical status, ABG, ventilator data, and changes over time [3,4].  Practical questions:  is there a target for CPAP or EPAP?  is the problem predominantly pulmonary or muscular?  is the diaphragm working too much or too little?  is the support producing reaeration?  is the improvement in SpO2 real or merely apparent?  am I prolonging a non-invasive trial without a response?  Vertical artifacts are not simply “B-lines”  Within the AdET approach, vertical artifacts should not be treated as lines to be counted. They provide information about the peripheral lung surface and the acoustic geometry of the subpleural parenchyma. The term “B-lines” remains useful because it is widely used, but it becomes reductive if it leads clinicians to ignore distribution, pleural-line characteristics, coalescence, spared areas, consolidations, and clinical context [1,2].  In this manual we use the practical term “vertical artifacts,” retaining the term B-lines when needed. The ultrasound examination should always describe:  distribution: focal, diffuse, homogeneous, or heterogeneous;  pleural-line characteristics: regular or irregular;  presence of spared areas;  presence of subpleural consolidations;  lung sliding: preserved or absent;  response after changes in support, position, or treatment.  Acoustic traps: why vertical artifacts should not simply be counted  In the AdET position on vertical artifacts, the concept of the acoustic trap helps explain why artifact appearance depends on the tissue-to-air ratio in the subpleural region, the geometry of peripheral air spaces, the content of the trap, and imaging settings. Not all vertical lines have the same meaning. Ultrasound waves may enter small channels or “acoustic microholes” between highly reflective interfaces and become trapped, generating vertical signals that differ in brightness, attenuation, and regularity.  Bright, regular, diffuse vertical artifacts associated with a smooth pleural line suggest a more orderly pattern. Heterogeneous, attenuated, patchy artifacts associated with an irregular pleura and consolidations suggest more disorganized peripheral structural disruption.  LUS score: useful, but not sufficient by itself  The LUS score converts loss of aeration into a numerical value. In its most widely used form, each examined region receives a score from 0 to 3 [3,5,6]:      Score    Practical finding    General meaning      0    A-pattern, lung sliding present    preserved aeration      1    limited vertical artifacts    mild loss of aeration      2    confluent or extensive vertical artifacts    severe loss of aeration      3    consolidation    non-aerated/deaerated lung      Table 5.1. LUS score: grading loss of aeration.  The value of the LUS score lies not only in the absolute number but especially in its change over time. Improvement after CPAP/EPAP, prone positioning, sitting, physiotherapy, or diuretic treatment suggests that the intervention is favorably modifying the target. An unchanged LUS despite increasing pressures suggests poor recruitability or a mechanism that cannot be corrected by increasing ventilatory pressure [6].      Download image     Figure 5.2. Ultrasound examples: LUS score 0–3. Teaching examples of progressive ultrasound patterns: aerated lung, mild loss of aeration, severe loss of aeration, and consolidation. The score should always be interpreted together with distribution, pleural-line characteristics, and clinical context. Images adapted from the author’s ADET teaching material.  Order and disorder: the qualitative component of LUS  Two patients may have the same LUS score but very different pathophysiology. The score must therefore be complemented by qualitative interpretation.  An orderly pattern is relatively homogeneous, bilateral, and symmetric, with a preserved or only mildly altered pleural line. In a consistent clinical context, it may suggest cardiogenic congestion or increased extravascular lung water. In this setting, CPAP/EPAP and medical therapy may have a clear target.  A disorganized pattern is irregular and patchy, with spared areas, a fragmented pleura, subpleural consolidations, and non-uniform distribution. This pattern points toward pneumonia, an ARDS-like process, trauma, inflammatory lung disease, or heterogeneous loss of aeration. NIV should be used cautiously because the risk is not only hypoxemia but also persistence of high respiratory drive in a heterogeneous lung, with the potential to amplify lung injury.      Practical message. The LUS score indicates “how much” of the lung appears abnormal. Pattern quality helps determine “what type” of problem is being treated.      Consolidation: saying “score 3” is not enough  Consolidation is one of the most important findings because it changes the target of NIV. A consolidated area may represent pneumonia, atelectasis, compression by pleural effusion, bronchial obstruction, secretions, or a combination of these mechanisms; each requires a specific treatment.  When faced with a consolidation, therefore, the question is not simply “how much PEEP is needed?” First ask:  is the air bronchogram dynamic or static?  are there signs of fluid-filled bronchi?  is the consolidation dependent and potentially recruitable?  is there a compressive pleural effusion?  does the patient have unmanageable secretions?  A dynamic air bronchogram suggests air moving through patent airways. A static air bronchogram suggests trapped air and possible obstructive or resorption atelectasis. A fluid bronchogram suggests airways filled with fluid or secretions, often within obstructive consolidations. These distinctions have practical consequences: positive pressure can help only when recruitability is present, but it cannot by itself resolve obstruction of a bronchus that is blocked or filled with secretions [7].      Download image     Figure 5.3. Consolidation: ultrasound images and operational meaning. Static and dynamic air bronchograms, together with C-lines, the shred sign, and tissue-like hepatization, help interpret consolidation and estimate the expected role of positive pressure. Ultrasound images are taken from material provided by the author and arranged for teaching purposes.  From ultrasound finding to ventilatory decision  Applying the AdET method to NIV requires immediate translation of the ultrasound finding into a management decision.  A predominant A-pattern in a hypercapnic patient points more strongly toward a respiratory muscle problem than a recruitment problem. In this situation, NIV-PS has a stronger rationale than CPAP alone, and diaphragm ultrasound may be more informative than counting vertical artifacts.  Diffuse, orderly vertical artifacts in a patient with a clinically consistent cardiogenic picture support the use of CPAP/EPAP and decongestive therapy. The expected response is a reduction in artifacts and improved aeration over time.  A disorganized pattern with an irregular pleura and consolidations requires caution: non-invasive support should be attempted only if the patient is stable, cooperative, and can be reassessed rapidly. If respiratory drive remains high and the LUS score worsens, the trial should not be prolonged.  A significant pleural effusion or suspected pneumothorax completely changes the strategy. Before increasing pressures or persisting with NIV, the finding should be clarified and the underlying cause treated when indicated.      Download image     Figure 5.4. From ultrasound finding to ventilatory choice. Operational summary of the transition from ultrasound findings to decisions about non-invasive respiratory support.  Timing of ultrasound in the NIV pathway  Ultrasound can be used effectively at three time points.  Before starting support, it helps define the phenotype: aerated/hyperinflated lung, congested lung, disorganized lung, consolidated lung, lung compressed by pleural effusion, lung complicated by pneumothorax, or respiratory muscle dysfunction.  A few minutes after starting support, during setting optimization, it helps determine whether the chosen or modified parameter has reached its target: EPAP/CPAP for loss of aeration or congestion; pressure support for work of breathing and alveolar ventilation; positioning for dependent atelectasis; interface adjustment when the problem is technical.  During reassessment, ultrasound helps distinguish a true response from an apparent one. SpO2 may improve even while the lung remains heterogeneous and the diaphragm continues to work excessively. Serial LUS and respiratory muscle assessment help determine whether to continue, modify, or stop the trial.  Pitfall to avoid  The most common error is to stop at description of the ultrasound sign: “there are B-lines,” “there is consolidation,” or “the LUS is high.” That is not enough. The next question must be: what changes in management?  An ultrasound finding that does not change diagnosis, settings, monitoring, or the threshold for escalation remains incomplete information.  References for Chapter 5  1. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116.  2. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397.  3. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.  4. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.  5. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.  6. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC.  7. Lichtenstein D, Mezière G, Seitz J. The dynamic air bronchogram: a lung ultrasound sign of alveolar consolidation ruling out atelectasis. Chest. 2009;135(6):1421-1425. doi:10.1378/chest.08-2281. "}, {"part": "Part II — Ultrasound Applied to NIV: the AdET Method", "title": "Chapter 6. Practical LUS for NIV", "tag": "Ch. 6", "html": "<h4>Practical objective<\/h4><p>Lung ultrasound (LUS) in patients considered for HFNC, CPAP, or NIV-PS should be rapid, repeatable, and directed toward clinical decision-making. In this setting, it is not used merely as a numerical score of aeration loss, but as an integrated description of pattern, distribution, pleural line, lung sliding, vertical artifacts, consolidations, pleural effusions, and their changes after respiratory support [1,2].<\/p><p>is the lung predominantly aerated, or has aeration been lost?<\/p><p>is loss of aeration diffuse, focal, dependent, or heterogeneous?<\/p><p>is there a realistic target for CPAP or EPAP?<\/p><p>are there consolidations, pleural effusions, or pneumothorax?<\/p><p>is the picture improving after support is started, or is the improvement in SpO2 merely masking the underlying problem?<\/p><p>Ultrasound should help select the support modality, set the parameters, and determine when reassessment is needed.<\/p><h4>Which probe to use<\/h4><p>For bedside LUS, a linear probe is often the reference transducer for superficial structures, whereas a convex or microconvex probe is particularly useful when greater depth and a wider field of view are required.<\/p><p>In practice, use:<\/p><p>a linear probe for the pleura, lung sliding, superficial vertical artifacts, pneumothorax, small subpleural consolidations, and respiratory muscle contraction;<\/p><p>a convex/microconvex probe for posterior and dependent regions, pleural effusion, deeper consolidations, diaphragmatic excursion, and panoramic scanning;<\/p><p>a phased-array probe is not the standard probe for LUS, but may be useful as a compromise in critically ill patients when rapidly integrating heart and lung assessment or when acoustic windows are difficult.<\/p><p>The setup should match the sign being sought. Depth and focus must be adjusted accordingly: there is little value in assessing lung sliding with an excessively deep image, or evaluating a pleural effusion with insufficient depth.<\/p><h4>Where to scan<\/h4><p>A 12-zone protocol allows serial comparison and provides a reproducible LUS score. Each hemithorax is divided into anterior, lateral, and posterior regions, each with an upper and lower area [1,3].<\/p><p>In an emergency, scanning can begin with anterior and lateral regions. As soon as possible, however, the posterior and posteroinferior areas should also be examined, as these are often where consolidations, atelectasis, and pleural effusions are most evident.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_25.png\" alt=\"English teaching figure 25\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_25.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 6.1. Practical 12-zone protocol for NIV. Anterior and lateral regions allow rapid initial assessment; posterior regions are essential for detecting consolidations, dependent atelectasis, and pleural effusions.<\/p><h4>Minimum examination sequence<\/h4><p>The scanning sequence should be rapid, structured, and consistent every time.<\/p><p>1. Lung sliding\nFirst question: does the lung slide? Preserved sliding makes pneumothorax unlikely at the point examined. Absent sliding alone is not sufficient to diagnose pneumothorax: it may also be absent with pleural adhesions, atelectasis, apnea, selective intubation, reduced regional ventilation, or pleurodesis.<\/p><p>2. Predominant pattern\nA-pattern, vertical artifacts, consolidation, or pleural effusion. The predominant pattern helps define the phenotype: aerated, congested, disorganized, consolidated, or compressed lung.<\/p><p>3. Distribution\nFocal or diffuse, anterior or posterior, symmetric or asymmetric, homogeneous or patchy. Distribution is often more important than the number of vertical lines visualized.<\/p><p>4. Consolidations and pleural effusions\nThese should be sought especially in posterolateral and dependent regions. When consolidation is present, the bronchogram should be described, the deep margin examined, and associated pleural effusion and/or potential recruitability assessed.<\/p><p>5. LUS score, when useful\nThe LUS score is primarily useful for serial monitoring. It should not replace qualitative description.<\/p><p>Integrating the information from this scanning sequence helps define the patient’s phenotype.<\/p><h4>Findings that change the initial NIV settings<\/h4><p>A-pattern<\/p><p>An A-pattern with preserved lung sliding indicates an aerated lung at the site examined. In a dyspneic patient, this may be consistent with COPD, asthma, pulmonary embolism, hypercapnia due to respiratory muscle dysfunction, or respiratory failure without peripheral loss of aeration.<\/p><p>What changes: there is no strong target for setting or increasing EPAP/PEEP for recruitment. If the patient is hypercapnic or fatigued, the focus shifts toward setting pressure support according to diaphragm and accessory muscle activity, auto-PEEP, and synchrony.<\/p><p>Diffuse, orderly vertical artifacts<\/p><p>Bilateral, relatively symmetric vertical artifacts with a smooth or only mildly altered pleural line suggest congestion or increased extravascular lung water when the clinical picture is consistent.<\/p><p>What changes: CPAP or EPAP has a plausible target. The expected response is a reduction in artifacts and improved aeration over time, together with reduced work of breathing and lower FiO2 requirements.<\/p><p>Disorganized pattern<\/p><p>Heterogeneous vertical artifacts, spared areas, an irregular pleura, small subpleural consolidations, or a patchy distribution suggest primary lung disease such as pneumonia, an ARDS-like process, pulmonary contusion, fibrosis, or another form of heterogeneous loss of aeration [4,5].<\/p><p>What changes: non-invasive support should be used more cautiously. If the patient has high respiratory drive, a high LUS score, and a hyperactive diaphragm, the threshold for escalation should be low. The goal is not merely to achieve a good SpO2, but to truly reduce work of breathing. Do not prolong an ineffective trial.<\/p><p>Consolidation<\/p><p>Consolidation corresponds to score 3, but not all consolidations have the same meaning. It may represent pneumonia, atelectasis, compression from pleural effusion, bronchial obstruction, or retained secretions. Dynamic, static, or fluid bronchograms and the clinical context become decisive.<\/p><p>What changes: PEEP should not be increased automatically. First determine whether the region is recruitable, whether the bronchi are patent, whether secretions or pleural effusion are present, and whether physiotherapy, drainage of an associated effusion, or disobstructive bronchoscopy is required.<\/p><p>Pleural effusion<\/p><p>Pleural effusion can compress the lung and contribute to dyspnea, passive atelectasis, and NIV failure. NIV is not always the best treatment in this setting.<\/p><p>What changes: assess size, laterality, compressive effect, and indication for drainage. If the dominant problem is mechanical compression, increasing EPAP/PEEP may have limited efficacy.<\/p><p>Absent lung sliding and suspected pneumothorax<\/p><p>Absent lung sliding alone is not sufficient to diagnose pneumothorax, but it must be taken seriously in a patient receiving positive-pressure support. The lung point should be sought, A-lines assessed, absence of B-lines confirmed at the suspicious site, and associated clinical signs and hemodynamic stability considered [6].<\/p><p>What changes: before increasing ventilatory pressures or persisting with NIV/CPAP, the suspicion should be clarified. If pneumothorax is confirmed and clinically relevant, treatment of the cause, namely drainage, takes priority.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_26.png\" alt=\"English teaching figure 26\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_26.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 6.2. Lung ultrasound: finding, meaning, and effect on NIV. An ultrasound finding becomes useful when it changes the support modality, settings, causal treatment, or threshold for escalation.<\/p><h4>LUS score in NIV practice<\/h4><p>The LUS score is useful for serial monitoring of aeration loss, but it should not replace qualitative description of the pattern. In ultrasound-guided NIV, the numerical value should always be linked to the location of abnormalities, their homogeneity or heterogeneity, pleural-line characteristics, the presence of consolidation or pleural effusion, and the response to changes in support or position [3,7].<\/p><p>The key is repeated assessment in the same patient. The absolute value has limited meaning unless linked to distribution and clinical status. Change over time is more informative:<\/p><p>improving LUS + decreasing respiratory rate + reducible FiO2: true response;<\/p><p>unchanged LUS + better SpO2 but high FiO2: uncertain response;<\/p><p>worsening LUS + high respiratory drive + unfavorable ABG: probable failure.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_27.png\" alt=\"English teaching figure 27\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_27.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 6.3. Serial LUS: favorable, uncertain, or unfavorable response. Changes in LUS over time help distinguish true improvement from apparent stability.<\/p><p>LUS and EPAP/PEEP titration<\/p><p>LUS can help determine whether an increase in EPAP/PEEP is producing reaeration. If a region changes from consolidation or confluent artifacts toward a more aerated pattern, the support is reaching a real target. If LUS remains unchanged despite increasing pressures, poor recruitability becomes more likely [2,7].<\/p><p>Caution: LUS does not directly measure overdistension. Improvement in some dependent regions may coexist with overdistension of already aerated regions, especially in heterogeneous lungs. Titration should therefore not rely on lung ultrasound alone, but also on clinical status, hemodynamics, ventilator-derived volumes, patient comfort, and monitoring of diaphragm and right-ventricular function.<\/p><h4>NIV-oriented report<\/h4><p>A useful report does not need to be long. It should state what is relevant to treatment.<\/p><p>Example of a concise structure:<\/p><p>Lung sliding: present/absent in the regions examined.<\/p><p>Predominant pattern: A-pattern, vertical artifacts, consolidation, pleural effusion.<\/p><p>Distribution: focal/diffuse, homogeneous/heterogeneous, anterior/lateral/posterior.<\/p><p>LUS score: if calculated, including the most affected regions.<\/p><p>Consolidations: location, bronchogram characteristics, and any associated pleural effusion.<\/p><p>Interpretation: aerated, congested, disorganized, consolidated, or compressed lung.<\/p><p>NIV implication: HFNC/CPAP/NIV, EPAP/PEEP, reassessment, escalation.<\/p><h4>Pitfall to avoid<\/h4><p>The most common error is to use LUS as a single baseline snapshot rather than as a monitoring tool. LUS performed only before NIV is useful diagnostically, but much of its practical value is lost if it is not repeated when the patient changes clinically or when ventilator settings are modified.<\/p><p>LUS during NIV should be serial, targeted, and decision-oriented.<\/p><h4>References for Chapter 6<\/h4><p>1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p><p>2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>3. Mongodi S, Bouhemad B, Orlando A, Stella A, Tavazzi G, Via G, Iotti GA, Braschi A, Mojoli F. Modified Lung Ultrasound Score for Assessing and Monitoring Pulmonary Aeration. Ultraschall Med. 2017;38(5):530-537. doi:10.1055/s-0042-120260.<\/p><p>4. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116.<\/p><p>5. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397.<\/p><p>6. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800.<\/p><p>7. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC.<\/p>", "plain": " Practical objective  Lung ultrasound (LUS) in patients considered for HFNC, CPAP, or NIV-PS should be rapid, repeatable, and directed toward clinical decision-making. In this setting, it is not used merely as a numerical score of aeration loss, but as an integrated description of pattern, distribution, pleural line, lung sliding, vertical artifacts, consolidations, pleural effusions, and their changes after respiratory support [1,2].  is the lung predominantly aerated, or has aeration been lost?  is loss of aeration diffuse, focal, dependent, or heterogeneous?  is there a realistic target for CPAP or EPAP?  are there consolidations, pleural effusions, or pneumothorax?  is the picture improving after support is started, or is the improvement in SpO2 merely masking the underlying problem?  Ultrasound should help select the support modality, set the parameters, and determine when reassessment is needed.  Which probe to use  For bedside LUS, a linear probe is often the reference transducer for superficial structures, whereas a convex or microconvex probe is particularly useful when greater depth and a wider field of view are required.  In practice, use:  a linear probe for the pleura, lung sliding, superficial vertical artifacts, pneumothorax, small subpleural consolidations, and respiratory muscle contraction;  a convex/microconvex probe for posterior and dependent regions, pleural effusion, deeper consolidations, diaphragmatic excursion, and panoramic scanning;  a phased-array probe is not the standard probe for LUS, but may be useful as a compromise in critically ill patients when rapidly integrating heart and lung assessment or when acoustic windows are difficult.  The setup should match the sign being sought. Depth and focus must be adjusted accordingly: there is little value in assessing lung sliding with an excessively deep image, or evaluating a pleural effusion with insufficient depth.  Where to scan  A 12-zone protocol allows serial comparison and provides a reproducible LUS score. Each hemithorax is divided into anterior, lateral, and posterior regions, each with an upper and lower area [1,3].  In an emergency, scanning can begin with anterior and lateral regions. As soon as possible, however, the posterior and posteroinferior areas should also be examined, as these are often where consolidations, atelectasis, and pleural effusions are most evident.      Download image     Figure 6.1. Practical 12-zone protocol for NIV. Anterior and lateral regions allow rapid initial assessment; posterior regions are essential for detecting consolidations, dependent atelectasis, and pleural effusions.  Minimum examination sequence  The scanning sequence should be rapid, structured, and consistent every time.  1. Lung sliding\nFirst question: does the lung slide? Preserved sliding makes pneumothorax unlikely at the point examined. Absent sliding alone is not sufficient to diagnose pneumothorax: it may also be absent with pleural adhesions, atelectasis, apnea, selective intubation, reduced regional ventilation, or pleurodesis.  2. Predominant pattern\nA-pattern, vertical artifacts, consolidation, or pleural effusion. The predominant pattern helps define the phenotype: aerated, congested, disorganized, consolidated, or compressed lung.  3. Distribution\nFocal or diffuse, anterior or posterior, symmetric or asymmetric, homogeneous or patchy. Distribution is often more important than the number of vertical lines visualized.  4. Consolidations and pleural effusions\nThese should be sought especially in posterolateral and dependent regions. When consolidation is present, the bronchogram should be described, the deep margin examined, and associated pleural effusion and/or potential recruitability assessed.  5. LUS score, when useful\nThe LUS score is primarily useful for serial monitoring. It should not replace qualitative description.  Integrating the information from this scanning sequence helps define the patient’s phenotype.  Findings that change the initial NIV settings  A-pattern  An A-pattern with preserved lung sliding indicates an aerated lung at the site examined. In a dyspneic patient, this may be consistent with COPD, asthma, pulmonary embolism, hypercapnia due to respiratory muscle dysfunction, or respiratory failure without peripheral loss of aeration.  What changes: there is no strong target for setting or increasing EPAP/PEEP for recruitment. If the patient is hypercapnic or fatigued, the focus shifts toward setting pressure support according to diaphragm and accessory muscle activity, auto-PEEP, and synchrony.  Diffuse, orderly vertical artifacts  Bilateral, relatively symmetric vertical artifacts with a smooth or only mildly altered pleural line suggest congestion or increased extravascular lung water when the clinical picture is consistent.  What changes: CPAP or EPAP has a plausible target. The expected response is a reduction in artifacts and improved aeration over time, together with reduced work of breathing and lower FiO2 requirements.  Disorganized pattern  Heterogeneous vertical artifacts, spar
