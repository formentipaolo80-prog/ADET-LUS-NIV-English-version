<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultrasound-guided NIV</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--dark:#0f172a}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1280px;margin:auto;padding:18px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:13px;align-items:center}
.logo{width:50px;height:50px;border-radius:18px;background:#0f172a;color:white;display:grid;place-items:center;font-size:25px;font-weight:900}
.kicker{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
h1{font-size:24px;margin:3px 0 0;letter-spacing:-.03em}
nav{display:flex;gap:8px;overflow:auto}
nav button,.btn{border:0;border-radius:15px;padding:10px 13px;background:#e2e8f0;color:#334155;font-weight:800;cursor:pointer;white-space:nowrap}
nav button.active,.btn.dark{background:#0f172a;color:white}
.hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:32px;padding:28px;margin:20px 0;box-shadow:0 12px 30px rgba(15,23,42,.18)}
.hero h2{font-size:42px;letter-spacing:-.045em;margin:8px 0 10px}
.hero p{color:#cbd5e1;line-height:1.65;max-width:900px}
.pill,.badge{display:inline-flex;border-radius:999px;background:#e2e8f0;color:#334155;padding:6px 10px;font-size:12px;font-weight:800;margin:0 5px 5px 0}
.hero .pill{background:rgba(255,255,255,.12);color:#e2e8f0}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.grid{display:grid;gap:18px}
.two{grid-template-columns:330px 1fr}.twoWide{grid-template-columns:1fr 520px}.cards2{grid-template-columns:repeat(2,1fr)}.cards3{grid-template-columns:repeat(3,1fr)}.cards4{grid-template-columns:repeat(4,1fr)}
.hidden{display:none!important}.subtitle{color:var(--muted);line-height:1.5}.summary{font-size:17px;line-height:1.65;color:#334155}
.item{width:100%;text-align:left;border:0;border-radius:18px;background:#f8fafc;margin-bottom:8px;padding:13px;cursor:pointer;color:#1e293b}
.item.active{background:#0f172a;color:white}.item small{opacity:.72;font-weight:800}.item b{display:block;margin-top:4px}.sideList{max-height:650px;overflow:auto;padding-right:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;padding:10px 12px;font:inherit;background:white}
textarea{min-height:90px;resize:vertical} label span{display:block;font-size:13px;font-weight:800;color:#475569;margin-bottom:6px}
.search{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:14px;background:white}
.homeGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.quickButtons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.quickBtn{border:0;text-align:left;border-radius:24px;background:#fff;color:#0f172a;padding:18px;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.08);min-height:110px}
.quickBtn.dark{background:#0f172a;color:white}.quickBtn span{display:block;color:#64748b;font-size:13px;margin-top:5px;line-height:1.35}.quickBtn.dark span{color:#cbd5e1}.bigIcon{font-size:30px}
.info{background:#f8fafc;border:1px solid var(--line);border-radius:22px;padding:15px;line-height:1.55;color:#334155}.warn{background:#fff7ed;border-color:#fed7aa;color:#7c2d12}.ok{background:#ecfdf5;border-color:#bbf7d0;color:#14532d}
.result{background:#0f172a;color:white;border-radius:20px;padding:15px;margin-top:14px}.result small{display:block;color:#94a3b8;font-weight:800;text-transform:uppercase}.result strong{display:block;font-size:28px;margin-top:4px}
pre{white-space:pre-wrap;background:#0f172a;color:white;border-radius:22px;padding:16px;line-height:1.6;min-height:360px;font-size:13px}
.appendixGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.appendixCard img{display:block;width:100%;height:auto;border-radius:20px;border:1px solid var(--line);margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{display:inline-flex;text-decoration:none;border-radius:14px;padding:9px 12px;font-weight:800;background:#0f172a;color:white;font-size:13px}.actions a.secondary{background:#e2e8f0;color:#334155}
.atlasCard{background:#fff;border:1px solid var(--line);border-radius:30px;padding:18px;margin-bottom:20px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.atlasGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);border-radius:24px;background:#f8fafc;padding:14px}.panel h4{margin:0 0 10px}
.media,.videoBox{height:300px;border-radius:24px}.media{background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid #334155;position:relative;overflow:hidden}
.media .label{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.12);color:#e5e7eb;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;z-index:3}
.media .pleura{position:absolute;left:0;right:0;top:86px;height:2px;background:rgba(255,255,255,.55)}.media .rough{height:3px;background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,255,255,.85),rgba(255,255,255,.15))}
.aline{position:absolute;left:35px;right:35px;height:1px;background:rgba(255,255,255,.45);animation:fadeLine 2s infinite}
.vArtifact{position:absolute;top:87px;width:6px;height:178px;border-radius:99px;background:linear-gradient(to bottom,rgba(255,255,255,.92),rgba(255,255,255,.10));animation:pulseVA 1.5s infinite}.confluent{width:20px}
.shred{position:absolute;left:50px;right:50px;bottom:38px;height:90px;background:rgba(255,255,255,.42);clip-path:polygon(0 18%,18% 2%,35% 24%,50% 8%,66% 28%,83% 5%,100% 20%,100% 100%,0 100%)}
.hepat{position:absolute;left:55px;right:55px;bottom:35px;height:110px;border-radius:18px;background:rgba(255,255,255,.46)}
.airdot{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;animation:dotMove 1.2s infinite alternate}
.fluid{position:absolute;left:40px;right:40px;bottom:24px;height:92px;border-radius:0 0 30px 30px;background:rgba(147,197,253,.45);animation:wave 2s infinite}
.diaphragm{position:absolute;left:35px;right:35px;bottom:78px;height:24px;border-top:4px solid rgba(255,255,255,.85);border-bottom:4px solid rgba(255,255,255,.85);background:rgba(255,255,255,.16);border-radius:50%;animation:thicken 1.4s infinite alternate}
.mmode{position:absolute;left:32px;right:32px;bottom:38px;height:110px;border-left:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25)}
.curve{position:absolute;left:32px;right:32px;bottom:65px;height:60px;border-radius:50%;border-top:3px solid rgba(255,255,255,.8);animation:curveMove 1.5s infinite alternate}
.lungPointA{position:absolute;left:0;top:86px;width:50%;height:2px;background:rgba(255,255,255,.08)}.lungPointB{position:absolute;right:0;top:86px;width:50%;height:2px;background:rgba(255,255,255,.65);animation:slide 1.1s infinite alternate}.sliding{animation:slide 1.1s infinite alternate}
.barcode{position:absolute;left:30px;right:30px;bottom:38px;top:115px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 3px,rgba(255,255,255,.02) 3px 8px)}
.videoBox{background:#0f172a;border:1px solid #334155;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.videoBox video{display:block;width:100%;height:100%;object-fit:contain;border-radius:18px;background:#0f172a}
.interpret{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.interpret div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:12px;font-size:14px;line-height:1.45;color:#475569}.interpret b{display:block;color:#0f172a;margin-bottom:4px}
@keyframes pulseVA{0%,100%{opacity:.55;transform:scaleY(.92)}50%{opacity:1;transform:scaleY(1.05)}}@keyframes fadeLine{0%,100%{opacity:.22}50%{opacity:.55}}@keyframes dotMove{from{transform:translateY(0)}to{transform:translateY(-22px)}}@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes thicken{from{height:14px;bottom:83px}to{height:34px;bottom:73px}}@keyframes curveMove{from{transform:translateY(8px)}to{transform:translateY(-7px)}}@keyframes slide{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
@media(max-width:1050px){.two,.twoWide,.cards2,.cards3,.cards4,.homeGrid,.atlasGrid,.interpret,.appendixGrid{grid-template-columns:1fr}.media,.videoBox{height:260px}}
@media(max-width:900px){.hero h2{font-size:31px}.wrap{padding:14px}.media,.videoBox{height:230px}}

.singleHome{grid-template-columns:1fr!important;max-width:760px}

.decisionFlow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.flowStep{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:14px;line-height:1.5;color:#334155}.flowStep b{display:block;color:#0f172a;margin-bottom:4px}.decisionBox{background:#0f172a;color:white;border-radius:22px;padding:16px;margin-top:14px}.decisionBox small{display:block;color:#94a3b8;text-transform:uppercase;font-weight:900;letter-spacing:.06em}.decisionBox strong{display:block;font-size:20px;line-height:1.4;margin-top:6px}.pumpSummary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.videoPlaceholder{height:300px;border-radius:24px;background:#0f172a;color:#e2e8f0;border:1px dashed #64748b;display:grid;place-items:center;text-align:center;padding:18px;line-height:1.5}.videoPlaceholder span{color:#94a3b8}.rib{position:absolute;top:90px;width:26px;height:135px;border-radius:18px;background:rgba(255,255,255,.72)}.intercostalMuscle{position:absolute;left:105px;right:105px;top:125px;height:64px;border-radius:30px;background:rgba(56,189,248,.35);border:2px solid rgba(255,255,255,.55)}.muscleThicken{position:absolute;left:125px;right:125px;top:140px;height:34px;border-radius:30px;background:rgba(255,255,255,.35);animation:thickenIntercostal 1.3s infinite alternate}.probeLine{position:absolute;left:80px;right:80px;top:82px;height:2px;background:rgba(255,255,255,.8)}.abdLayer{position:absolute;left:65px;right:65px;height:42px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;border:1px solid rgba(255,255,255,.45)}.abdLayer.oe{top:92px;background:rgba(56,189,248,.38)}.abdLayer.oi{top:145px;background:rgba(14,165,233,.45)}.abdLayer.tra{top:198px;background:rgba(2,132,199,.50)}.abdArrow{position:absolute;right:50px;top:145px;color:white;font-size:42px;animation:slide 1.1s infinite alternate}.pumpNode{position:absolute;border-radius:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);color:white;font-weight:900;text-align:center;padding:14px}.pumpNode.dia{left:105px;bottom:45px}.pumpNode.ic{left:45px;top:85px}.pumpNode.abd{right:45px;top:85px}.pumpLink{position:absolute;height:2px;background:rgba(56,189,248,.7);transform-origin:left center}.pumpLink.l1{left:140px;top:155px;width:105px;transform:rotate(32deg)}.pumpLink.l2{right:145px;top:155px;width:105px;transform:rotate(148deg)}.pumpLink.l3{left:150px;right:150px;bottom:92px}@keyframes thickenIntercostal{from{height:26px;top:144px;opacity:.5}to{height:56px;top:129px;opacity:1}}@media(max-width:1050px){.decisionFlow,.pumpSummary{grid-template-columns:1fr}.videoPlaceholder{height:260px}}@media(max-width:900px){.videoPlaceholder{height:230px}}

.heroStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.heroStats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:14px}
.heroStats b{display:block;font-size:30px;color:white}
.heroStats span{display:block;color:#cbd5e1;font-size:13px}
.dashboardGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.dashboardPrimary{min-height:100%}
.timeline{display:grid;gap:12px}
.timeline div{position:relative;background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 62px}
.timeline span{position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:99px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:900}
.timeline b{display:block;color:#0f172a}
.timeline p{margin:4px 0 0;color:#64748b;line-height:1.35}
.appendixNativeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.appendixNative{background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.appendixNative h2{margin-top:8px}
.nativeSection{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.nativeSection h3{margin:0 0 8px;color:#0f172a}
.checkGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.checkGrid label{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;color:#334155}
.reportTemplate{display:grid;gap:10px}
.reportTemplate div,.visualChecklist div,.nativeFlow div,.phrase{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.reportTemplate b,.visualChecklist b{display:block;color:#0f172a;margin-bottom:4px}
.reportTemplate p,.phrase p{margin:0;color:#475569;line-height:1.45}
.phraseGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.phrase.danger{background:#fff7f7;border-color:#fecaca;color:#7f1d1d}
.phrase.warn{background:#fff7ed;border-color:#fed7aa}
.phrase.ok{background:#ecfdf5;border-color:#bbf7d0}
.visualChecklist{display:grid;gap:10px}
.visualChecklist span{display:block;color:#475569;line-height:1.4}
.nativeFlow{display:grid;gap:10px}
.nativeFlow div{position:relative;padding-left:62px}
.nativeFlow span{position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:99px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:900}
.nativeFlow b{display:block;color:#0f172a}
.nativeFlow p{margin:4px 0 0;color:#475569}
.nativeTable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
.nativeTable th{background:#0f172a;color:white;text-align:left;padding:10px}
.nativeTable td{border-top:1px solid var(--line);padding:10px;vertical-align:top}
.visualGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.visualSlot input[type=file]{margin-top:8px}
.slotHead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slotHead b{color:#64748b;font-size:13px}
.visualPreview{min-height:170px;margin-top:12px;background:#0f172a;border-radius:20px;display:grid;place-items:center;overflow:hidden;border:1px solid #334155}
.visualPreview:empty::before{content:"Anteprima immagine";color:#94a3b8;font-weight:800}
.visualPreview img{width:100%;height:240px;object-fit:contain;background:#0f172a}
@media(max-width:1050px){.heroStats,.dashboardGrid,.appendixNativeGrid,.visualGrid,.phraseGrid{grid-template-columns:1fr}.checkGrid{grid-template-columns:1fr}}

.appendixImageFrame{background:#f8fafc;border:1px solid var(--line);border-radius:22px;padding:12px;margin-top:12px;overflow:auto;max-height:760px}
.appendixImageFrame img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:white}
@media(max-width:1050px){.appendixImageFrame{max-height:none}}

.homeCleanGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.logicCards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.logicCards div,.moduleMap div,.decisionMini div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.logicCards b,.moduleMap b,.decisionMini b{display:block;color:#0f172a;margin-bottom:5px}
.logicCards p{margin:0;color:#64748b;line-height:1.4}
.moduleMap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.moduleMap span,.decisionMini span{display:block;color:#64748b;line-height:1.4}
.decisionMini{display:grid;gap:12px}
.decisionMini .ok{background:#ecfdf5;border-color:#bbf7d0}
.decisionMini .warn{background:#fff7ed;border-color:#fed7aa}
.appendixReadableGrid{display:grid;grid-template-columns:1fr;gap:18px}
.appendixReadable{background:#fff;border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.appendixTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.appendixTop h2{margin:0}
.readableTwo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.readableTwo section,.structuredReport div,.visualChecklistReadable div,.algorithmReadable div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.readableTwo h3{margin:0 0 6px;color:#0f172a}
.readableTwo p,.structuredReport span,.visualChecklistReadable span{margin:0;color:#475569;line-height:1.45;display:block}
.structuredReport{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.structuredReport b,.visualChecklistReadable b{display:block;color:#0f172a;margin-bottom:6px}
.visualChecklistReadable{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.algorithmReadable{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.algorithmReadable div{position:relative;padding-top:54px;min-height:170px}
.algorithmReadable span{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:999px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:900}
.algorithmReadable b{display:block;color:#0f172a;margin-bottom:6px}
.algorithmReadable p{margin:0;color:#475569;line-height:1.38}
.nativeTable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
.nativeTable th{background:#0f172a;color:white;text-align:left;padding:10px}
.nativeTable td{border-top:1px solid var(--line);padding:10px;vertical-align:top}
.phraseGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.phrase{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.phrase.ok{background:#ecfdf5;border-color:#bbf7d0}
.phrase.warn{background:#fff7ed;border-color:#fed7aa}
.phrase.danger{background:#fff7f7;border-color:#fecaca}
.phrase p{margin:5px 0 0;color:#475569;line-height:1.4}
@media(max-width:1050px){.homeCleanGrid,.logicCards,.moduleMap,.readableTwo,.structuredReport,.visualChecklistReadable,.algorithmReadable,.phraseGrid{grid-template-columns:1fr}}

.appendixGraphicList{display:grid;grid-template-columns:1fr;gap:22px}
.appendixGraphicCard{padding:20px}
.appendixGraphicHeader{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.appendixGraphicHeader h2{margin:0 0 4px}
.appendixGraphicFrame{background:#f8fafc;border:1px solid var(--line);border-radius:24px;padding:14px;overflow:auto;max-height:none}
.appendixGraphicFrame img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:white}
@media(min-width:1200px){.appendixGraphicFrame img{max-width:1150px;margin:auto}}

.appendixModeBar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.interactiveAppendixGrid{display:grid;grid-template-columns:1fr;gap:22px}
.interactiveAppendix pre{min-height:180px;margin-top:14px}
.checklistInteractive{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.checklistInteractive label{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:10px;color:#334155;font-weight:700}
@media(max-width:1050px){.checklistInteractive{grid-template-columns:1fr}}


/* ===== v13 aesthetic color layer ===== */
:root{
  --bg:#eef6fb; --card:#ffffff; --ink:#082f49; --muted:#557086;
  --line:#c7dbea; --dark:#073b73; --teal:#008c8c;
  --cyan:#38bdf8; --blue:#2563eb; --amber:#f59e0b;
  --rose:#e11d48; --green:#16a34a; --violet:#7c3aed;
}
body{
  background:
    radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 34rem),
    radial-gradient(circle at top right, rgba(0,140,140,.14), transparent 32rem),
    linear-gradient(180deg,#f6fbff 0%,#eef6fb 45%,#f8fafc 100%);
}
header{background:rgba(255,255,255,.88);border-bottom:1px solid rgba(7,59,115,.14);box-shadow:0 8px 24px rgba(8,47,73,.06)}
.logo{background:linear-gradient(135deg,#073b73,#008c8c);box-shadow:0 10px 24px rgba(7,59,115,.22)}
nav button{background:linear-gradient(180deg,#ffffff,#e8f3fb);border:1px solid #cfe3ef;color:#0f4c81;box-shadow:0 4px 12px rgba(8,47,73,.05)}
nav button.active{background:linear-gradient(135deg,#073b73,#008c8c);color:white;box-shadow:0 10px 24px rgba(0,140,140,.22)}
.hero{
  background:
    radial-gradient(circle at 10% 20%,rgba(56,189,248,.26),transparent 19rem),
    radial-gradient(circle at 92% 20%,rgba(20,184,166,.24),transparent 21rem),
    linear-gradient(135deg,#073b73 0%,#075985 48%,#008c8c 100%);
  box-shadow:0 20px 48px rgba(7,59,115,.22);
  border:1px solid rgba(255,255,255,.16);
}
.hero h2{color:white;text-shadow:0 2px 12px rgba(0,0,0,.16)}

<script type="application/json" id="app-data">{"manual": [{"part": "Part I — Practical Foundations of Non-Invasive Ventilation", "title": "Chapter 1. Non-Invasive Respiratory Support: What We Mean by NIV", "tag": "Ch. 1", "html": "<h4>Practical objective<\/h4><p>Before using ultrasound to guide non-invasive ventilation, it is essential to clarify exactly what is being set. In clinical practice, “NIV” is often used to refer to any form of respiratory support delivered without an endotracheal airway (endotracheal tube or tracheostomy), but conventional oxygen therapy, HFNC (high-flow nasal cannula), CPAP (continuous positive airway pressure), and NIV-PS (non-invasive ventilation with pressure support) do not have the same physiological meaning.<\/p><p>The basic concept is simple: each type of support addresses a different problem and has a different target. If the dominant problem is mild hypoxemia, increasing the amount of oxygen inspired by the patient (FiO2) may be sufficient. If the problem is loss of aeration or alveolar collapse, continuous positive airway pressure (CPAP) is required. If the problem is alveolar ventilation or respiratory muscle fatigue, inspiratory support is needed. If the problem is a severely heterogeneous lung with high respiratory drive, prolonged non-invasive support may become dangerous because it can delay the appropriate therapeutic escalation, namely invasive mechanical ventilation [1,2].<\/p><p>The initial question is therefore not: “Should I start NIV?” The correct question is:<\/p><p>what problem do I want to correct with non-invasive support? What is my target?<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_01.png\" alt=\"English teaching figure 1\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_01.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 1.1. The spectrum of non-invasive respiratory support. Conventional oxygen therapy, HFNC, CPAP, and pressure-support NIV represent different levels of intervention. They are not equivalent: they increase FiO2, flow, continuous pressure, or inspiratory support in different ways.<\/p><h4>Non-invasive respiratory support modalities<\/h4><p>Conventional oxygen therapy<\/p><p>Conventional oxygen therapy increases FiO2 but does not provide significant positive pressure and does not substantially reduce the work of breathing. It may be sufficient in mild hypoxemia when the patient is stable, respiratory rate is controlled, and there is no acidosis or evidence of respiratory muscle fatigue.<\/p><p>Practical limitation: it may improve SpO2 without changing lung mechanics or pathophysiology, that is, without reducing shunt, correcting increased dead space, or decreasing respiratory muscle workload. A better SpO2 does not automatically mean effective alveolar ventilation or reduced work of breathing.<\/p><p>For these reasons, conventional oxygen therapy should not be considered a form of respiratory support.<\/p><p>HFNC<\/p><p>High-flow nasal cannula (HFNC) delivers heated and humidified gas at high flow rates with adjustable FiO2. Its main effects are to provide a stable FiO2, reduce anatomical dead space, improve patient comfort, humidify the airways, and generate a modest positive-pressure effect, which varies according to flow, open- or closed-mouth breathing, and the patient’s respiratory mechanics.<\/p><p>It is useful in mild-to-moderate hypoxemic respiratory failure, particularly in patients who are awake, cooperative, not significantly hypercapnic, and without marked respiratory muscle fatigue.<\/p><p>Practical limitation: HFNC can improve patient comfort even when the work of breathing remains high. It therefore requires careful monitoring of respiratory rate, SpO2/FiO2, the ROX index (SpO2/FiO2 divided by respiratory rate), lung ultrasound, and, when feasible, diaphragm assessment.<\/p><h4>HFNC in practice: indications, monitoring, and failure<\/h4><p>HFNC should be regarded as a minimally invasive form of non-invasive respiratory support, particularly useful when the dominant problem is hypoxemia in an awake, cooperative patient who can protect the airway. It does not replace NIV-PS when the main problem is hypercapnic respiratory acidosis with respiratory pump fatigue, and it must not delay intubation in a hypoxemic patient with high respiratory drive and progressive deterioration [3-5].<\/p><p>Practical setup: select appropriately sized cannulae, start with flows generally between 40 and 60 L/min if tolerated, set FiO2 to achieve the appropriate oxygen saturation target, and always ensure heating and humidification. In patients with COPD or hypercapnia, the SpO2 target should be conservative, generally 88–92%, unless otherwise clinically indicated [3,4].<\/p><p>At 30–60 minutes, reassess SpO2/FiO2, respiratory rate, work of breathing, targeted lung ultrasound (LUS), and arterial blood gas analysis (ABG).<\/p><p>ROX index: it can be used as a trend indicator in hypoxemic respiratory failure treated with HFNC. It is calculated as (SpO2/FiO2) / respiratory rate. An improving ROX is a favorable sign; a low or worsening ROX, especially when associated with high FiO2, tachypnea, unfavorable LUS findings, or a concerning ABG, should prompt rapid reassessment of the strategy. ROX does not make the decision by itself; it helps avoid underestimating treatment failure.<\/p><p>Warning signs during HFNC: persistently high FiO2, respiratory rate that does not decrease, increased work of breathing, worsening mental status, rising PaCO2, increasing lactate, worsening LUS, or the appearance of consolidations/progressive loss of aeration. In these situations, simply increasing flow or FiO2 is not enough: NIV, intubation, or treatment of the underlying cause must be reconsidered.<\/p><p>CPAP<\/p><p>Continuous positive airway pressure (CPAP) applies positive pressure to the airways and respiratory system throughout the entire respiratory cycle. Unlike pressure-support ventilation, it does not provide an inspiratory pressure increase above the expiratory level: the patient breathes spontaneously on an almost constant pressure level, measurable at end-expiration as positive end-expiratory pressure (PEEP). CPAP should therefore not be considered inspiratory assistance, but rather continuous positive-pressure support aimed primarily at improving aeration, oxygenation, and the stability of recruitable alveolar units.<\/p><p>CPAP acts mainly on aeration and oxygenation. It is particularly useful when the dominant problem is alveolar collapse or congestion: cardiogenic pulmonary edema, postoperative atelectasis, or potentially recruitable loss of aeration. It must be distinguished from NIV-PS, in which the ventilator adds inspiratory pressure above the expiratory pressure level [6,7].<\/p><p>Practical limitation: when the main problem is ventilatory fatigue with hypercapnia, CPAP alone may be insufficient. If the lung is not recruitable, increasing airway pressure may worsen comfort, cause gastric distension and/or pulmonary hyperinflation, and may not be hemodynamically tolerated.<\/p><p>If the patient is hypercapnic, tachypneic, and fatigued, one should consider whether true inspiratory assistance, namely NIV-PS, would be more appropriate.<\/p><p>Non-invasive ventilation with pressure support — NIV-PS<\/p><p>Non-invasive ventilation with pressure support (NIV-PS) uses two pressure levels: an expiratory positive pressure, termed Expiratory Positive Airway Pressure (EPAP) in BiLevel/NIV modes and conceptually analogous to PEEP, and an inspiratory pressure, termed Inspiratory Positive Airway Pressure (IPAP). The mathematical difference between IPAP and EPAP is the pressure support, that is, the effective inspiratory assistance.<\/p><p>EPAP acts mainly on oxygenation, recruitment, and counterbalancing auto-PEEP. Pressure support acts mainly on alveolar ventilation and reduction of inspiratory muscle workload.<\/p><p>NIV-PS is the reference mode when the dominant problem is ventilatory: acute COPD exacerbation with respiratory acidosis, obesity hypoventilation, neuromuscular disease, respiratory muscle fatigue, and hypercapnia [1,8-10].<\/p><p>Practical limitation: insufficient support leaves the diaphragm overloaded; excessive support may produce over-assistance, asynchronies, excessive tidal volumes, and reduced diaphragmatic activity [11-13].<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_02.png\" alt=\"English teaching figure 2\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_02.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 1.2. CPAP vs NIV-PS. CPAP maintains continuous positive pressure. During pressure-support NIV, the ventilator delivers an inspiratory pressure above EPAP up to IPAP; the difference between the two levels corresponds to pressure support.<\/p><h4>The two main adjustable parameters in NIV-PS: EPAP/PEEP and pressure support<\/h4><p>The most important distinction for practical setting is between EPAP/PEEP and pressure support.<\/p><p>EPAP/PEEP and pressure support are not interchangeable. If the problem is a “closed” lung, the focus is on expiratory pressure (EPAP/PEEP). If the problem is fatigued respiratory muscles, the focus is on inspiratory assistance (pressure support).<\/p><div style=\"overflow-x:auto\"><table><tr><th><p>Adjustable parameter<\/p><\/th><th><p>Main target<\/p><\/th><th><p>May help when…<\/p><\/th><th><p>May be harmful when…<\/p><\/th><\/tr><tr><td><p>EPAP/PEEP<\/p><\/td><td><p>Aeration, oxygenation, recruitment, auto-PEEP<\/p><\/td><td><p>edema, atelectasis, collapse, unstable small airways<\/p><\/td><td><p>non-recruitable lung, hyperinflation, vulnerable right ventricle, hypotension<\/p><\/td><\/tr><tr><td><p>Pressure support<\/p><\/td><td><p>Alveolar ventilation, PaCO2, work of breathing, diaphragm<\/p><\/td><td><p>hypercapnia, respiratory fatigue, overloaded diaphragm<\/p><\/td><td><p>excessive tidal volumes, asynchronies, over-assistance, large leaks<\/p><\/td><\/tr><\/table><\/div><p>Table 1.1. EPAP/PEEP and pressure support: main targets and risks to monitor.<\/p><p><figure class=\"manualFigure\"><img loading=\"lazy\" src=\"english_images/figure_03.png\" alt=\"English teaching figure 3\"><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"english_images/figure_03.png\" download>Download image<\/a><\/div><\/figure><\/p><p>Figure 1.3. EPAP/PEEP and pressure support: two different adjustable parameters. EPAP/PEEP and pressure support address different problems. The former acts mainly on aeration and oxygenation; the latter acts on inspiratory work and alveolar ventilation.<\/p><h4>What NIV-PS can do<\/h4><p>NIV-PS can improve oxygenation, recruit unstable lung regions, reduce work of breathing, increase alveolar ventilation, reduce PaCO2, rapidly improve cardiogenic pulmonary edema, and reduce the need for intubation in appropriately selected patients [1,6-9].<\/p><p>These effects are not automatic. They must be verified early through clinical assessment, arterial blood gas analysis (ABG), ventilator data, and ultrasound.<\/p><h4>What NIV cannot do<\/h4><p>NIV does not protect the airway, clear secretions, reopen an obstructed bronchus, treat pneumonia, correct shock, or by itself guarantee a reduction in work of breathing.<\/p><p>It can become harmful when it creates an appearance of stability and delays intubation. A typical warning pattern is a patient who maintains an acceptable SpO2 while remaining tachypneic and fatigued, requiring high FiO2, with unchanged or worsening LUS findings and a persistently hyperactive diaphragm [2,14,15].<\/p><h4>Pitfall to avoid<\/h4><p>The most common mistake is to consider SpO2 the only indicator of success. Oxygen saturation is necessary, but it is not sufficient: by itself it cannot distinguish between increased inspired FiO2, reduced shunt, improved alveolar ventilation, reduced dead space, or temporary compensation. NIV is truly effective when it improves oxygenation, ventilation, work of breathing, comfort, ABG, and, when relevant, the ultrasound pattern.<\/p><p>NIV should not be assessed by looking at the monitor alone. Evaluation must integrate information from the patient, the ventilator, ABG, and ultrasound, including, when indicated, the distribution of aeration loss, the characteristics of vertical artifacts, and serial ultrasound findings [16-19].<\/p><h4>References for Chapter 1<\/h4><p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, Navalesi P, Antonelli M, Brozek J, Conti G, Ferrer M, Guntupalli K, Jaber S, Keenan S, Mancebo J, Mehta S, Raoof S. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p><p>2. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, Prat G, Boulain T, Morawiec E, Cottereau A, Devaquet J, Nseir S, Razazi K, Mira JP, Argaud L, Chakarian JC, Ricard JD, Wittebole X, Chevalier S, Herbland A, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.<\/p><p>3. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, Heunks L, Frat JP, Longhini F, Nava S, Navalesi P, Pisani L, Renda T, Thille AW, Winck JC, Windisch W, Tonia T, Boyd J, Sotgiu G, Scala R. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p><p>4. Nishimura M. High-flow nasal cannula oxygen therapy in adults: physiological benefits, indication, clinical benefits, and adverse effects. Respir Care. 2016;61(4):529-541. doi:10.4187/respcare.04577.<\/p><p>5. Roca O, Messika J, Caralt B, García-de-Acilu M, Sztrymf B, Ricard JD, Masclans JR. Predicting success of high-flow nasal cannula in pneumonia patients with acute hypoxemic respiratory failure: the utility of the ROX index. J Crit Care. 2016;35:200-205. doi:10.1016/j.jcrc.2016.05.022.<\/p><p>6. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124.<\/p><p>7. Gray A, Goodacre S, Newby DE, Masson M, Sampson F, Nicholl J; 3CPO Trialists. Noninvasive ventilation in acute cardiogenic pulmonary edema. N Engl J Med. 2008;359(2):142-151. doi:10.1056/NEJMoa0707992.<\/p><p>8. Brochard L, Mancebo J, Wysocki M, Lofaso F, Conti G, Rauss A, Simonneau G, Benito S, Gasparetto A, Lemaire F, Isabey D, Harf A. Noninvasive ventilation for acute exacerbations of chronic obstructive pulmonary disease. N Engl J Med. 1995;333(13):817-822. doi:10.1056/NEJM199509283331301.<\/p><p>9. Plant PK, Owen JL, Elliott MW. Early use of non-invasive ventilation for acute exacerbations of chronic obstructive pulmonary disease on general respiratory wards: a multicentre randomised controlled trial. Lancet. 2000;355(9219):1931-1935. doi:10.1016/S0140-6736(00)02323-0.<\/p><p>10. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p><p>11. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412.<\/p><p>12. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, Goligher EC, Heunks LMA, Lim EHT, Mokkink LB, Soilemezi E, Shi Z, Umbrello M, Vetrugno L, Vivier E, Xu L, Zambon M, Tuinman PR. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5.<\/p><p>13. Goligher EC, Fan E, Herridge MS, Murray A, Vorona S, Brace D, Rittayamai N, Lanys A, Tomlinson G, Singh JM, Bolz SS, Rubenfeld GD, Kavanagh BP, Brochard LJ, Ferguson ND. Evolution of diaphragm thickness during mechanical ventilation: impact of inspiratory effort. Am J Respir Crit Care Med. 2015;192(9):1080-1088. doi:10.1164/rccm.201503-0620OC.<\/p><p>14. Hernández G, Vaquero C, González P, Subira C, Frutos-Vivar F, Rialp G, Laborda C, Colinas L, Cuena R, Fernández R. Effect of postextubation high-flow nasal cannula vs noninvasive ventilation on reintubation and postextubation respiratory failure in high-risk patients: a randomized clinical trial. JAMA. 2016;316(15):1565-1574. doi:10.1001/jama.2016.14194.<\/p><p>15. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, Schortgen F, Brochard L, Brun-Buisson C, Mekontso Dessap A. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p><p>16. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p><p>17. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116.<\/p><p>18. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397.<\/p><p>19. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, Melniker L, Gargani L, Noble VE, Via G, Dean A, Tsung JW, Soldati G, Copetti R, Bouhemad B, Reissig A, Agricola E, Rouby JJ, Arbelot C, Liteplo A, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p>", "plain": " Practical objective  Before using ultrasound to guide non-invasive ventilation, it is essential to clarify exactly what is being set. In clinical practice, “NIV” is often used to refer to any form of respiratory support delivered without an endotracheal airway (endotracheal tube or tracheostomy), but conventional oxygen therapy, HFNC (high-flow nasal cannula), CPAP (continuous positive airway pressure), and NIV-PS (non-invasive ventilation with pressure support) do not have the same physiological meaning.  The basic concept is simple: each type of support addresses a different problem and has a different target. If the dominant problem is mild hypoxemia, increasing the amount of oxygen inspired by the patient (FiO2) may be sufficient. If the problem is loss of aeration or alveolar collapse, continuous positive airway pressure (CPAP) is required. If the problem is alveolar ventilation or respiratory muscle fatigue, inspiratory support is needed. If the problem is a severely heterogeneous lung with high respiratory drive, prolonged non-invasive support may become dangerous because it can delay the appropriate therapeutic escalation, namely invasive mechanical ventilation [1,2].  The initial question is therefore not: “Should I start NIV?” The correct question is:  what problem do I want to correct with non-invasive support? What is my target?      Download image     Figure 1.1. The spectrum of non-invasive respiratory support. Conventional oxygen therapy, HFNC, CPAP, and pressure-support NIV represent different levels of intervention. They are not equivalent: they increase FiO2, flow, continuous pressure, or inspiratory support in different ways.  Non-invasive respiratory support modalities  Conventional oxygen therapy  Conventional oxygen therapy increases FiO2 but does not provide significant positive pressure and does not substantially reduce the work of breathing. It may be sufficient in mild hypoxemia when the patient is stable, respiratory rate is controlled, and there is no acidosis or evidence of respiratory muscle fatigue.  Practical limitation: it may improve SpO2 without changing lung mechanics or pathophysiology, that is, without reducing shunt, correcting increased dead space, or decreasing respiratory muscle workload. A better SpO2 does not automatically mean effective alveolar ventilation or reduced work of breathing.  For these reasons, conventional oxygen therapy should not be considered a form of respiratory support.  HFNC  High-flow nasal cannula (HFNC) delivers heated and humidified gas at high flow rates with adjustable FiO2. Its main effects are to provide a stable FiO2, reduce anatomical dead space, improve patient comfort, humidify the airways, and generate a modest positive-pressure effect, which varies according to flow, open- or closed-mouth breathing, and the patient’s respiratory mechanics.  It is useful in mild-to-moderate hypoxemic respiratory failure, particularly in patients who are awake, cooperative, not significantly hypercapnic, and without marked respiratory muscle fatigue.  Practical limitation: HFNC can improve patient comfort even when the work of breathing remains high. It therefore requires careful monitoring of respiratory rate, SpO2/FiO2, the ROX index (SpO2/FiO2 divided by respiratory rate), lung ultrasound, and, when feasible, diaphragm assessment.  HFNC in practice: indications, monitoring, and failure  HFNC should be regarded as a minimally invasive form of non-invasive respiratory support, particularly useful when the dominant problem is hypoxemia in an awake, cooperative patient who can protect the airway. It does not replace NIV-PS when the main problem is hypercapnic respiratory acidosis with respiratory pump fatigue, and it must not delay intubation in a hypoxemic patient with high respiratory drive and progressive deterioration [3-5].  Practical setup: select appropriately sized cannulae, start with flows generally between 40 and 60 L/min if tolerated, set FiO2 to achieve the appropriate oxygen saturation target, and always ensure heating and humidification. In patients with COPD or hypercapnia, the SpO2 target should be conservative, generally 88–92%, unless otherwise clinically indicated [3,4].  At 30–60 minutes, reassess SpO2/FiO2, respiratory rate, work of breathing, targeted lung ultrasound (LUS), and arterial blood gas analysis (ABG).  ROX index: it can be used as a trend indicator in hypoxemic respiratory failure treated with HFNC. It is calculated as (SpO2/FiO2) / respiratory rate. An improving ROX is a favorable sign; a low or worsening ROX, especially when associated with high FiO2, tachypnea, unfavorable LUS findings, or a concerning ABG, should prompt rapid reassessment of the strategy. ROX does not make the decision by itself; it helps avoid underestimating treatment failure.  Warning signs during HFNC: persistently high FiO2, respiratory rate that does not decrease, increased work of breathing, worsening mental status, rising PaCO2, increasing lactate, worsening LUS, or the appearance of consolidations/progressive loss of aeration. In these situations, simply increasing flow or FiO2 is not enough: NIV, intubation, or treatment of the underlying cause must be reconsidered.  CPAP  Continuous positive airway pressure (CPAP) applies positive pressure to the airways and respiratory system throughout the entire respiratory cycle. Unlike pressure-support ventilation, it does not provide an inspiratory pressure increase above the expiratory level: the patient breathes spontaneously on an almost constant pressure level, measurable at end-expiration as positive end-expiratory pressure (PEEP). CPAP should therefore not be considered inspiratory assistance, but rather continuous positive-pressure support aimed primarily at improving aeration, oxygenation, and the stability of recruitable alveolar units.  CPAP acts mainly on aeration and oxygenation. It is particularly useful when the dominant problem is alveolar collapse or congestion: cardiogenic pulmonary edema, postoperative atelectasis, or potentially recruitable loss of aeration. It must be distinguished from NIV-PS, in which the ventilator adds inspiratory pressure above the expiratory pressure level [6,7].  Practical limitation: when the main problem is ventilatory fatigue with hypercapnia, CPAP alone may be insufficient. If the lung is not recruitable, increasing airway pressure may worsen comfort, cause gastric distension and/or pulmonary hyperinflation, and may not be hemodynamically tolerated.  If the patient is hypercapnic, tachypneic, and fatigued, one should consider whether true inspiratory assistance, namely NIV-PS, would be more appropriate.  Non-invasive ventilation with pressure support — NIV-PS  Non-invasive ventilation with pressure support (NIV-PS) uses two pressure levels: an expiratory positive pressure, termed Expiratory Positive Airway Pressure (EPAP) in BiLevel/NIV modes and conceptually analogous to PEEP, and an inspiratory pressure, termed Inspiratory Positive Airway Pressure (IPAP). The mathematical difference between IPAP and EPAP is the pressure support, that is, the effective inspiratory assistance.  EPAP acts mainly on oxygenation, recruitment, and counterbalancing auto-PEEP. Pressure support acts mainly on alveolar ventilation and reduction of inspiratory muscle workload.  NIV-PS is the reference mode when the dominant problem is ventilatory: acute COPD exacerbation with respiratory acidosis, obesity hypoventilation, neuromuscular disease, respiratory muscle fatigue, and hypercapnia [1,8-10].  Practical limitation: insufficient support leaves the diaphragm overloaded; excessive support may produce over-assistance, asynchronies, excessive tidal volumes, and reduced diaphragmatic activity [11-13].      Download image     Figure 1.2. CPAP vs NIV-PS. CPAP maintains continuous positive pressure. During pressure-support NIV, the ventilator delivers an inspiratory pressure above EPAP up to IPAP; the difference between the two levels corresponds to pressure support.  The two main adjustable parameters in NIV-PS: EPAP/PEEP and pressure support  The most important distinction for practical setting is between EPAP/PEEP and pressure support.  EPAP/PEEP and pressure support are not interchangeable. If the problem is a “closed” lung, the focus is on expiratory pressure (EPAP/PEEP). If the problem is fatigued respiratory muscles, the focus is on inspiratory assistance (pressure support).      Adjustable parameter    Main target    May help when…    May be harmful when…      EPAP/PEEP    Aeration, oxygenation, recruitment, auto-PEEP    edema, atelectasis, collapse, unstable small airways    non-recruitable lung, hyperinflation, vulnerable right ventricle, hypotension      Pressure support    Alveolar ventilation, PaCO2, work of breathing, diaphragm    hypercapnia, respiratory fatigue, overloaded diaphragm    excessive tidal volumes, asynchronies, over-assistance, large leaks      Table 1.1. EPAP/PEEP and pressure support: main targets and risks to monitor.      Download image     Figure 1.3. EPAP/PEEP and pressure support: two different adjustable parameters. EPAP/PEEP and pressure support address different problems. The former acts mainly on aeration and oxygenation; the latter acts on inspiratory work and alveolar ventilation.  What NIV-PS can do  NIV-PS can improve oxygenation, recruit unstable lung regions, reduce work of breathing, increase alveolar ventilation, reduce PaCO2, rapidly improve cardiogenic pulmonary edema, and reduce the need for intubation in appropriately selected patients [1,6-9].  These effects are not automatic. They must be verified early through clinical assessment, arterial blood gas analysis (ABG), ventilator data, and ultrasound.  What NIV cannot do  NIV does not protect the airway, clear secretions, reopen an obstructed bronchus, treat pneumonia, correct shock, or by itself guarantee a reduction in work of breathing.  It can become harmful when it creates an appearance of stability and delays intubation. A typical warning pattern is a patient who maintains an acceptable SpO2 while remaining tachypneic and fatigued, requiring high FiO2, with unchanged or worsening LUS findings and a persistently hyperactive diaphragm [2,14,15].  Pitfall to avoid  The most common mistake is to consider SpO2 the only indicator of success. Oxygen saturation is necessary, but it is not sufficient: by itself it cannot distinguish between increased inspired FiO2, reduced shunt, improved alveolar ventilation, reduced dead space, or temporary compensation. NIV is truly effective when it improves oxygenation, ventilation, work of breathing, comfort, ABG, and, when relevant, the ultrasound pattern.  NIV should not be assessed by looking at the monitor alone. Evaluation must integrate information from the patient, the ventilator, ABG, and ultrasound, including, when indicated, the distribution of aeration loss, the characteristics of vertical artifacts, and serial ultrasound findings [16-19].  References for Chapter 1  1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, Navalesi P, Antonelli M, Brozek J, Conti G, Ferrer M, Guntupalli K, Jaber S, Keenan S, Mancebo J, Mehta S, Raoof S. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.  2. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, Prat G, Boulain T, Morawiec E, Cottereau A, Devaquet J, Nseir S, Razazi K, Mira JP, Argaud L, Chakarian JC, Ricard JD, Witteb
